// 61 §46
{info:`<h4>Чому громада важлива</h4>
<p>Людина — соціальна істота: вона живе в сім’ї, серед друзів і сусідів, у школі, спортивній команді, онлайн-спільноті. У спільнотах люди спілкуються, розв’язують спільні проблеми, створюють правила.</p>
<ul><li><b>Громади</b> виникли ще за первісності: <b>родові</b>, а згодом <b>сусідські</b> общини, що користувалися спільною територією за правилами.</li>
<li>Великими громадами були громадяни грецьких полісів, Римської республіки; в одних державах правив монарх, в інших — існувало <b>самоврядування</b> (народні збори, виборні органи).</li>
<li>Народна мудрість: «У громаді жити — громаді служити», «Громада — великий чоловік».</li>
<li>Іван Франко в повісті «Захар Беркут» показав, що громаду, яка тримається разом, «всі за одного, а один за всіх», не здолає жоден ворог.</li></ul>
<h4>Територіальна громада і місцеве самоврядування</h4>
<ul><li><b>Територіальна громада</b> — мешканці села, селища чи міста (або кількох), об’єднані спільним проживанням та інтересами. Членом громади стають за народженням або переїхавши на проживання.</li>
<li>Громада розв’язує місцеві проблеми: транспорт, екологія, освіта, дозвілля.</li>
<li>Управляють громадою <b>органи місцевого самоврядування</b> — місцеві ради та їхні голови, яких обирають мешканці від <b>18 років</b>.</li></ul>
<h4>Громадянські ініціативи</h4>
<ul><li>Люди можуть впливати на владу: звернення, <b>петиції</b>, зустрічі з депутатами, місцевий референдум, суд.</li>
<li><b>Громадянська ініціатива</b> — гуртування громадян для самостійного розв’язання проблем, передусім місцевих.</li>
<li>Приклади: «Розвиток» (оновлення Конотопа), «Зробимо Україну чистою», «Споживай українське»; флешмоби, толоки, збирання вторсировини.</li></ul>`,

{info:`<h4>Демократична шкільна спільнота</h4>
<ul><li>В освіті завжди взаємодіють учні та вчителі, але в різні часи їхні права й обов’язки були різними.</li>
<li>Демократичну <b>шкільну спільноту</b> відрізняють партнерські стосунки вчителів і учнів, дієве <b>учнівське самоврядування</b>, участь батьків, турбота й спільні справи.</li>
<li>В Україні можна навчатися очно, дистанційно, на сімейній (домашній) формі чи екстернатом.</li></ul>
<h4>Школа в давнину і тепер</h4>
<ul><li>Школи були вже в Стародавньому Єгипті, Китаї, Індії. Європейська освіта бере початок у <b>Стародавній Греції</b>, де виховували гідних громадян полісу.</li>
<li>У Римі багато уваги приділяли спорту; учителями початкової школи часто були вільновідпущені раби.</li>
<li>У давніх школах панувала сувора дисципліна, неслухняних карали.</li>
<li>Нині права й обов’язки визначають <b>Закон України «Про освіту»</b> та <b>Статут</b> закладу освіти.</li>
<li><b>Права учнів</b>: навчання в безпечних умовах, вибір форми навчання й гуртків, користування базою школи, участь в олімпіадах і конкурсах.</li>
<li><b>Обов’язки</b>: дотримуватися моральних та етичних норм, сумлінно здобувати знання, поважати інших.</li></ul>
<h4>Академічна доброчесність</h4>
<ul><li><b>Академічна доброчесність</b> — етичні правила, яких мають дотримуватися всі учасники освітнього процесу, щоб довіряти результатам навчання.</li>
<li>Це: <b>самостійне виконання завдань</b>, чесне здобування оцінок, посилання на джерела, повага до авторів, об’єктивне оцінювання вчителями.</li>
<li>Порушення — <b>плагіат</b> (видавання чужої роботи за свою), списування, «копіювати — вставити» без посилання.</li></ul>`,

// 63 §48
{info:`<h4>Що таке права людини</h4>
<p>Людина потребує їжі, житла, одягу, а також освіти, роботи, свободи, рівних прав з іншими. <b>Права людини</b> — можливості, необхідні для її існування та розвитку. Вони належать людині <b>від народження</b>. Держава не «дарує» права, але мусить закріплювати їх у законах і захищати.</p>
<h4>Як утверджувалися права людини</h4>
<table class="tbl"><tr><th>Документ</th><th>Що закріпив</th></tr>
<tr><td><b>Велика хартія вольностей</b> (Англія, 1215 р.)</td><td>Жодну вільну людину не можна заарештувати чи позбавити майна без законного вироку.</td></tr>
<tr><td><b>Конституція Пилипа Орлика</b> (1710 р.)</td><td>Гетьман мав захищати козаків і простий народ від утисків і надмірних поборів.</td></tr>
<tr><td><b>Декларація прав людини і громадянина</b> (Франція, 1789 р.)</td><td>Нікого не можна звинуватити чи заарештувати інакше, як за законом.</td></tr>
<tr><td><b>Білль про права</b> (США, 1789 р.)</td><td>Нікого не можна позбавити життя, свободи чи власності без суду.</td></tr>
<tr><td><b>Загальна декларація прав людини</b> (ООН, <b>10 грудня 1948 р.</b>)</td><td>Ухвалена після жахів Другої світової війни й Голокосту; основа сучасних прав людини.</td></tr></table>
<p>У демократичних державах права людини закріплені в <b>конституціях</b>.</p>
<h4>Права людини — загальнолюдська цінність</h4>
<ul><li>Права людини притаманні всім. Їх не можна втратити, відібрати чи скасувати; людина не може відмовитися від них.</li>
<li>Опорні «стовпи» прав — <b>гідність</b> і <b>рівність</b>: права належать усім незалежно від походження, статків чи інших ознак.</li>
<li>Ідею прав людини підтримують усі світові культури, релігії й демократичні держави; влада має бути обмежена обов’язком забезпечувати права громадян.</li></ul>`,

// 64 §49
{info:`<h4>Права дитини</h4>
<ul><li>Діти мають особливі <b>права дитини</b> — права «розвитку», адже через фізичну, розумову й духовну незрілість їм важче, ніж дорослим, відстояти себе.</li>
<li>У <b>1989 р.</b> ООН ухвалила <b>Конвенцію про права дитини</b>. Вона не лише перелічує права, а й визначає <b>обов’язки держав</b> щодо дітей.</li>
<li>За Конвенцією, <b>дитина</b> — кожна людина до <b>18 років</b>.</li>
<li>Кожна дитина має рівні права незалежно від раси, статі, мови, релігії, національності, статків, здоров’я.</li>
<li>Принципи Конвенції: <b>недискримінація</b>; <b>найкращі інтереси дитини</b>; право на <b>життя, виживання й розвиток</b>; <b>повага до поглядів дитини</b>.</li>
<li>Серед прав: на ім’я та громадянство, освіту, охорону здоров’я, відпочинок і дозвілля, захист від насильства, висловлення власної думки.</li></ul>
<h4>Як захистити права</h4>
<ul><li>Права людини — це відносини людини й держави, тому <b>порушити їх може держава</b> (її органи, посадовці). Це треба відрізняти від <b>правопорушень</b> між людьми (наприклад, бійки чи погрози).</li>
<li>В Україні права захищають: Президент, <b>Уповноважений Верховної Ради з прав людини</b> (омбудсман), суд, прокуратура, поліція, <b>служба у справах дітей</b>, правозахисні організації.</li>
<li>Права дитини захищають батьки або ті, хто їх заміняє (опікуни).</li>
<li>Дитина може звернутися до органу опіки й піклування, органів влади, громадських організацій, а з <b>14 років</b> — до суду.</li>
<li>Громадяни України можуть звертатися до <b>Європейського суду з прав людини</b>.</li>
<li>Без активної позиції самої людини захистити права важко.</li></ul>`,

// 65 §50
{info:`<h4>Толерантність</h4>
<ul><li>Суспільство і в давнину, і нині — <b>різноманітне</b>: люди різняться зовнішністю, походженням, заняттями, віком, можливостями, переконаннями, релігією.</li>
<li><b>Рівність</b> означає, що не можна судити про людину за ознаками, не пов’язаними з її гідністю.</li>
<li><b>Толерантність</b> — повага, сприйняття й розуміння розмаїття людей і культур; терпимість до іншого світогляду, способу життя, звичаїв.</li>
<li>Толерантність — не поблажливість, а <b>активна позиція</b> на основі прав людини; вона допомагає перейти від культури війни до <b>культури миру</b>.</li>
<li>Гасло: <b>«Всі різні — всі рівні»</b>.</li></ul>
<h4>Дискримінація</h4>
<ul><li>У давніх державах становище людей було нерівним: в Афінах і Римі жінки не брали участі в політиці, раби не мали жодних прав, в Індії існували варни й недоторканні.</li>
<li><b>Дискримінація</b> — будь-які виключення, обмеження чи переваги, що заперечують або зменшують рівне здійснення прав. Це пряме порушення прав людини.</li>
<li>Вона часто ґрунтується на <b>стереотипах</b> і <b>упередженнях</b>.</li>
<li>Види: за статтю, національністю, мовою, релігією, віком тощо.</li>
<li>Прояви: уникання, психологічний тиск, нерівні умови, приниження, ненависть, насильство.</li></ul>
<h4>Мова ворожнечі</h4>
<ul><li><b>Мова ворожнечі</b> — дискримінаційні, принизливі чи агресивні висловлювання щодо груп людей або окремих людей як їх представників.</li>
<li>Трапляється у фільмах, медіа, соцмережах, піснях, зображеннях.</li>
<li>Вона розколює суспільство й може призвести до насильства, тому заборонена міжнародними документами. Але такі заборони не мають обмежувати свободу слова.</li></ul>`,

["Між якими річками була прабатьківщина слов’ян?",["Віслою і Дніпром","Тигром і Євфратом","Нілом і Йорданом","Тибром і По"],0],
["Що таке сталий розвиток?",["Розвиток без шкоди для майбутніх поколінь","Розвиток лише промисловості","Відмова від технологій","Повернення до первісного життя"],0],
["Який документ ООН захищає права дітей?",["Конвенція про права дитини","Закони ХІІ таблиць","Міланський едикт","Велика хартія вольностей"],0]]}
);


const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));


const SEC_STYLE = [
  {c:"#B4532A", i:"📜"}, {c:"#3B5BA9", i:"🔥"}, {c:"#7A5A2E", i:"🏺"},
  {c:"#A3243B", i:"🏛️"}, {c:"#1F7A72", i:"🦅"}, {c:"#6D3F8F", i:"🤝"}, {c:"#8A6A1F", i:"🏛️"}
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("ih6_done") || {};
const SECTIONS = [];
LESSONS.forEach((l, i) => {
  let s = SECTIONS[SECTIONS.length - 1]; if (s && s.name !== l.section) s = null;
  if (!s) { s = {name:l.section, items:[], st:SEC_STYLE[SECTIONS.length % SEC_STYLE.length]};
    const m = /^Розділ\s+([IVXІ\d]+)\.\s*(.*)$/.exec(l.section);
    s.lab = m ? m[1] : ""; s.short = m ? m[2] : l.section.replace(/^Вступ\.\s*/, ""); SECTIONS.push(s); }
  s.items.push(i); l.sec = s; l.tnum = s.items.length;
});
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
let q = "";
function renderHome(){
  const total = LESSONS.length, dn = LESSONS.filter((_, i) => done[i + 1]).length;
  $("#app").innerHTML = `
  <section class="hero">
    <div>
      <div class="kick">Ліцей «ЯСНО» · 6 клас · Машина часу</div>
      <h1>Досліджуємо <em>історію</em> і суспільство</h1>
      <p>Подорож у минуле за календарно-тематичним плануванням: головне з параграфа, ключові поняття-картки і тест до кожної теми.</p>
      <div class="prog"><div class="row"><span>Твій шлях</span><span>${dn} з ${total} тем</span></div><div class="tr"><i style="width:${100 * dn / total}%"></i></div></div>
    </div>
    <div class="eras">${SECTIONS.map((s, si) => `<a class="era" href="#sec${si}" style="--c:${s.st.c}"><span class="ic">${s.st.i}</span><span><small>${s.lab ? "Розділ " + esc(s.lab) : "Вступ"}</small><b>${esc(s.short)}</b></span></a>`).join("")}</div>
  </section>
  <input class="search" id="search" type="search" placeholder="Знайти тему або поняття…" value="${esc(q)}" aria-label="Пошук">
  <div class="tl" id="tl"></div>
  <p class="foot">Підручник: ${esc(typeof BOOK_NAME !== "undefined" ? BOOK_NAME : "")}<br>Результати тестів зберігаються лише у твоєму браузері.</p>`;
  const S = $("#search"); S.oninput = () => { q = S.value; drawTL(); };
  drawTL();
  document.title = "Досліджуємо історію і суспільство · 6 клас";
}
function drawTL(){
  const t = q.trim().toLowerCase(); let any = false;
  $("#tl").innerHTML = SECTIONS.map((s, si) => {
    const items = s.items.filter(i => { const l = LESSONS[i]; return !t || (l.title + " " + (l.terms || []).map(x => x[0]).join(" ")).toLowerCase().includes(t); });
    if (!items.length) return ""; any = true;
    const d = s.items.filter(i => done[i + 1]).length;
    return `<section class="ep" id="sec${si}" style="--c:${s.st.c}">
      <div class="ep-n">${s.lab || "★"}</div>
      <div class="ep-h"><div><small>${s.st.i} ${s.lab ? "Розділ " + esc(s.lab) : "Вступ"}</small><h2>${esc(s.short)}</h2></div><span class="cnt">${d} / ${s.items.length} пройдено</span></div>
      <div class="cards">${items.map(i => { const l = LESSONS[i]; return `<a class="card" href="#${i + 1}">${done[i + 1] ? '<span class="chk">✓</span>' : ""}
        <span class="tn">Тема ${l.tnum}${l.diag ? " · тренувальна" : ""}</span><span class="tt">${esc(l.title)}</span>
        <span class="tags">${(l.terms || []).slice(0, 3).map(x => `<span>${esc(x[0])}</span>`).join("")}</span></a>`; }).join("")}</div>
    </section>`;
  }).join("") || "";
  if (!any) $("#tl").innerHTML = '<p class="empty">Нічого не знайдено. Спробуй інше слово.</p>';
}
function shuffle(a, seed){ const r = a.slice(); let s = seed; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function renderLesson(i){
  const l = LESSONS[i], n = i + 1, s = l.sec, si = SECTIONS.indexOf(s);
  const qs = (l.q || []).map((qq, qi) => { const order = shuffle(qq[1].map((_, k) => k), n * 31 + qi * 7 + 3);
    return `<div class="qst" data-c="${qq[2]}"><div class="qt">${qi + 1}. ${esc(qq[0])}</div><div class="opts">` + order.map(k => `<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(qq[1][k])}</span></label>`).join("") + `</div></div>`; }).join("");
  const pl = i > 0 ? LESSONS[i - 1] : null, nl = i < LESSONS.length - 1 ? LESSONS[i + 1] : null;
  const navA = (x, k, cls) => x ? `<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls === "next" ? "Далі →" : "← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>` : "";
  const terms = l.terms || [];
  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div class="crumb"><a href="#">← Усі теми</a><span>·</span><a href="#sec${si}">${s.lab ? "Розділ " + esc(s.lab) : "Вступ"}: ${esc(s.short)}</a></div>
    <div class="lhead"><span class="big">${l.tnum}</span>
      <div class="tn">${s.st.i} ${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1>
      <div class="chips">${l.codes ? l.codes.split(/,\s*/).map(c => `<span class="chip">${esc(c)}</span>`).join("") : ""}${l.pages ? `<span class="chip">📖 ${esc(l.pages)}</span>` : ""}<span class="chip">${terms.length} понять</span><span class="chip">${(l.q || []).length} ${qWord((l.q || []).length)}</span>${done[n] ? '<span class="chip">✓ Пройдено</span>' : ""}</div>
    </div>
    ${l.diag ? `<div class="panel" style="margin-top:18px;border-left:5px solid var(--gold)"><b>📝 Тренувальна діагностувальна робота.</b> Виконай завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div>` : ""}
    <div class="lgrid">
      <div>
        <div class="panel"><h2 class="ph"><span class="bi">📜</span>Головне з теми</h2>
          ${l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : ""}<div class="prose">${l.info || ""}</div></div>
        ${qs ? `<div class="panel quiz" id="test"><h2 class="ph"><span class="bi">✓</span>${l.diag ? "Тренувальні завдання" : "Перевір себе"}</h2>${qs}
          <div class="actions"><button class="btn" id="check" type="button">Перевірити</button><button class="btn ghost" id="reset" type="button">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>` : ""}
        <div class="nav">${navA(pl, n - 1, "prev")}${navA(nl, n + 1, "next")}</div>
      </div>
      <aside class="side">
        ${terms.length ? `<div class="panel"><h3>Ключові поняття</h3><button class="small" id="flipAll" type="button">Сховати значення</button>
          <div class="flash">${terms.map(t => `<button class="fc" type="button"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></button>`).join("")}</div></div>` : ""}
        <div class="panel toc"><h3>${s.lab ? "Розділ " + esc(s.lab) : "Вступ"}</h3>${s.items.map(k => `<a href="#${k + 1}" ${k === i ? 'aria-current="true"' : ""}><span class="n">${LESSONS[k].tnum}</span><span>${esc(LESSONS[k].title)}</span></a>`).join("")}</div>
      </aside>
    </div></div>`;
  const F = [...document.querySelectorAll(".fc")];
  F.forEach(f => f.onclick = () => f.classList.toggle("closed"));
  const fa = $("#flipAll"); if (fa) fa.onclick = () => { const c = !F[0].classList.contains("closed"); F.forEach(f => f.classList.toggle("closed", c)); fa.textContent = c ? "Показати значення" : "Сховати значення"; };
  if (qs) {
    $("#check").onclick = () => { let ok = 0; const all = document.querySelectorAll(".qst");
      all.forEach(x => { const c = x.dataset.c, sel = x.querySelector("input:checked");
        x.querySelectorAll(".opt").forEach(o => { o.classList.remove("right", "wrong"); if (o.dataset.k === c) o.classList.add("right"); });
        if (sel) { if (sel.value === c) ok++; else sel.closest(".opt").classList.add("wrong"); } });
      const r = $("#res"), p = ok / all.length; r.className = "result show " + (p >= .75 ? "good" : "mid");
      r.textContent = `Правильних відповідей: ${ok} з ${all.length}. ` + (p === 1 ? "Чудово! 🏆" : p >= .75 ? "Добре! Переглянь позначені питання." : "Перечитай «Головне з теми» і спробуй ще раз.");
      if (p >= .75) { done[n] = true; store.set("ih6_done", done); } };
    $("#reset").onclick = () => { document.querySelectorAll(".qst input").forEach(x => x.checked = false); document.querySelectorAll(".opt").forEach(o => o.classList.remove("right", "wrong")); $("#res").className = "result"; };
  }
  document.title = `${l.title} · Досліджуємо історію і суспільство 6`;
}
function route(){
  const h = location.hash.slice(1);
  if (/^sec\d+$/.test(h)) { if (!$("#tl")) renderHome(); const el = document.getElementById(h); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const n = parseInt(h); if (n >= 1 && n <= LESSONS.length) renderLesson(n - 1); else renderHome(); window.scrollTo(0, 0);
}
function toggleTheme(){ const d = document.documentElement; const dark = d.dataset.theme ? d.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme = dark ? "light" : "dark"; store.set("ih6_theme", d.dataset.theme); }
const th = store.get("ih6_theme"); if (th) document.documentElement.dataset.theme = th;
window.addEventListener("hashchange", route);
route();
</script>
