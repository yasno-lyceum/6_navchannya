<html lang="uk">
<head>
<meta charset="UTF-8">

<title>Громадянська освіта · 6 клас</title>

<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;

:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.tbl{display:table}
@media(max-width:640px){.tbl{display:block;overflow-x:auto}}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.note{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--line,#ccc);background:rgba(127,127,127,.08);font-style:italic;font-size:14px;opacity:.9;border-radius:6px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}

.term b{color:var(--c)}

.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}

.result.mid{background:var(--bad-soft);color:var(--bad)}

.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}

{info:`<h4>Що таке громадянська освіта і для чого вона потрібна?</h4>
<p>Історія – це наука про минуле. А <b>громадянська освіта</b> – це наука про сучасне. Вона вивчає, як працює наше суспільство, держава і що означає бути громадянами. Цей шкільний предмет – немов інструкція, як поводитися, як жити з іншими людьми, поважати правила і робити світ кращим.</p>
<p>Ми будемо вчитися:</p>
<ul><li><b>Знати свої права і обов’язки.</b> Наприклад, ти маєш право ходити до школи, але також маєш обов’язок поважати вчителів і однокласників.</li>
<li><b>Вчитися поважати інших</b> – цінувати думки інших людей, культуру і традиції.</li>
<li><b>Бути активними</b> – зрозуміти, як ти можеш змінити щось на краще.</li>
<li><b>Ухвалювати розумні рішення</b> – думати, аналізувати і не вірити абсолютно всьому, що чуєш і бачиш, наприклад, у соцмережах.</li>
<li><b>Розуміти, як працює країна</b> – що таке закони, чому важливо голосувати і як громадяни беруть участь в управлінні країною.</li></ul>
<h4>М’які навички (soft skills)</h4>
<p><b>М’які навички</b> – особистісні якості, соціальні навички, які допомагають ефективно взаємодіяти, адаптуватися до різних ситуацій та досягати успіху. До них належать: комунікативні навички, робота в команді, критичне мислення, креативність, емоційний інтелект, тайм-менеджмент, стресостійкість, лідерство, адаптивність / гнучкість, вирішення проблем.</p>
<h4>Як ми можемо берегти і розвивати державні цінності?</h4>
<p><b>Цінності</b> – це те, що є для нас важливим, значущим та бажаним; це наші переконання і принципи, які визначають наші рішення, вчинки та ставлення до світу. Вони можуть бути індивідуальними (особистими) або спільними (для сім’ї, громади, нації).</p>
<p>В Україні цінностями є свобода, незалежність, справедливість, повага до інших, любов до рідної землі, української мови та культури. <b>Берегти</b> ці цінності – означає поважати їх і не дозволяти руйнувати. <b>Розвивати</b> – це робити їх ще кращими, щоб країна стала сильнішою і щасливішою.</p>
<h4>Як бути добрими громадянами?</h4>
<p>Основними рисами справжніх громадян є повага до своєї країни, її законів, активна участь у суспільному житті. <b>Громадяни</b> – це люди, які мають право приймати рішення стосовно шляху розвитку країни, обираючи місцеву і державну владу, підтверджене спеціальними документами (свідоцтво про народження, паспорт тощо).</p>
<p>Наявність прав накладає на громадян обов’язки, наприклад, відповідально ставитися до свого вибору, в разі потреби – захищати свою країну. Бути добрим громадянином / громадянкою – означає жити так, щоб своїми діями допомагати нашій країні та людям навколо. Це як бути хорошим гравцем у команді.</p>`,

{info:`<h4>Самопізнання, індивідуальність, гідність і честь</h4>
<p>Давньогрецькому філософу <b>Сократу</b> належить вислів: «Пізнай самого себе». Процес пізнання самого себе, усвідомлення який / яка Ти є насправді називається <b>самопізнанням</b>. Самопізнання допомагає Тобі стати кращою версією себе.</p>
<p>Кожна людина – неповторна. Поет <b>Василь Симоненко</b> сказав: «Усмішка твоя – єдина, очі твої – одні». Те, що робить людину особливою, своєрідність окремої людини, сукупність притаманних тільки їй особливостей називається її <b>індивідуальністю</b>.</p>
<ul><li><b>Гідність</b> – це усвідомлення власної цінності та цінності інших. Кожна людина є цінною, тому не можна ображати інших, а також не можна дозволяти нікому ображати тебе.</li>
<li><b>Честь</b> – це внутрішній моральний компас у подорожі життя. Він показує правильний шлях, навіть коли дорога нелегка.</li></ul>
<h4>«Мої» інтереси і світогляд</h4>
<p><b>Інтереси</b> – це заняття чи теми, які вам цікаво робити чи досліджувати. <b>Світогляд</b> – це як ваша особиста картина світу. Він формується під впливом: сім’ї та друзів; закладу освіти та навчання; книжок, фільмів та інтернету; власного досвіду. Ваші інтереси – ніби крила, а світогляд – це небо, куди ви летите.</p>
<h4>Я бережу природу</h4>
<p><b>Екологічна відповідальність</b> – це усвідомлення важливості природи як основи життя та необхідності дбати про неї щодня. Кожен може допомогти природі: сортувати сміття, економити воду й електроенергію, використовувати екосумки, не смітити на природі, брати участь в екологічних акціях. Ми є частиною природи, а не її господарями.</p>
<h4>Хто ми? Родина, клас, громада, держава</h4>
<p>Англійський поет <b>Джон Донн</b> написав: «Немає людини, що була б, як острів, сама по собі». Найпершою групою, членами якої ми стаємо, є наша родина, відтак – клас, громада і держава.</p>
<ul><li><b>Сім’я</b> – група людей, які живуть разом і пов’язані родинними зв’язками або шлюбом.</li>
<li><b>Клас</b> – група учнів, які разом навчаються в школі.</li>
<li><b>Громада</b> – група людей, які живуть на одній території та об’єднані спільними інтересами, правилами та турботами про своє місце проживання.</li>
<li><b>Держава</b> – велика група людей, які живуть на певній території та мають спільні закони, уряд, кордони та державні символи (герб, прапор, гімн).</li></ul>
<h4>Ввічливість, взаємоповага, шкільний етикет</h4>
<p><b>Ввічливість</b> – це вміння поводитися чемно й з повагою до інших людей. Ввічлива людина використовує «чарівні слова»: «Будь ласка», «Дякую», «Вибачте». <b>Взаємоповага</b> – це міцний місток, який з’єднує ваші серця з серцями інших. Ввічливість – це один із способів проявити взаємоповагу.</p>
<p><b>Шкільний етикет</b> – правила поведінки у школі: вітатися, приходити вчасно, піднімати руку, дбайливо ставитися до шкільного майна, не використовувати грубі слова, вирішувати конфлікти мирним шляхом, не брати чужих речей без дозволу.</p>`,
terms:[["Самопізнання","процес пізнання самого себе, усвідомлення, який / яка Ти є насправді"],["Індивідуальність","своєрідність окремої людини, сукупність притаманних тільки їй особливостей"],["Гідність","усвідомлення власної цінності та цінності інших"],["Честь","внутрішній моральний компас у подорожі життя"],["Світогляд","особиста картина світу"],["Екологічна відповідальність","усвідомлення важливості природи як основи життя та необхідності дбати про неї щодня"],["Ідентичність","відчуття приналежності та усвідомлення себе частиною певних груп"],["Громада","група людей, які живуть на одній території та об’єднані спільними інтересами, правилами й турботами"],["Ввічливість","вміння поводитися чемно й з повагою до інших людей"]],

{info:`<h4>Загальнолюдські цінності</h4>
<p><b>Загальнолюдські цінності</b> – це такі правила або ідеї, які важливі для всіх людей на нашій планеті, незалежно від того, де вони живуть, якою мовою говорять, якого кольору у них шкіра чи у що вони вірять. Це як спільні «скарби» для всього людства. Загальнолюдські цінності – це як компас, але чарівний – він показує дорогу до добра.</p>
<p>Ці цінності – це <b>життя, любов, мир, доброта, справедливість, гідність, повага, честь, свобода</b>.</p>
<ul><li>Допомагаєте хворій сусідці – це <b>доброта</b>.</li>
<li>Зізнаєтеся, що ненавмисне щось розбили, – це <b>чесність</b>.</li>
<li>Слухаєте мрію однокласника і не смієтеся – це <b>повага</b>.</li>
<li><b>Свобода</b> – коли ви можете сказати, що думаєте, і вас слухають; але ви не заважаєте іншим.</li></ul>
<h4>Різноманітність і рівність</h4>
<p><b>Різноманітність</b> – це коли люди, як квіти в букеті, мають свої особливості. Різноманітність – це багатство нашого світу.</p>
<p><b>Рівність</b> означає, що хоча ми всі різні, але ми всі є людьми і маємо однакову цінність та однакові права. Ніхто не може вважатися кращим чи гіршим за іншого через свої відмінності.</p>
<h4>Норми і правила</h4>
<ul><li><b>Норми</b> – загальноприйняті уявлення про те, як люди повинні поводитися в певних ситуаціях; неписані закони поведінки (вітатися, дякувати, не перебивати).</li>
<li><b>Правила</b> – більш чіткі та зафіксовані настанови про те, як потрібно діяти (закони, шкільні правила, правила дорожнього руху).</li></ul>
<p>Норми і правила створені не для того, щоб обмежувати, а щоб захищати.</p>
<h4>Права і обов’язки</h4>
<p><b>Права</b> – можливості та свободи, що забезпечуються державою та суспільством і є необхідними для повноцінного розвитку особистості. <b>Обов’язки</b> – дії, які людина повинна виконувати, щоб забезпечити функціонування суспільства та не порушувати права інших.</p>
<p>Права й обов’язки завжди йдуть разом, як два крила: без одного з них літак або птах не зможе летіти. Наприклад, ви маєте право висловлювати свою думку, але ваш обов’язок – слухати інших.</p>`,
terms:[["Загальнолюдські цінності","правила або ідеї, важливі для всіх людей на планеті"],["Громадянські цінності","важливі ідеї та правила, які допомагають жити разом у мирі"],["Різноманітність","особливості людей, що є багатством нашого світу"],["Рівність","однакова цінність та однакові права всіх людей"],["Норми","загальноприйняті уявлення про те, як люди повинні поводитися"],["Правила","чіткі та зафіксовані настанови про те, як потрібно діяти"],["Права","можливості та свободи, що забезпечуються державою та суспільством"],["Відповідальні громадяни","люди, які розуміють свої права та виконують свої обов’язки"]],

{info:`<h4>Що таке суспільство?</h4>
<p><b>Суспільство</b> – це велика група людей, які живуть разом на певній території, спілкуються між собою, працюють, навчаються, мають спільні інтереси, правила поведінки та культуру. Це як велика родина, тільки набагато більша!</p>
<p>Ознаки суспільства: група людей, територія, спілкування, спільні інтереси, правила, культура. У суспільстві кожен має свою роль: батьки дбають про дітей, учителі навчають, лікарі лікують.</p>
<h4>Як суспільство впливає на нас?</h4>
<p>Засвоюючи культуру суспільства, його норми та правила, ми поступово стаємо <b>особистостями</b> – неповторними та самостійними людьми. Першим і найважливішим осередком є <b>сім’я</b>: тут ми вчимося говорити рідною мовою, засвоюємо перші уявлення про добро і зло. Далі – <b>школа</b>, вчителі та однокласники. Суспільство передає нам свою культуру через традиції, пісні, казки. Іноді суспільство навчає нас і через труднощі.</p>
<h4>Як ми впливаємо на суспільство?</h4>
<p>Суспільство залежить від нас, і кожен із нас може зробити його кращим. Допомагаєте другу з домашнім завданням – робите клас дружнішим; прибираєте сміття у дворі – робите місто чистішим.</p>
<h4>Сфери життя суспільства</h4>
<table class="tbl"><tr><th>Сфера</th><th>Що охоплює</th></tr>
<tr><td>Політична</td><td>усе, що пов’язане з владою та управлінням країною або громадою</td></tr>
<tr><td>Економічна</td><td>усе, що стосується грошей, виробництва та споживання товарів і послуг</td></tr>
<tr><td>Соціальна</td><td>усе, що пов’язано зі стосунками між людьми та групами людей (заклади освіти, лікарні, пенсійне забезпечення, парки)</td></tr>
<tr><td>Духовна</td><td>усе, що стосується наших думок, релігії та культури</td></tr></table>
<p>Ці чотири сфери дуже пов’язані між собою і впливають одна на одну; вони, немов чотири стовпи, є основою суспільного життя.</p>
<h4>Дружба, командна робота</h4>
<p><b>Дружба</b> – це особливі стосунки між людьми, які поважають, підтримують і довіряють одне одному. Дружба будується на трьох важливих речах: <b>повага, довіра, допомога</b>. Дружити чи не дружити – ваше право, але це не означає, що ви можете ображати інших.</p>
<p><b>Командна робота</b> – це коли кілька людей об’єднуються, щоб досягти спільної мети. Важливі: спільна мета, розподіл ролей, спілкування, допомога, відповідальність. У дружбі головне – близькі стосунки, а в командній роботі – спільна мета.</p>`,
terms:[["Суспільство","велика група людей, які живуть разом на певній території, спілкуються, мають спільні інтереси, правила та культуру"],["Особистість","неповторна та самостійна людина"],["Політична сфера","усе, що пов’язане з владою та управлінням"],["Економічна сфера","усе, що стосується грошей, виробництва та споживання товарів і послуг"],["Соціальна сфера","усе, що пов’язано зі стосунками між людьми та групами людей"],["Духовна сфера","усе, що стосується думок, релігії та культури"],["Дружба","особливі стосунки між людьми, які поважають, підтримують і довіряють одне одному"],["Командна робота","об’єднання кількох людей для досягнення спільної мети"]],

{info:`<h4>Співпраця і конкуренція</h4>
<ul><li><b>Співпраця</b> – це коли люди працюють разом, щоб досягти спільної мети. Співпраця об’єднує.</li>
<li><b>Конкуренція</b> – це коли люди змагаються, щоб показати, хто кращий. Конкуренція спонукає бути кращим, але вона має бути чесною.</li></ul>
<p>Часто найкращі результати досягаються, коли ми вміємо і те, й інше: футболісти співпрацюють на полі, але конкурують за місце в основному складі.</p>
<h4>Академічна доброчесність</h4>
<p><b>Академічна доброчесність</b> – це грати за чесними правилами в навчанні: чесно виконувати шкільні завдання і поважати працю інших. Правила: робіть самі; поважайте інших (вказуйте, звідки взяли чужу ідею); будьте чесними (покладайтеся на свої знання, а не на шпаргалку). Якщо ви списали, ви не навчитеся, а лише обманюєте себе.</p>
<h4>Моральні основи поведінки в суспільстві</h4>
<p><b>Суспільна мораль</b> – це система спільних цінностей і правил, що визначають, як люди розрізняють добро і зло та взаємодіють один з одним.</p>
<ul><li><b>Добро</b> – все, що приносить користь, радість, щастя. <b>Зло</b>, навпаки, руйнує, шкодить, приносить біль і страждання. Наша внутрішня <b>совість</b> – «внутрішній голос», який підказує, як вчинити правильно. Притча про двох вовків: «Завжди перемагає той вовк, якого ти годуєш».</li>
<li><b>Повага</b> – це коли ви цінуєте інших людей, їхні думки і почуття. Поважати – це ставитися до інших так, як ви хотіли би, щоб ставилися до вас.</li>
<li><b>Відповідальність</b> – це розуміння того, що кожна наша дія має наслідки, і готовність ці наслідки приймати. Ваша бездіяльність – також відповідальність. Відповідальність – це не покарання, а усвідомлення.</li>
<li><b>Чесність</b> – це відповідність між тим, що ви говорите і робите, і тим, що є насправді. Брехня завжди породжує нову брехню, як снігова куля. Чесність – це не слабкість, а сила характеру.</li>
<li><b>Справедливість</b> – це ставлення до всіх людей за одними й тими ж чесними правилами, без винятків і упереджень. Справедливість – це не завжди рівність, але це завжди чесність у застосуванні правил.</li></ul>
<h4>Як ухвалювати етичні рішення</h4>
<ul><li>Поставити себе на місце іншої людини: чи було б це чесно? Чи було б це справедливо?</li>
<li>Бути готовими нести відповідальність за свій вибір; навіть якщо ви зробили помилку, чесно визнайте це і спробуйте виправити.</li></ul>
<p>Етичні рішення – це не випадковість, а свідомий вибір, що ґрунтується на роздумах про наслідки, аналізі ситуації з позиції інших.</p>`,

{info:`<h4>Що таке держава? Якими є ознаки держави?</h4>
<p><b>Держава</b> – це організована спільнота людей, які живуть на певній території і мають спільні правила – закони. Держава – це як велика команда, у якій люди живуть разом, працюють за спільними правилами і допомагають одне одному. Наша держава Україна – це наш «дім».</p>
<table class="tbl"><tr><th>Ознака держави</th><th>Зміст</th></tr>
<tr><td>Територія</td><td>поверхня землі (а також надра, морський і повітряний простір), чітко окреслена міжнародно визнаними кордонами</td></tr>
<tr><td>Населення</td><td>усі люди, які перебувають на території держави</td></tr>
<tr><td>Закони</td><td>правила, встановлені державою, обов’язкові для всіх</td></tr>
<tr><td>Влада</td><td>в Україні – парламент (Верховна Рада України), уряд (Кабінет Міністрів України), суди і глава держави (Президент України)</td></tr>
<tr><td>Податки</td><td>спеціальні кошти, за рахунок яких функціонують державні структури</td></tr></table>
<h4>Державні символи України</h4>
<ul><li><b>Державний Герб України</b> – золотий тризуб на синьому тлі, Знак Княжої Держави Володимира Великого.</li>
<li><b>Державний Прапор України</b> – стяг із двох рівновеликих горизонтальних смуг синього і жовтого кольорів.</li>
<li><b>Державний Гімн України</b> – національний гімн на музику М. Вербицького із словами з вірша П. Чубинського. Перша публікація вірша «Ще не вмерла Україна» – 1863 р.</li></ul>
<p>Державу Україна вирізняють також державна мова (українська) і власна грошова одиниця (гривня).</p>
<h4>Як здійснюється державна влада?</h4>
<p>В Україні державна влада поділяється на три гілки, щоб уникнути зловживань і забезпечити справедливість:</p>
<table class="tbl"><tr><th>Гілка влади</th><th>Завдання</th><th>Хто здійснює</th></tr>
<tr><td>Законодавча</td><td>створювати закони</td><td>Верховна Рада України (парламент)</td></tr>
<tr><td>Виконавча</td><td>втілювати закони в життя, керувати державою в повсякденних справах</td><td>уряд (Кабінет Міністрів України)</td></tr>
<tr><td>Судова</td><td>слідкувати за дотриманням законів, вирішувати спори, карати порушників</td><td>суди різних рівнів</td></tr></table>
<p><b>Президент України</b> – глава держави, гарант Конституції, прав і свобод громадян, Верховний головнокомандувач, представляє країну на міжнародній арені. Кожен громадянин має право брати участь у здійсненні влади через вибори, референдуми та інші демократичні механізми.</p>
<h4>Що таке адміністративний устрій?</h4>
<p><b>Адміністративний устрій</b> – це поділ території держави на певні частини (адміністративно-територіальні одиниці) для зручності управління та організації влади на місцях. В Україні існують області, які поділяються на райони, а райони включають міста, селища та села (місцеві громади).</p>
<h4>Цінності держави Україна</h4>
<p><b>Найвищою цінністю України є людина</b>, її життя і здоров’я, честь і гідність, недоторканність і безпека. Цінностями є також незалежність і територіальна цілісність, демократія, верховенство права, свобода слова і думки, культура та історія, мова, традиції, соціальна справедливість, патріотизм, толерантність.</p>`,

{info:`<h4>Поняття «громадянин» у давнину і в сьогоденні</h4>
<p>У <b>Давній Греції</b> громадянами могли бути не всі. Це була велика честь і привілей, доступний лише вільним чоловікам, які були уродженцями міста-держави. Вони обговорювали закони, голосували, брали участь в управлінні, захищали свою землю.</p>
<p>У <b>Римській імперії</b> поняття громадянства розширилося, охоплюючи значно більше людей на великій території, але також стосувалося тільки вільних чоловіків. Римські громадяни мали певні права та захист закону.</p>
<p><b>Громадянство</b> – це особливий зв’язок між людиною і державою, який визначає їхні взаємні права та обов’язки. Сьогодні громадянин – це людина, яка є офіційною частиною своєї держави зі всіма правами й обов’язками.</p>
<h4>Хто є громадянами України</h4>
<ul><li>Громадянами України є ті, що народилися в Україні (чиї батьки народилися в Україні) або законно набули її громадянства.</li>
<li>Документи: паспорт громадянина України; паспорт громадянина України для виїзду за кордон; тимчасове посвідчення громадянина України та ін.</li>
<li>Для дитини першим документом є <b>свідоцтво про народження</b>.</li>
<li>Особи з <b>чотирнадцятирічного віку</b> отримують пластикові паспорти зразка 2016 року – <b>ID-картки</b>.</li></ul>
<p>Ми маємо право голосувати, навчатися, працювати, вільно висловлювати свої думки, але водночас зобов’язані поважати закони, сплачувати податки, захищати свою Батьківщину.</p>
<h4>Чим відрізняються громадяни держави від її населення?</h4>
<table class="tbl"><tr><th>Населення</th><th>Громадяни</th></tr>
<tr><td>усі люди, які проживають на території країни, незалежно від їхнього статусу (гості, туристи, тимчасово перебувають)</td><td>ті, хто має юридичний зв’язок із країною, закріплений законом</td></tr>
<tr><td>підпадають під дію законів держави, але не всі мають повний обсяг прав та обов’язків</td><td>мають право на захист держави на її території і за її межами, беруть участь в управлінні державою (голосують, можуть бути обраними)</td></tr></table>
<p>Якщо населення – це просто люди, які живуть поруч, то громадяни – це будівничі, які зводять міцний дім для всіх і захищають його від ворогів.</p>`,

{info:`<h4>Чому громадяни мають не лише права, а й обов’язки?</h4>
<p>Громадяни мають права: брати участь в управлінні державою (обирати і бути обраними), право на освіту, охорону здоров’я, захист, свободу слова тощо. Але <b>права без обов’язків – як дерево без коріння</b>. Якщо кожен лише братиме, не даючи нічого взамін, держава ослабне. Обов’язки – це внесок у <b>спільне благо</b>.</p>
<h4>Обов’язки громадян</h4>
<ul><li>Дотримання <b>Конституції та законів</b> своєї держави – без поваги до закону неможливе існування цивілізованого суспільства.</li>
<li><b>Сплата податків</b> – основне джерело фінансування державних програм (освіти, медицини, оборони тощо).</li>
<li><b>Захист Батьківщини</b>.</li>
<li><b>Бережливе ставлення до природи</b>, історичної та культурної спадщини.</li></ul>
<p>Обов’язки громадян – це не тягар, а можливість. Вони дозволяють кожному стати творцем кращого життя.</p>
<h4>Якою має бути громадянська поведінка шкільного колективу?</h4>
<p><b>Громадянська поведінка шкільного колективу</b> – це не просто слухняність, а свідоме виконання правил та відповідальне ставлення до спільного життя. Вона проявляється у:</p>
<ul><li>повазі до кожного члена колективу, вмінні слухати та чути одне одного, толерантності;</li>
<li>відповідальному ставленні до навчання, збереженні шкільного майна, чистоти та порядку;</li>
<li>активній участі у житті школи, у <b>самоврядуванні</b>, у вирішенні спільних проблем;</li>
<li>вмінні відстоювати свою думку цивілізованим шляхом, брати участь у дебатах та дискусіях.</li></ul>
<p>Такий колектив не лише вчиться, а й творить добро, роблячи школу місцем, де зростають справедливість, дружба й відповідальність.</p>`,

// 13 §10
{info:`<h4>Що таке спілкування?</h4>
<p><b>Спілкування</b> – це фундаментальне поняття, яке визначає життєво важливий процес обміну інформацією, думками та почуттями, що з’єднує людей. Спілкування – це невидимий місток, який з’єднує людей. Без спілкування ми були б, як острови в океані.</p>
<h4>Стилі спілкування</h4>
<p><b>Стилі спілкування</b> – це різні способи розмовляти з людьми залежно від того, хто вони і яка мета розмови. Є три основні стилі:</p>
<table class="tbl"><tr><th>Стиль</th><th>З ким</th><th>Особливості</th></tr>
<tr><td>Дружнє</td><td>з друзями, однокласниками</td><td>легко, відкрито й невимушено; прості слова, жарти; але з повагою, не ображаючи</td></tr>
<tr><td>Сімейне</td><td>з рідними</td><td>вчить довіри, поваги й турботи; ввічливо, слухати поради, шукати компроміс</td></tr>
<tr><td>Ділове</td><td>з учителями, тренерами, незнайомими дорослими</td><td>серйозність і чіткість; «будь ласка», «дякую», «вибачте»; говорити по суті</td></tr></table>
<p>Потрібно вміти перемикатися між різними стилями спілкування – це як мати різні ключі, щоб відкривати різні двері.</p>
<h4>Види спілкування. Слова, жести, міміка</h4>
<ul><li><b>Спілкування словами</b> – усне (важливі тон голосу, гучність, інтонація) або письмове (важливі чіткість, правильні слова і граматика).</li>
<li><b>Спілкування жестами</b> – рухи рук, тіла чи голови (помахати рукою, підняти руку на уроці).</li>
<li><b>Спілкування мімікою</b> – вираз обличчя. Міміку важко приховати.</li></ul>
<p>Найчастіше ми використовуємо всі види одночасно. Коли міміка і жести суперечать словам, ми частіше віримо тому, що бачимо, а не тому, що чуємо.</p>
<h4>Роль державної мови в спілкуванні</h4>
<p><b>Державна мова</b> – це офіційна мова країни, яка використовується в усіх державних установах (школах, лікарнях, судах), об’єднує громадян, забезпечує порозуміння та є важливим символом культури й історії народу. В Україні державною мовою є <b>українська</b>. Вона є одним із важливих символів країни, поряд з гербом і прапором.</p>`,
terms:[["Спілкування","процес обміну інформацією, думками та почуттями, що з’єднує людей"],["Стилі спілкування","різні способи розмовляти з людьми залежно від того, хто вони і яка мета розмови"],["Ділове спілкування","серйозне й чітке спілкування для вирішення важливих справ"],["Жести","рухи рук, тіла чи голови, що передають інформацію"],["Міміка","вираз обличчя"],["Державна мова","офіційна мова країни, що використовується в усіх державних установах"]],

// 14 §11.1
{info:`<h4>Як бути добрим співрозмовником?</h4>
<p><b>Культура спілкування</b> – це вміння ефективно взаємодіяти з іншими людьми, дотримуючись правил ввічливості, поваги та взаєморозуміння. Уявіть собі, що кожна розмова – це невеличка подорож: потрібно знати, як її розпочати, як підтримувати і як правильно завершити.</p>
<h4>Як розпочати розмову</h4>
<ul><li>Почати розмову слід із <b>привітання</b>: дружнє «Привіт!» або офіційніше «Добрий день!», залежно від співрозмовника.</li>
<li>Можна зробити невеличкий <b>комплімент</b>.</li>
<li>Задати <b>запитання</b> про щось цікаве, що не вимагає односкладної відповіді й цікавить вас обох.</li>
<li>Знайти щось спільне у вашому оточенні; іноді – звернутися з простим проханням про допомогу.</li></ul>
<h4>Як підтримувати розмову</h4>
<ul><li>Слухайте уважно, кивайте головою, показуйте, що ви розумієте.</li>
<li>Не перебивайте, дайте людині висловити свою думку до кінця.</li>
<li>Якщо щось незрозуміло, не бійтеся перепитати.</li>
<li>Діліться своїми думками, але не перетворюйте розмову на виступ одного актора; шукайте спільні інтереси.</li>
<li>Не забувайте про «мову без слів» – погляд, усмішка, жести; будьте позитивними.</li></ul>
<h4>Як завершити розмову ввічливо</h4>
<ul><li>Попередьте співрозмовника, що вам час іти («Мені треба на урок, але було цікаво!»).</li>
<li>Коротко згадайте щось цікаве з розмови.</li>
<li>Обов’язково подякуйте за спілкування; за бажання запропонуйте продовжити розмову пізніше.</li>
<li>Попрощайтеся теплою усмішкою і доброзичливим «до побачення».</li></ul>`,

{info:`<h4>Як показати, що ви слухаєте?</h4>
<p>Слухати – це не просто чути слова, а показувати, що вам важливі думки іншої людини. <b>Активне слухання</b> – це повністю зосередитися на співрозмовнику, показуючи йому свою увагу та зацікавленість.</p>
<ul><li><b>Дивіться на співрозмовника</b>. Легкий кивок головою чи усмішка додадуть тепла.</li>
<li><b>Не перебивайте</b>, навіть якщо вам здається, що ви вже знаєте, що буде далі. Якщо ви на уроці й хочете щось сказати, підніміть руку.</li>
<li><b>Ставте запитання або реагуйте</b>: «А який був рахунок?», «Ого, це круто!». Використовуйте маленькі словесні «підказки» – «ага», «ого», «так».</li></ul>
<p>Бути добрим слухачем – це не просто ввічливість, це ключ до розуміння, довіри та справжньої дружби.</p>
<h4>Як правильно запитувати?</h4>
<p>Правильно поставлене запитання допомагає вам отримати відповідь і показує, що ви поважаєте інших. Це наче кинути м’яч другу так, щоб він легко його впіймав.</p>
<ul><li><b>Будьте ввічливими</b> – слова «будь ласка» чи «дякую».</li>
<li><b>Говоріть чітко і просто</b> – замість «Є щось цікаве?» спитайте: «Чи є книги про козаків?».</li>
<li><b>Обирайте слушний момент</b> – «Маєш хвилинку?».</li></ul>
<p>Не бійтеся ставити запитання! Кожне ваше запитання – це крок до нових знань і розуміння світу.</p>
<h4>Як спілкуватися без конфліктів? (основні ідеї теми 12)</h4>
<ul><li><b>Довіра</b> – це віра в чесність та щирість іншої людини, відкрите сприйняття інформації без підозр.</li>
<li><b>Взаємоповага</b> – це визнання цінності іншої людини як особистості, повага до її думок, почуттів та досвіду.</li>
<li><b>Емпатія</b> – це здатність поставити себе на місце іншої людини, зрозуміти її почуття та показати, що вам не байдуже.</li></ul>`,

// 16 §12
{info:`<h4>Довіра і взаємоповага у спілкуванні</h4>
<p><b>Довіра</b> у спілкуванні означає вірити словам іншої людини, бути впевненим у її чесності та щирості. Щоб заслужити довіру, треба бути чесними: якщо щось обіцяли – зробити це. Довіра як нитка, що з’єднує людей: якщо її порвати – буває важко відновити.</p>
<p><b>Взаємоповага</b> у спілкуванні означає цінувати іншу людину як особистість, визнавати важливість її думок, почуттів та досвіду: уважно слухати, не перебивати, не сміятися з інших і не ображати. Довіра народжується з чесності та відкритості, а взаємоповага є основою для побудови міцної довіри.</p>
<h4>Мова ворожнечі</h4>
<p><b>Мова ворожнечі</b> – це слова чи вислови, які ображають інших людей через їхню зовнішність, національність, віру чи вподобання. Вона може бути і в інтернеті (грубі коментарі). Її мета – знецінити іншу людину. Мова ворожнечі руйнує довіру та взаємоповагу, може призвести до цькування, дискримінації, ізоляції та навіть фізичного насильства. Кожне наше слово має силу, і ми несемо відповідальність за те, як воно впливає на інших.</p>
<h4>Розпізнавання і вираження своїх емоцій</h4>
<p>Розпізнавати свої емоції – це як навчитися розрізняти погоду у своєму внутрішньому світі: радість, злість, сум, страх, здивування, образу. Коли ми розуміємо свої емоції, ми краще розуміємо причини своєї поведінки.</p>
<p><b>Вираження емоцій</b> – це коли ти чесно і ввічливо показуєш свої почуття. Замість «Ти все зіпсував!» скажи: «Давай зробимо це разом інакше». Емоції можна виражати словами, мімікою, жестами, творчістю; важливо – відповідно до ситуації.</p>
<h4>Значення емпатії у спілкуванні</h4>
<p><b>Емпатія</b> – це вміння поставити себе на місце іншої людини, зрозуміти її почуття і показати, що тобі не байдуже. Наприклад: «Розумію, це прикро, давай розберемо задачу разом». Емпатія – це не сміятися з чужих проблем і не казати: «Це дрібниці». Щоб бути емпатійним, уважно слухай, дивися на вираз обличчя співрозмовника і подумай: «Як би я почувався на його місці?». Емпатія – це підтримка без осуду.</p>`,

  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${s.lab||"★"}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("go6_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Громадянська освіта 6`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("go6_theme",d.dataset.theme); }
const th=store.get("go6_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
