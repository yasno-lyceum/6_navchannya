<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фізична культура · 6 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "fk6", "name": "Фізична культура · 6 клас", "short": "Фізкультура 6", "themes": [{"name": "І чверть. Рухливі ігри, футбол, панна", "lessons": [{"n": "1", "t": "Знайомство з модулями: організація рухливих ігор, безпека у футболі, панна сьогодні", "g": "Учень дізнається, які модулі вивчатиме в І чверті, як організовують рухливі ігри та яких правил безпеки дотримуватися на уроках футболу.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Модуль", "окрема тематична частина програми з фізичної культури, яку вивчають протягом певного часу."], ["Рухлива гра", "гра з активними рухами (біг, стрибки, кидки), яка має правила й мету."], ["Ведучий", "учасник гри, який виконує особливу роль: ловить, водить або подає сигнали."], ["Техніка безпеки", "правила поведінки, що допомагають уникнути травм під час занять."], ["Панна", "вулична гра з м'ячем один на один, мета якої — прокинути м'яч між ногами суперника."]], "th": [{"h": "Рухливі ігри. Організація та методика проведення рухливих ігор", "p": ["Цієї чверті ти вивчатимеш три модулі: рухливі ігри, футбол і панну. Будь-яка рухлива гра починається з підготовки: вибору місця, пояснення правил і розподілу ролей."], "ul": ["Обери безпечний майданчик без ям, каміння й гострих предметів.", "Поясни правила коротко й зрозуміло, покажи, як грати.", "Обери ведучого (лічилкою або жеребкуванням) і розподіли команди порівну.", "Домовтеся про сигнал початку й завершення гри.", "Після гри підбийте підсумки: хто переміг і що вдалося."]}, {"h": "Футбол. Правила техніки безпеки на уроках футболу", "p": ["Футбол — швидка контактна гра, тому безпека тут особливо важлива."], "ul": ["Займайся у спортивному взутті без шипів на твердому покритті, без годинників і прикрас.", "Обов'язково виконуй розминку перед грою.", "Не бий по м'ячу, коли поруч стоїть товариш, і не штовхай суперника.", "Не висни на воротах і не залазь на них.", "Якщо відчуваєш біль чи запаморочення — одразу скажи вчителеві."]}, {"h": "Панна. Місце панни на сучасному етапі розвитку спорту та ігор", "p": ["Панна — вулична гра з м'ячем, у якій двоє гравців змагаються один проти одного на невеликому круглому або восьмикутному майданчику. Головна мета — прокинути м'яч між ногами суперника. Сьогодні панна популярна серед дітей і молоді в багатьох країнах, зокрема в Україні, бо для неї потрібні лише м'яч і невеликий майданчик."], "ul": ["Панна розвиває спритність, контроль м'яча та швидку реакцію.", "Грати потрібно чесно, без поштовхів і ударів по ногах суперника."]}], "f": "Слово «футбол» походить від англійських слів foot — «нога» та ball — «м'яч».", "pr": ["Запиши в зошит 5 правил безпеки на уроках футболу, які вважаєш найважливішими.", "Намалюй схему безпечного майданчика для рухливої гри: познач межі, місце старту та місце для глядачів."], "q": ["Які три модулі ти вивчатимеш у І чверті?", "З чого починається організація рухливої гри?", "Назви три правила безпеки на уроці футболу.", "Яка головна мета гри в панну?"]}, {"n": "2", "t": "Дидактичні ігри, рухи футболіста з м'ячем і точні удари в панні", "g": "Учень дізнається, що таке дидактичні ігри, які вправи використовують у розминці футболіста та чому в панні важливі точні удари й прийом м'яча.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Дидактична гра", "гра, яка одночасно навчає й розважає: розвиває увагу, мислення, пам'ять."], ["Розминка", "комплекс легких вправ, що готує м'язи й суглоби до навантаження."], ["Імітація", "повторення руху без предмета, «наче з м'ячем», щоб запам'ятати техніку."], ["Прийом м'яча", "дія, коли гравець зупиняє або бере під контроль м'яч, що летить до нього."]], "th": [{"h": "Рухливі ігри. Дидактичні ігри для розвитку дитини", "p": ["Дидактичні ігри поєднують рух і навчання. Наприклад, гравці бігають до кошика лише тоді, коли ведучий називає слово з певною буквою, або виконують вправу, коли чують парне число."], "ul": ["розвивають увагу і швидкість реакції;", "навчають дотримуватися правил і чекати своєї черги;", "допомагають запам'ятовувати нове через рух."]}, {"h": "Футбол. Ходьба, біг, стрибки, вправи на місці та в русі з м'ячем", "p": ["Розминка футболіста складається з ходьби, бігу, стрибків і вправ з м'ячем. Стрибки з імітацією удару головою чи ногою вчать правильно відштовхуватися та координувати рухи."], "ul": ["Ходьба на носках, на п'ятах, з високим підніманням стегна.", "Легкий біг, біг зі зміною напрямку.", "Стрибки на місці на двох ногах, потім на одній.", "Стрибок угору з імітацією удару головою: відштовхнись, прогнися, «вдар» лобом уявний м'яч."]}, {"h": "Панна. Значення точних ударів і прийому м'яча від стіни", "p": ["Удари в стіну — простий спосіб тренувати точність: м'яч повертається, і його треба прийняти. Що точніше ти б'єш, то легше контролювати м'яч."], "ul": ["Бий з невеликою силою, стежачи за м'ячем.", "Приймай м'яч м'яким рухом стопи назустріч і трохи назад.", "Точний удар і впевнений прийом допомагають і в панні, і в командній грі."]}], "f": "", "pr": ["Придумай власну дидактичну гру з рухами (наприклад, на знання таблиці множення) й опиши її правила у 4–5 реченнях.", "Виконай удома розминку: 1 хвилина ходьби на носках, 1 хвилина на п'ятах, 10 легких стрибків на місці (на килимі, у зручному взутті)."], "q": ["Чим дидактична гра відрізняється від звичайної рухливої?", "Навіщо футболісту стрибки з імітацією удару головою?", "Як правильно приймати м'яч, що відскочив від стіни?"]}, {"n": "3", "t": "Естафети з елементами тенісу, гра «Сонечко», удари по підвішеному м'ячу, гнучкість плечей", "g": "Учень знатиме, як проводять естафети з елементами тенісу, як грати в «Сонечко», як дістати підвішений м'яч і які вправи розвивають гнучкість плечового пояса.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Естафета", "командне змагання, у якому учасники по черзі виконують завдання й передають естафету наступному."], ["Розбіг", "кілька кроків перед стрибком чи ударом, які допомагають набрати швидкість."], ["Плечовий пояс", "кістки й м'язи, що з'єднують руки з тулубом, — ключиці, лопатки та плечові суглоби."], ["Гнучкість", "здатність виконувати рухи з великою амплітудою, тобто «розмахом»."]], "th": [{"h": "Рухливі ігри. Естафети з елементами тенісу. Рухлива гра «Сонечко»", "p": ["В естафеті з елементами тенісу гравець проносить тенісний м'ячик на ракетці до позначки й назад, не впустивши його, і передає ракетку наступному.", "«Сонечко» (один із варіантів): гравці стоять у колі — це «промені». Ведучий у центрі — «сонечко». За сигналом «Сонечко сідає!» всі присідають, на «Сонечко сходить!» — встають і піднімають руки вгору. Хто помилився — виконує веселе завдання."], "ul": []}, {"h": "Футбол. Діставання підвішеного м'яча головою та ногою у стрибку", "ul": ["Стрибок з місця: відштовхнись двома ногами, руки допомагають махом угору.", "Стрибок з розбігу: 3–5 кроків, відштовхування однією ногою.", "Торкайся м'яча лобом, очі не заплющуй.", "Приземляйся м'яко на дві ноги, злегка згинаючи коліна."], "p": []}, {"h": "Панна. Спеціальні вправи для гнучкості плечового пояса", "p": ["Гнучкі плечі допомагають тримати рівновагу та швидко рухатися під час гри."], "ul": ["Колові рухи плечима вперед і назад (по 10 разів).", "Колові рухи прямими руками.", "Ривки руками: два пружні рухи зігнутими руками назад, два — прямими.", "Замок за спиною: з'єднай руки за спиною і повільно підніми їх угору."]}], "f": "", "pr": ["Виконай 4 вправи на гнучкість плечового пояса з конспекту, по 8–10 повторень кожна, повільно й без болю.", "Опиши письмово естафету з елементами тенісу, яку можна провести у дворі, — правила та переможця."], "q": ["Що таке естафета?", "Як грати в «Сонечко»?", "Як правильно приземлятися після стрибка?", "Назви дві вправи для гнучкості плечей."]}, {"n": "4", "t": "Значення рухливих ігор, стрибки з ударами по підвішених м'ячах, вправи на силу", "g": "Учень зрозуміє, чому рухливі ігри важливі для здоров'я школяра, як виконувати стрибки з ударами по м'ячу та які вправи розвивають силу м'язів.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Фізичне виховання", "процес навчання рухам і розвитку фізичних якостей для зміцнення здоров'я."], ["Сила", "фізична якість, що дає змогу долати опір або піднімати вагу завдяки роботі м'язів."], ["Черевний прес", "група м'язів живота, яка підтримує тулуб і допомагає нахилятися та повертатися."], ["Траєкторія", "лінія, якою рухається м'яч у повітрі або по землі."]], "th": [{"h": "Рухливі ігри. Рухливі ігри — важливий засіб фізичного виховання школярів", "p": ["Рухливі ігри поєднують біг, стрибки, кидки й емоції. Під час гри діти рухаються охоче й довго, тому зміцнюють серце, м'язи та легені майже непомітно для себе."], "ul": ["розвивають швидкість, спритність і витривалість;", "вчать працювати в команді й дотримуватися правил;", "знімають втому після уроків і покращують настрій."]}, {"h": "Футбол. Стрибки з ударами головою чи ногою по підвішених м'ячах", "p": ["М'ячі підвішують на різній висоті: низько — для удару ногою, високо — для удару головою. Так тренують точність і координацію."], "ul": ["Оціни висоту м'яча ще до розбігу.", "Для удару ногою стрибни й виконай мах ногою вперед, носок натягнутий.", "Для удару головою відштовхнись, прогнися й «зустрінь» м'яч лобом.", "Після приземлення одразу повертайся у стійку."]}, {"h": "Панна. Вправи для сили рук, ніг, преса та спини", "ul": ["Присідання — для м'язів ніг.", "Відтискання від стіни або лави — для рук.", "«Велосипед» лежачи на спині — для черевного преса.", "«Човник» лежачи на животі (одночасне піднімання рук і ніг) — для спини.", "Виконуй вправи рівномірно, без затримки дихання."], "p": []}], "f": "", "pr": ["Склади комплекс із 4 силових вправ (по одній на руки, ноги, прес, спину) і виконай його: по 8–10 повторень.", "Напиши 3–4 речення: чим тобі особисто корисні рухливі ігри."], "q": ["Чому рухливі ігри називають засобом фізичного виховання?", "На якій висоті підвішують м'яч для удару головою, а на якій — для удару ногою?", "Яка вправа зміцнює м'язи спини?"]}, {"n": "5", "t": "Ігри «Зірви стрічку!» і «Довгі лози», стройові вправи, гігієна футболіста, розтягування", "g": "Учень знатиме правила ігор на спритність і увагу, основні стройові команди, гігієнічні вимоги у футболі та вправи на розтягування.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Спритність", "здатність швидко й точно виконувати складні рухи та змінювати їх у разі потреби."], ["Стройові вправи", "дії в шеренгах і колонах за командами: повороти, шикування, перешикування."], ["Гігієна", "правила догляду за тілом, одягом і взуттям для збереження здоров'я."], ["Розтягування", "вправи, що повільно подовжують м'язи й покращують гнучкість."]], "th": [{"h": "Рухливі ігри. Ігри для спритності та уваги: «Зірви стрічку!», «Довгі лози»", "p": ["«Зірви стрічку!»: кожен гравець заправляє стрічку за пояс ззаду. За сигналом усі намагаються зірвати чужі стрічки й зберегти свою. Виграє той, хто зібрав найбільше стрічок.", "«Довга лоза» — старовинна українська гра-перестрибування: гравці по черзі перестрибують через товариша, що стоїть нахилившись. У школі її проводять лише з учителем і на м'якому покритті."], "ul": []}, {"h": "Футбол. Стройові вправи. Гігієнічні вимоги у футболі", "ul": ["Основні команди: «Рівняйсь!», «Струнко!», «Вільно!», «Праворуч!», «Ліворуч!».", "Форма має бути чистою, зручною, за погодою.", "Шкарпетки — без дірок, взуття — за розміром.", "Після тренування — душ і чиста білизна.", "Пий воду невеликими ковтками до і після гри."], "p": []}, {"h": "Панна. Вправи на розтягування", "p": ["Розтягування виконують повільно, без ривків, затримуючись у позиції на 10–20 секунд."], "ul": ["Нахил до прямої ноги сидячи.", "Випад уперед із прямою спиною.", "Тягнення п'яти до сідниці стоячи (тримаючись за опору).", "Відчуття — легкий натяг, а не біль."]}], "f": "Шкарпетки-гетри та щитки в професійному футболі — обов'язкова частина форми, бо захищають гомілки від ударів.", "pr": ["Виконай 3 вправи на розтягування з конспекту, затримуючись у кожній на 15 секунд.", "Склади пам'ятку «Гігієна юного футболіста» з 5 пунктів."], "q": ["Як грати в «Зірви стрічку!»?", "Назви три стройові команди.", "Чому розтягування виконують без ривків?", "Які гігієнічні вимоги до футбольної форми?"]}, {"n": "6", "t": "Безпека й дисципліна в рухливих іграх, різновиди ходьби й бігу, пересування в панні", "g": "Учень знатиме правила безпеки й дисципліни під час рухливих ігор, різновиди ходьби й бігу футболіста та способи пересування на майданчику для панни.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Дисципліна", "дотримання встановлених правил і вказівок учителя чи судді."], ["Біг приставним кроком", "пересування боком, коли одна нога наздоганяє іншу, не перехрещуючись."], ["Біг спиною вперед", "пересування назад із контролем того, що відбувається попереду."], ["Ігровий майданчик", "обмежене місце для гри з чітко визначеними межами."]], "th": [{"h": "Рухливі ігри. Правила безпеки та дисципліни під час рухливих ігор", "ul": ["Починай і закінчуй гру тільки за сигналом.", "Не виходь за межі майданчика.", "Не штовхайся, не став підніжок, не хапай за одяг.", "Дивись, куди біжиш, щоб не зіткнутися з іншими.", "Поважай рішення ведучого та суперників."], "p": []}, {"h": "Футбол. Різновиди ходьби та бігу", "p": ["Футболіст під час гри постійно змінює темп і напрям руху, тому тренує різні способи ходьби й бігу."], "ul": ["Ходьба на носках, п'ятах, у напівприсіді.", "Біг із високим підніманням стегна та із закиданням гомілки.", "Біг приставним кроком правим і лівим боком.", "Біг спиною вперед (лише на рівній поверхні).", "Прискорення на 10–15 м."]}, {"h": "Панна. Способи пересування гравців по майданчику", "p": ["У панні майданчик маленький, тож рухатися треба короткими швидкими кроками, не втрачаючи рівноваги."], "ul": ["кроки вперед-назад у низькій стійці;", "приставні кроки вбік;", "поворот на місці на передній частині стопи;", "поєднання цих способів залежно від дій суперника."]}], "f": "", "pr": ["Запиши 5 правил дисципліни, які допомагають рухливій грі бути безпечною й веселою.", "Виконай удома в коридорі (на рівній підлозі без перешкод): по 10 приставних кроків правим і лівим боком."], "q": ["Чому гру починають і закінчують тільки за сигналом?", "Назви три різновиди бігу футболіста.", "Як рухаються гравці на майданчику для панни?"]}, {"n": "7", "t": "Ігри з м'ячем за спрощеними правилами, футбольні естафети, удари різними боками стопи", "g": "Учень дізнається, як грати з м'ячем за спрощеними правилами, проводити естафети з елементами футболу та виконувати удари різними частинами стопи.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Спрощені правила", "полегшений варіант правил гри, щоб нею могли займатися початківці."], ["Ведення м'яча", "пересування з м'ячем, коли гравець легкими поштовхами веде його перед собою."], ["Внутрішній бік стопи", "частина стопи від великого пальця до п'яти з внутрішнього боку, якою виконують точні передачі."], ["Зовнішній бік стопи", "частина стопи з боку мізинця, якою можна відправити м'яч убік або підкрутити його."]], "th": [{"h": "Рухливі ігри. Навчально-розважальні ігри з м'ячем за спрощеними правилами", "p": ["Щоб усі могли грати, правила спрощують: зменшують майданчик, дозволяють більше спроб, забороняють силові прийоми."], "ul": ["«М'яч по колу»: гравці в колі передають м'яч, хто впустив — виконує завдання.", "«Влуч у ціль»: котити м'яч у кеглі чи пляшки.", "«Квадрат»: передачі м'яча, поки ведучий у центрі намагається його перехопити."]}, {"h": "Футбол. Ігри-естафети з елементами футболу", "ul": ["Ведення м'яча до конуса й назад.", "Ведення «змійкою» між фішками.", "Удар по воротах після ведення.", "Наступний гравець стартує лише тоді, коли отримав м'яч."], "p": []}, {"h": "Панна. Удари внутрішнім та зовнішнім боком стопи", "ul": ["Внутрішнім боком: опорна нога поруч із м'ячем, стопа ударної ноги розвернута назовні, удар серединою стопи.", "Зовнішнім боком: носок трохи всередину, удар частиною стопи з боку мізинця.", "Удари внутрішнім боком — найточніші, ними часто виконують передачі.", "Дивись на м'яч у момент удару."], "p": []}], "f": "", "pr": ["Намалюй схему футбольної естафети «змійкою» з 5 фішками і стрілками руху.", "Опиши письмово, чим відрізняється удар внутрішнім боком стопи від удару зовнішнім."], "q": ["Навіщо спрощують правила ігор?", "Опиши одну естафету з елементами футболу.", "Як розташувати опорну ногу при ударі внутрішнім боком стопи?", "Для чого використовують удар зовнішнім боком стопи?"]}, {"n": "8", "t": "Історія рухливих ігор, ведення м'яча зі зміною швидкості, прийом м'яча в панні", "g": "Учень дізнається про місце рухливих ігор у фізичному вихованні, навчиться вести м'яч зі зміною швидкості та приймати м'яч у парах і колонах.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Народна гра", "гра, створена й передана з покоління в покоління без конкретного автора."], ["Ривок", "раптове різке прискорення з місця або під час руху."], ["Обведення", "ведення м'яча з обходом суперника чи перешкоди."], ["Колона", "шикування, коли гравці стоять один за одним."]], "th": [{"h": "Рухливі ігри. Рухливі ігри у системі фізичного виховання та історія їх розвитку", "p": ["Рухливі ігри існують дуже давно: діти й дорослі в усі часи грали в квача, хованки, ігри з м'ячем. Багато ігор народні — їх ніхто не вигадав навмисно, вони передавалися від старших до молодших.", "Сьогодні рухливі ігри входять до уроків фізичної культури, бо добре розвивають рухи та вчать співпраці."], "ul": []}, {"h": "Футбол. Ведення м'яча зі збільшенням швидкості, ривками та обведенням", "ul": ["Веди м'яч легкими поштовхами, тримаючи його близько до ноги.", "Поступово збільшуй швидкість.", "Для ривку відпусти м'яч від себе на 8–10 м і наздожени його.", "Під час обведення фішок м'яч має бути під контролем.", "Поглядай не лише на м'яч, а й уперед."], "p": []}, {"h": "Панна. Прийоми м'яча від стіни, в парах та колонах", "ul": ["Від стіни: удар у стіну, прийом м'яча внутрішнім боком стопи.", "У парах: передача партнеру на 3–5 м, прийом і передача назад.", " на груди."]}, {"h": "Панна. Удари м'яча знизу після переміщення", "ul": ["Спочатку переміщайся до м'яча короткими кроками.", "Опорну ногу став поруч із м'ячем.", "Удар виконуй знизу, підкидаючи м'яч низько над землею.", "Після удару одразу повертайся у стійку."], "p": []}], "f": "", "pr": ["Склади таблицю «Класифікація рухливих ігор»: у кожну групу впиши по одній відомій тобі грі.", "Опиши словами, як зупинити м'яч підошвою, наче пояснюєш молодшому братові чи сестрі."], "q": ["За якими ознаками класифікують рухливі ігри?", "Якими частинами тіла можна зупинити м'яч?", "Що робити одразу після удару?"]}, {"n": "10", "t": "Ведення м'яча зовнішньою частиною підйому, зупинка в русі, вибір місця для удару", "g": "Учень навчиться вести м'яч зовнішньою частиною підйому, зупиняти його в русі на зручну позицію та обирати місце для удару.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Підйом стопи", "верхня частина стопи над пальцями, у місці шнурівки кросівок."], ["Зручна позиція", "положення м'яча, з якого гравцеві легко виконати наступну дію."], ["Контроль м'яча", "уміння утримувати м'яч поруч із собою, не втрачаючи його."], ["Вибір місця", "рішення гравця, звідки найвигідніше виконати удар."]], "th": [{"h": "Рухливі ігри. Ведення м'яча зовнішньою частиною підйому", "p": ["Зовнішня частина підйому — це верх стопи ближче до мізинця. Таким веденням зручно змінювати напрямок і обходити перешкоди."], "ul": ["Носок трохи розвернутий всередину.", "Поштовхи м'яча легкі, через кожен крок або два.", "Гра-естафета: ведення м'яча зовнішньою частиною підйому між фішками."]}, {"h": "Футбол. Зупинка м'яча в русі з виведенням на зручну позицію", "ul": ["Не чекай м'яч на місці — рухайся йому назустріч.", "Зупиняючи, зміщуй м'яч убік від суперника.", "Після зупинки м'яч має лежати так, щоб можна було одразу вдарити або віддати передачу.", "Тримай голову піднятою, щоб бачити поле."], "p": []}, {"h": "Панна. Вибір місця для виконання удару", "p": ["У панні м'яч часто відскакує від бортів. Тому важливо обирати місце, звідки зручно бити: збоку від суперника, на відстані, з якої ти встигнеш виконати удар."], "ul": ["оцінюй положення ніг суперника;", "не підходь занадто близько — суперник відбере м'яч;", "використовуй відскок від борту."]}], "f": "", "pr": ["Покажи на малюнку стопи (обведи свою стопу на папері), де внутрішній бік, зовнішній бік і підйом. Підпиши.", "Напиши 3 поради, як обрати зручне місце для удару в панні."], "q": ["Що таке підйом стопи?", "Навіщо зупиняти м'яч на зручну позицію?", "Чому не варто підходити до суперника в панні занадто близько?"]}, {"n": "11", "t": "Ігри на витривалість, відбирання м'яча, вправи для стоп", "g": "Учень знатиме правила ігор «Потяг», «Квач», «Квач зі стрічками», «Карасі і щука», способи відбору м'яча та вправи для зміцнення стоп.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Витривалість", "здатність довго виконувати роботу без помітної втоми."], ["Квач", "гравець, який ловить інших, торкаючись їх рукою."], ["Відбирання м'яча", "дія захисника, коли він законно забирає м'яч у суперника."], ["Плоскостопість", "сплощення склепіння стопи, яке можна попередити спеціальними вправами."]], "th": [{"h": "Рухливі ігри. Ігри для розвитку витривалості", "ul": ["«Потяг»: гравці стають колоною, тримаючись за плечі, і бігають за «паровозом», повторюючи його рухи.", "«Квач»: ведучий-квач ловить гравців; кого торкнувся — той стає квачем.", "«Квач зі стрічками»: квач має в руці стрічку, яку передає спійманому.", "«Карасі і щука»: «щука» в центрі ловить «карасів», які перебігають з одного боку майданчика на інший; спіймані стають «сіткою» або допомагають щуці."], "p": []}, {"h": "Футбол. Відбирання м'яча спереду, збоку, ззаду", "p": ["Відбирати м'яч можна лише граючи в м'яч, а не в ноги суперника."], "ul": ["Спереду: виставлення стопи на шляху м'яча в момент, коли суперник відпустив його.", "Збоку: підбігти поруч і вибити м'яч ногою, ближчою до м'яча.", "Ззаду: наздогнати й вибити м'яч, не чіпаючи ніг суперника.", "Поштовх у спину чи удар по ногах — порушення правил."]}, {"h": "Панна. Вправи для стоп і пальців ніг", "ul": ["Колові рухи стопою повільно, потім максимально швидко (по 10 у кожен бік).", "Згинання й розгинання пальців ніг.", "Захоплення пальцями ніг дрібних предметів (олівця, хустинки).", "Перекати з п'ят на носки."], "p": []}], "f": "", "pr": ["Виконай удома вправи для стоп: колові рухи стопою, захоплення пальцями олівця, перекати з п'ят на носки — по 10 разів.", "Опиши правила однієї гри на витривалість так, щоб у неї могли пограти твої друзі."], "q": ["Як грати в «Карасі і щука»?", "Як можна відібрати м'яч, не порушуючи правил?", "Навіщо виконувати вправи для стоп?", "Що таке витривалість?"]}, {"n": "12", "t": "Творчість і командна взаємодія, силові вправи футболіста, пересування по майданчику для панни", "g": "Учень зрозуміє, як поєднувати власну творчість і командну гру, знатиме силові вправи футболіста та способи пересування по майданчику для панни.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Командна взаємодія", "узгоджені дії гравців однієї команди для досягнення спільної мети."], ["Креативність", "уміння вигадувати нові, оригінальні рішення."], ["Упор лежачи", "положення тіла на прямих руках і носках ніг, тулуб рівний."], ["Стійка", "початкове положення гравця, з якого зручно почати будь-який рух."]], "th": [{"h": "Рухливі ігри. Індивідуальна творчість і командна взаємодія", "p": ["Перемагає не той, хто грає сам за всіх, а команда, де кожен вносить свою ідею й допомагає іншим."], "ul": ["пропонуй свої варіанти гри, але поважай думку команди;", "підтримуй товаришів, а не критикуй;", "розподіляйте ролі за силами кожного;", "радійте спільному успіху."]}, {"h": "Футбол. Згинання рук в упорі лежачи, присідання, стрибки", "ul": ["Згинання рук в упорі лежачи: тулуб рівний, груди опускаються до підлоги.", "Початківцям можна виконувати з упором руками на лаву чи коліньми на підлогу.", "Присідання: п'яти не відриваються, коліна не виходять за носки.", "Стрибки з однієї та двох ніг на місці й у русі — для сили ніг."], "p": []}, {"h": "Панна. Способи пересування по майданчику", "p": ["На маленькому майданчику для панни виграє той, хто швидше займе вигідне положення."], "ul": ["короткі кроки в напівзігнутих ногах;", "приставні кроки вбік і назад;", "розвороти на місці;", "різка зміна напрямку."]}], "f": "", "pr": ["Виконай 5–10 згинань рук в упорі лежачи (можна з упором руками на диван) і 10 присідань.", "Придумай нове правило для знайомої гри, яке зробить її цікавішою, і опиши його."], "q": ["Що таке командна взаємодія?", "Як правильно виконувати присідання?", "Чому в панні важливо швидко займати вигідне положення?"]}, {"n": "13", "t": "Патріотичні рухливі ігри, силові вправи, удари після прийому в парній грі", "g": "Учень знатиме патріотичні рухливі ігри «Козачок» і «Ми українці», вправи на силу та як бити по м'ячу після прийому в парній грі.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Патріотизм", "любов до своєї Батьківщини, її культури, мови та традицій."], ["Козак", "вільний воїн, захисник українських земель у минулому, символ мужності."], ["Розгинання рук", "повернення з положення зігнутих рук у положення прямих рук в упорі."], ["Парна гра", "гра двох гравців один з одним або один проти одного."]], "th": [{"h": "Рухливі ігри. Патріотичні ігри «Козачок», «Ми українці»", "p": ["Такі ігри знайомлять з українськими традиціями й вчать дружби."], "ul": ["«Козачок» (один із варіантів): гравці-«козаки» виконують рухи, які показує отаман, — «скачуть на конях», «махають шаблями», присідають, а за сигналом швидко шикуються.", "«Ми українці» (один із варіантів): гравці рухаються під пісню або вірш, а за сигналом утворюють фігури — коло, тризуб із рук чи колону."]}, {"h": "Футбол. Розгинання рук в упорі лежачи, присідання, стрибки", "ul": ["Згинай і розгинай руки рівномірно, не прогинаючи поперек.", "Видих — під час розгинання рук.", "Присідання поєднуй зі стрибками вгору.", "Стрибки в русі трішнім боком стопи;", "м'яч не можна відбивати рукою."]}], "f": "", "pr": ["Перед дзеркалом виконай імітацію удару головою без м'яча: прогин назад і рух уперед (10 разів повільно).", "Напиши, як можна ускладнити гру «М'яч ведучому», щоб вона була цікавішою."], "q": ["Чому бити по м'ячу треба саме серединою лоба?", "Як грати в «М'яч ведучому»?", "Яких правил безпеки дотримуватися у грі «Зірви стрічку»?"]}, {"n": "19", "t": "Ігри на гнучкість і рівновагу, обманні рухи (фінти), приставні кроки", "g": "Учень знатиме ігри «Збережи рівновагу» і «Човник», основні фінти у футболі та пересування приставними кроками у стійці футболіста.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Рівновага", "здатність утримувати стійке положення тіла, не падаючи."], ["Фінт", "обманний рух, що змушує суперника помилитися."], ["Фінт «відходом»", "обман, коли гравець показує рух в один бік, а йде в інший."], ["Приставний крок", "крок, коли одна нога приставляється до іншої, не перехрещуючись."]], "th": [{"h": "Рухливі ігри. Вправи для гнучкості: «Збережи рівновагу», «Човник»", "ul": ["«Збережи рівновагу»: гравці стоять на одній нозі, піднявши руки; виграє той, хто довше втримає рівновагу.", "Ускладнення — стояти на одній нозі з нахилом уперед, руки в сторони («ластівка»).", "«Човник» (вправа на гнучкість): лежачи на животі, одночасно підняти руки й ноги та погойдатися.", "Виконуй без ривків, у зручному темпі."], "p": []}, {"h": "Футбол. Обманні рухи та фінти", "ul": ["Фінт «відходом»: показати рух в один бік і різко піти в інший.", "Фінт «ударом»: замахнутися для удару, але не вдарити, а провести м'яч далі.", "Фінт «зупинкою»: різко зупинитися, а потім рвонути вперед.", "Фінти виконуй переконливо, щоб суперник повірив."], "p": []}, {"h": "Панна. Пересування в стійці футболіста приставними кроками", "ul": ["Стійка: коліна зігнуті, вага на передній частині стопи.", "Крок убік однією ногою, друга приставляється.", "Ноги не схрещуються.", "Висота тіла не змінюється, не підстрибуй."], "p": []}], "f": "", "pr": ["Виконай вправу «Збережи рівновагу»: постій на одній нозі з руками вгору по 30 секунд на кожній нозі (поруч з опорою).", "Опиши свій улюблений фінт або вигадай власний і дай йому назву."], "q": ["Як виконати вправу «Човник»?", "Назви три види фінтів.", "Чому ноги не схрещують під час приставних кроків?"]}, {"n": "20", "t": "Стройові й загальнорозвивальні вправи, жонглювання м'ячем, ігри з панною в парах", "g": "Учень знатиме стройові та загальнорозвивальні вправи, техніку жонглювання м'ячем та ігри з елементами панни в парах.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Загальнорозвивальні вправи", "вправи для різних груп м'язів, які розвивають тіло всебічно."], ["Жонглювання", "утримання м'яча в повітрі послідовними легкими ударами ніг, стегна чи голови."], ["Шеренга", "шикування, коли гравці стоять поруч пліч-о-пліч на одній лінії."], ["Квест", "гра-пригода, у якій учасники виконують послідовні завдання."]], "th": [{"h": "Рухливі ігри. Стройові та загальнорозвивальні вправи", "ul": ["Шикування в шеренгу й колону, повороти на місці.", "Нахили та повороти тулуба.", "Махи руками й ногами.", "Присідання та випади.", "Вправи виконують у порядку «зверху вниз» — від шиї до ніг."], "p": []}, {"h": "Футбол. Жонглювання м'ячем ногою, стегном, головою", "ul": ["Ногою: м'яч підбивай підйомом, носок натягнутий.", "Стегном: підставляй стегно під м'яч, коліно зігнуте.", "Головою: легкі удари лобом.", "Починай з 1–2 торкань і поступово додавай."], "p": []}, {"h": "Панна. Ігри та квести з елементами панни в парах", "ul": ["«Прокинь у ворітця»: пара по черзі прокидає м'яч між двома фішками.", "«Передай без помилок»: 10 передач поспіль без втрати м'яча.", "Квест: кожна пара проходить «станції» — ведення, удар у ціль, передачі.", "Після кожної станції — коротка пауза."], "p": []}], "f": "", "pr": ["Склади комплекс загальнорозвивальних вправ із 6 вправ «зверху вниз» і виконай його.", "Придумай квест для пари з 3 станцій з елементами панни й опиши його."], "q": ["Чому загальнорозвивальні вправи виконують «зверху вниз»?", "Якими частинами тіла можна жонглювати м'ячем?", "Що таке квест?"]}, {"n": "21", "t": "Різновиди естафет, чисельна перевага, командні ігри з елементами панни", "g": "Учень знатиме різновиди естафет, як відволікати суперника та створювати чисельну перевагу, а також командні ігри з елементами панни.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Зустрічна естафета", "естафета, у якій учасники однієї команди стоять колонами одна навпроти одної."], ["Чисельна перевага", "ситуація, коли на певній ділянці поля в команди більше гравців, ніж у суперника."], ["Перешкода", "предмет, який треба оминути, перестрибнути чи пролізти під ним."], ["Команда", "група гравців, що діють разом заради спільної перемоги."]], "th": [{"h": "Рухливі ігри. Різновиди естафет", "ul": ["Зустрічна з перешкодами: учасник біжить до протилежної колони, оминаючи фішки, і передає естафету.", "Естафета з обміном: на кожному етапі гравці обмінюються предметом.", "Естафета парами: бігти, тримаючись за руки.", "«Закрутилась голова»: оббігти фішку кілька разів і бігти далі.", "«Скакуни»: пересування стрибками на двох ногах."], "p": []}, {"h": "Футбол. Відволікання суперника та створення чисельної переваги", "p": ["Якщо в одній частині поля зібрати більше своїх гравців, ніж суперників, легше зберегти м'яч і атакувати."], "ul": ["Гравець без м'яча відкривається — тягне захисника за собою.", "Партнери швидко підтягуються до м'яча.", "Короткі передачі «в одне торкання».", "Низький м'яч приймай внутрішнім боком стопи, пом'якшуючи удар."]}, {"h": "Панна. Ігри та квести з елементами панни в командах", "ul": ["Командна естафета: ведення м'яча й прокидання між ногами «статуї» (фішок).", "Перемагає команда, яка першою виконає всі завдання без помилок.", "Кожен учасник має виконати свою частину.", "Уболівай за своїх, але поважай суперників."], "p": []}], "f": "", "pr": ["Придумай власну естафету й опиши її правила, обладнання та як визначити переможця.", "Намалюй схему: двоє гравців однієї команди проти одного суперника, де стрілками показана передача м'яча."], "q": ["Назви три різновиди естафет.", "Що таке чисельна перевага?", "Як гравець без м'яча може допомогти команді?"]}, {"n": "22", "t": "Ігри «День і ніч», «Виклик номерів», вибір рішення в грі, індивідуальні вправи з панни", "g": "Учень знатиме правила ігор «День і ніч» та «Виклик номерів», навчиться обирати найкраще рішення в ігровій ситуації і виконувати індивідуальні завдання з елементами панни.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Реакція", "швидкість відповіді тіла на сигнал."], ["Ігрова ситуація", "конкретний момент гри, у якому гравець має ухвалити рішення."], ["Раціональне рішення", "найдоцільніший і найпростіший спосіб розв'язати ігрове завдання."], ["Індивідуальна вправа", "завдання, яке гравець виконує самостійно, без партнера."]], "th": [{"h": "Рухливі ігри. Ігри та естафети з м'ячем: «День і ніч», «Виклик номерів»", "ul": ["«День і ніч»: дві команди («День» і «Ніч») стоять спинами одна до одної посередині майданчика. Ведучий називає команду — вона тікає до своєї лінії, а інша наздоганяє.", "«Виклик номерів»: гравці кожної команди мають номери. Ведучий називає номер — гравці з цим номером біжать за м'ячем або виконують завдання.", "Виграні очки рахують для кожної команди."], "p": []}, {"h": "Футбол. Вибір найправильнішого рішення в ігровій ситуації", "p": ["Хороший футболіст спочатку думає, а потім діє. Перед кожною дією запитай себе: що найпростіше й найкорисніше для команди?"], "ul": ["Партнер відкритий — віддай передачу.", "Попереду вільний простір — веди м'яч.", "Ти близько біля воріт — бий.", "Під тиском суперника — не ризикуй, грай просто."]}, {"h": "Панна. Ігри та квести з елементами панни індивідуально", "ul": ["Ведення м'яча між фішками на час.", "Прокидання м'яча через ворітця з фішок.", "Удари в стіну на точність.", "Записуй свої результати, щоб бачити прогрес."], "p": []}], "f": "", "pr": ["Опиши 3 ігрові ситуації у футболі й напиши, яке рішення ти вважаєш найкращим у кожній.", "Перевір свою реакцію: попроси когось із родини плескати в долоні, а ти присідай за кожним сплеском (10 разів)."], "q": ["Як грати в «День і ніч»?", "Що робити, якщо партнер відкритий?", "Навіщо записувати свої результати в індивідуальних вправах?"]}, {"n": "23", "t": "Рухливі ігри в Україні, різні удари й зупинки м'яча, панна за спрощеними правилами", "g": "Учень зрозуміє значення рухливих ігор у вихованні дітей і молоді України, повторить удари, зупинки й ведення м'яча та знатиме спрощені правила гри в панну.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Традиція", "звичай, який передається з покоління в покоління."], ["Напрямок м'яча", "куди саме рухається м'яч відносно гравця."], ["Майданчик для панни", "невелике кругле або восьмикутне поле, обгороджене бортами."], ["Навчальна гра", "гра за спрощеними правилами для закріплення вивчених прийомів."]], "th": [{"h": "Рухливі ігри. Рухливі ігри — вагомий засіб фізичного виховання дітей та молоді України", "p": ["Українські народні ігри — частина нашої культури. Вони зберігають традиції, розвивають тіло і вчать дружби. Їх проводять на уроках, у таборах, на святах."], "ul": ["зміцнюють здоров'я;", "виховують повагу до традицій;", "вчать чесної гри та підтримки."]}, {"h": "Футбол. Різні способи ударів, зупинок, ведення м'яча", "p": ["Спосіб дії залежить від того, як рухається м'яч."], "ul": ["М'яч котиться — зупинка підошвою чи внутрішнім боком стопи.", "М'яч падає згори — зупинка стегном.", "Повільний м'яч — можна одразу вести.", "Швидкий м'яч — спершу пом'якши прийом."]}, {"h": "Панна. Навчальна гра за спрощеними правилами", "ul": ["Гра 1 на 1 на невеликому майданчику.", "Мета — прокинути м'яч між ногами суперника (панна).", "За панну — перемога в раунді, за гол у маленькі ворітця — очко.", "Заборонено штовхати, хапати, бити по ногах.", "Раунд триває 1–2 хвилини."], "p": []}], "f": "", "pr": ["Опиши українську народну рухливу гру, яку знаєш, і поясни, чим вона корисна.", "Склади таблицю «Як рухається м'яч — як його зупинити» з 4 рядків."], "q": ["Чому народні рухливі ігри важливі для України?", "Як зупинити м'яч, що падає згори?", "Що дозволено і що заборонено у панні?"]}, {"n": "24", "t": "Підсумок: рухливі ігри, футбол і панна. Діагностувальна робота", "g": "Учень повторить і узагальнить знання з модулів «Рухливі ігри», «Футбол», «Панна» та підготується до діагностувальної роботи.", "k": "Модулі: Рухливі ігри · Футбол · Панна", "terms": [["Квач парами", "різновид квача, у якому гравці бігають і ловлять, тримаючись за руки парами."], ["Закривання", "дія захисника, коли він стає між суперником і м'ячем або воротами."], ["Перехоплення", "відбір м'яча під час передачі між суперниками."], ["Діагностувальна робота", "перевірка знань і вмінь, що показує, чого учень навчився."]], "th": [{"h": "Рухливі ігри. «Квач парами». Підсумок модуля «Рухливі ігри»", "p": ["«Квач парами»: квач-пара, тримаючись за руки, ловить інші пари. Спіймана пара стає квачем."], "ul": ["Ти вивчив організацію гри, правила безпеки й класифікацію ігор.", "Ігри на швидкість («Вільне місце»), спритність («Зірви стрічку»), витривалість («Квач», «Карасі і щука»).", "Естафети, патріотичні й всесвітні ігри."]}, {"h": "Футбол. Закривання, перехоплення та відбір м'яча. Підсумок", "ul": ["Закривай суперника, стаючи між ним і воротами.", "Перехоплюй передачу, вгадуючи, кому суперник віддасть м'яч.", "В обороні створюй чисельну перевагу — допомагай партнерові.", "Повтори: удари, зупинки, ведення, фінти, жонглювання, гра воротаря."], "p": []}, {"h": "Панна. Гра «Хто зайвий?». Підсумок", "p": ["«Хто зайвий?»: гравці стоять по колу парами (один за одним). Ведучий наздоганяє «зайвого»; коли «зайвий» стає перед якоюсь парою, задній гравець цієї пари стає «зайвим» і тікає."], "ul": ["Повтори: стійка, пересування, удари внутрішнім і зовнішнім боком стопи.", "Точні удари й прийом м'яча від стіни.", "Спрощені правила гри в панну."]}], "f": "", "pr": ["Склади план-конспект «Що я вивчив у І чверті»: по 3 головні думки з кожного модуля.", "Підготуй відповіді на питання для повторення нижче й перевір себе за конспектами уроків 1–23."], "q": ["Назви по одній рухливій грі на швидкість, спритність і витривалість.", "Чим перехоплення відрізняється від відбору м'яча?", "Якими способами можна зупинити м'яч?", "Що таке панна і яка мета гри?"]}]}, {"name": "ІІ чверть. Гімнастика, аеробіка, чирлідинг", "lessons": [{"n": "25", "t": "Історія гімнастики, стройові вправи в аеробіці та базові позиції рук у чирлідингу", "g": "Учень дізнається, як виникла гімнастика, ознайомиться зі стройовими вправами й різновидами ходьби та бігу і вивчить базові позиції рук у чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Гімнастика", "система спеціально дібраних фізичних вправ для зміцнення здоров’я та всебічного розвитку людини."], ["Стройові вправи", "спільні дії учнів у строю за командами вчителя: шикування, повороти, перешикування."], ["Шеренга", "стрій, у якому учні стоять поруч один з одним на одній лінії."], ["Колона", "стрій, у якому учні стоять один за одним."], ["Чирлідинг", "командний вид спорту, що поєднує танцювальні рухи, стрибки, заклички та елементи акробатики."]], "th": [{"h": "Гімнастика. Історія виникнення та розвитку гімнастики", "p": ["Слово «гімнастика» походить від давньогрецького слова, що означає «тренувати». Ще в Стародавній Греції юнаки займалися вправами для сили, спритності та гарної постави.", "Згодом гімнастика розвивалася в різних країнах: з’явилися гімнастичні снаряди (перекладина, бруси, колода), а потім і змагання. Спортивна гімнастика входить до програми Олімпійських ігор."], "ul": ["Гімнастика розвиває силу, гнучкість, рівновагу та координацію.", "Вона буває спортивною, художньою, оздоровчою (наприклад, ранкова зарядка) тощо.", "Основа будь-якого заняття — розминка та чітке виконання команд учителя."]}, {"h": "Аеробіка. Стройові вправи і прийоми. Різновиди ходьби, бігу", "p": ["Стройові вправи допомагають організовано почати заняття та швидко перешикуватися. Основні команди: «Рівняйсь!», «Струнко!», «Вільно!», «Праворуч!», «Ліворуч!», «Кругом!»."], "ul": ["Звичайна ходьба — спина рівна, руки рухаються вільно.", "Ходьба на носках — для зміцнення м’язів гомілок і стоп.", "Ходьба на п’ятах — тримай рівновагу, не відхиляйся назад.", "Ходьба з високим підніманням стегна — коліно піднімається до рівня пояса.", "Легкий біг — приземлення м’яке, на передню частину стопи.", "Біг із закиданням гомілок — п’ятки торкаються сідниць."]}, {"h": "Чирлідинг. Базові позиції рук чирлідингу", "p": ["У чирлідингу руки виконують чіткі, «гострі» рухи: кожна позиція фіксується, кулаки стиснуті, зап’ястя рівні — рука ніби продовжує лінію передпліччя."], "ul": ["«Т» — руки в сторони на рівні плечей, як літера Т.", "«High V» (високе V) — руки вгору-в сторони, як літера V.", "«Low V» (низьке V) — руки вниз-в сторони.", "«Touchdown» (тачдаун) — обидві руки прямо вгору, паралельно.", "«Руки на поясі» — кулаки на стегнах, лікті в сторони.", "Безпека: перед рухами розімни плечі та зап’ястя, не роби різких рухів «холодними» м’язами."]}], "f": "Гімнастика — один із найдавніших олімпійських видів спорту: спортивна гімнастика була в програмі вже перших сучасних Олімпійських ігор 1896 року.", "pr": ["Виконай удома 5 різновидів ходьби (на носках, на п’ятах, з високим підніманням стегна тощо) по 20–30 секунд кожен на вільному безпечному місці.", "Намалюй схеми 5 базових позицій рук чирлідингу (Т, High V, Low V, Touchdown, руки на поясі) та підпиши їх."], "q": ["Що означає слово «гімнастика» і де вона зародилася?", "Які стройові команди ти знаєш?", "Чим відрізняється шеренга від колони?", "Як правильно тримати кулак і зап’ястя в позиціях рук чирлідингу?"]}, {"n": "26", "t": "Безпека на заняттях гімнастикою й аеробікою, чір і чант у чирлідингу", "g": "Учень знатиме правила безпеки на заняттях гімнастикою та аеробікою, вмітиме попереджати травми й розрізнятиме чір і чант.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Страхування", "допомога вчителя або партнера, яка захищає від падіння чи травми під час виконання вправи."], ["Розминка", "комплекс легких вправ на початку заняття, що розігріває м’язи та готує суглоби до навантаження."], ["Травма", "пошкодження тканин або органів тіла внаслідок удару, падіння чи надмірного навантаження."], ["Чант", "коротка ритмічна закличка, яку повторюють кілька разів поспіль і до якої можуть долучатися глядачі."], ["Чір", "довша закличка з рухами, яку виконують один раз, часто разом зі стрибками та танцювальними елементами."]], "th": [{"h": "Гімнастика. Техніка безпеки під час занять гімнастикою", "ul": ["Займайся у спортивній формі та взутті, зніми прикраси й годинник, збери волосся.", "Виконуй вправи лише з дозволу вчителя і тільки на матах.", "Перевіряй снаряди: вони мають бути стійкими, мати рівну поверхню.", "Складні вправи — лише зі страхуванням.", "Не стій близько до того, хто виконує вправу, і не відволікай його.", "Відчув біль чи запаморочення — одразу припини вправу і скажи вчителю."], "p": []}, {"h": "Аеробіка. Правила безпеки при заняттях аеробікою. Заходи щодо попередження травм", "p": ["Аеробіка — це рухи під музику, тому важливо, щоб місце було просторим, а підлога — неслизькою."], "ul": ["Починай із розминки, закінчуй спокійними вправами та розтяжкою.", "Тримай дистанцію від інших — щоб не зачепити руками чи ногами.", "Не тримай коліна «замкненими», приземлюйся м’яко.", "Пий воду невеликими ковтками під час перерв.", "Навантаження збільшуй поступово."]}, {"h": "Чирлідинг. Різниця між чір та чант закличками. Танцювальні рухи", "p": ["Заклички підтримують команду й заряджають глядачів. Чант — короткий і повторюваний, чір — довший і виконується один раз разом із рухами."], "ul": ["Говори голосно, чітко, але не кричи до хрипоти.", "Слова закличок поєднуються з позиціями рук і кроками.", "Танцювальні рухи виконують у такт музиці, з чіткою фіксацією.", "Усмішка й упевнена постава — частина виступу."]}], "f": "", "pr": ["Склади пам’ятку «5 правил безпеки на уроці гімнастики» та оформи її як плакат.", "Придумай і запиши короткий чант (2–4 рядки) на підтримку свого класу; промов його ритмічно, плескаючи в долоні."], "q": ["Навіщо потрібне страхування?", "Які заходи допомагають уникнути травм на заняттях аеробікою?", "Чим чір відрізняється від чанту?", "Що треба зробити, якщо під час вправи заболіло чи запаморочилося?"]}, {"n": "27", "t": "Види гімнастики та гімнастичні терміни, аеробіка у фітнесі, чіткість рухів у чирлідингу", "g": "Учень знатиме основні види гімнастики та гімнастичні терміни, розумітиме місце аеробіки у фітнесі й правила чіткого виконання рухів у чирлідингу.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Вис", "положення, коли тіло тримається на снаряді руками, а плечі розташовані нижче точки хвату."], ["Упор", "положення, коли тіло спирається на снаряд чи підлогу прямими руками, а плечі розташовані вище точки опори."], ["Фітнес", "система занять фізичними вправами для гарного самопочуття, здоров’я та форми тіла."], ["Аеробні вправи", "тривалі вправи помірної інтенсивності, під час яких м’язи отримують енергію за участі кисню."], ["Фіксація руху", "коротка зупинка в кінцевій точці руху, яка робить позицію чіткою та помітною."]], "th": [{"h": "Гімнастика. Види гімнастики. Терміни гімнастичних вправ", "p": ["Гімнастику поділяють на спортивні види (спортивна і художня гімнастика, акробатика, стрибки на батуті), оздоровчі (ранкова, виробнича гімнастика) та прикладні (вправи, корисні в житті та професії)."], "ul": ["Стійка — положення стоячи (наприклад, основна стійка).", "Присід — положення на зігнутих ногах.", "Сід — положення сидячи на підлозі чи снаряді.", "Упор — опора на прямі руки, плечі вище опори.", "Вис — тримання руками, плечі нижче хвату.", "Групування — щільне притискання колін до грудей."]}, {"h": "Аеробіка. Роль та місце аеробіки в системі фітнесу", "p": ["Аеробіка — один із
