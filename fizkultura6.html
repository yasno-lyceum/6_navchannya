нд.", "Руки й плечовий пояс: віджимання від стіни або від лави.", "Тулуб: скручування лежачи, «планка».", "Ноги: присідання, підйоми на носки, випади.", "Відпочинок між підходами — 30–60 секунд."], "p": []}, {"h": "Чирлідинг. Побудови та перебудови", "p": ["Побудови роблять виступ видовищним: глядачі бачать фігури з людей."], "ul": ["Вертикальна (колона) і горизонтальна (шеренга).", "Діагональна — по лінії навскіс.", "Т-подібна, хрестоподібна.", "Дугоподібна і коло.", "Перебудову виконують швидко, на рахунок, кожен знає свою нову точку."]}], "f": "", "pr": ["Виконай вправи на рівновагу: стійка на носках 15 секунд, стійка на одній нозі зі зміною положення рук по 15 секунд на кожній нозі (поруч зі стіною для підстраховки).", "Намалюй схеми 4 побудов команди з 8 учасників (шеренга, колона, Т-подібна, коло) і стрілками покажи перебудову з однієї в іншу."], "q": ["Як зберегти рівновагу у стійці на одній нозі?", "Чому акробатичні вправи не можна виконувати вдома самостійно?", "Які побудови бувають у чирлідингу?", "Що таке перебудова?"]}, {"n": "48", "t": "Виси й упори, підсумок з аеробіки, Pom Dance. Діагностувальна робота з чирлідингу", "g": "Учень знатиме техніку вправ у висах і упорах, підсумує вивчене з гімнастики, аеробіки й чирлідингу та ознайомиться з програмою Pom Dance.", "k": "Модулі: Гімнастика · Аеробіка · Чирлідинг", "terms": [["Вис лежачи", "положення, коли учень тримається руками за низьку перекладину, а тіло пряме і спирається п’ятами на підлогу."], ["Підтягування", "силова вправа: згинання рук у висі до положення, коли підборіддя опиняється над перекладиною."], ["Упор лежачи", "положення з опорою на прямі руки та носки, тіло утворює рівну лінію."], ["Pom Dance", "танцювальна програма чирлідингу з помпонами, що поєднує чіткі позиції рук і танцювальні рухи."]], "th": [{"h": "Гімнастика. Вправи у висах і упорах", "p": ["Вправи у висах і упорах розвивають силу рук, плечового пояса та м’язів тулуба."], "ul": ["Дівчата: підтягування з вису лежачи на низькій перекладині (висота 95 см).", "Хлопці: підтягування з вису на перекладині.", "Згинання-розгинання рук в упорі лежачи від гімнастичної лави: тіло пряме, груди опускаються до лави.", "Підсумок модуля: стройові вправи, ЗРВ, акробатика, опорні стрибки, скакалка, рівновага, виси та упори."]}, {"h": "Аеробіка. Підбір рухів відповідно до музичного супроводу. Підсумок за модулем", "ul": ["Базові кроки: марш, степ-тач, ві-степ, грейпвайн, мамбо, ні-ап.", "Рахунок «вісімками», блок — 32 рахунки.", "Вправи на силу, гнучкість і розслаблення.", "Добір рухів: повільна музика — плавні рухи, швидка — енергійні.", "Аеробіка зміцнює серце, легені та покращує настрій."], "p": []}, {"h": "Чирлідинг. Акробатичні елементи під музику. Програма Pom Dance. Підсумок", "p": ["Pom Dance — танцювальна програма з помпонами. Акробатичні елементи в ній виконують лише ті, хто їх добре опанував, і тільки на матах під наглядом учителя."], "ul": ["Позиції рук: Т, High V, Low V, Touchdown, діагональ, «K», «L».", "Стрибки: прямий, ноги нарізно, у групуванні.", "Способи виконання: синхронно, асинхронно, почергово, ріплами, контрастно, «хором».", "Побудови та перебудови, заклички (чір і чант), атрибутика.", "Діагностувальна робота з теми «Чирлідинг» — за групами результатів."]}], "f": "", "pr": ["Виконай згинання-розгинання рук в упорі від стіни або від міцного дивана (8–12 разів, 2 підходи), тримаючи тіло рівно.", "Склади план власної програми Pom Dance на 32 рахунки: запиши позиції рук, стрибок (без акробатики) і фінальну позу."], "q": ["Як правильно виконувати згинання-розгинання рук в упорі лежачи?", "Назви 4 базові кроки аеробіки та поясни, як виконується один із них.", "Які способи виконання рухів у чирлідингу ти знаєш?", "Що таке Pom Dance і чим він відрізняється від програми Game Day?"]}]}, {"name": "ІІІ чверть. Настільний теніс, шашки, волейбол", "lessons": [{"n": "49", "t": "Знайомство з модулями: настільний теніс, шашки, волейбол", "g": "Дізнатися, які модулі вивчатимемо в ІІ семестрі, що таке настільний теніс, шашки й волейбол та яке місце займає волейбол в Україні.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Настільний теніс", "спортивна гра, у якій гравці ракетками перебивають легкий м'яч через сітку на столі."], ["Шашкова дошка", "квадратне поле з 64 клітинок (8×8), на якому грають у шашки лише темними полями."], ["Волейбол", "командна гра, у якій дві команди по шість гравців перебивають м'яч руками через високу сітку."], ["Розіграш", "частина гри від подачі до моменту, коли одна зі сторін виграє очко."]], "th": [{"h": "Настільний теніс. Загальна характеристика гри", "p": ["У ІІ семестрі на нас чекають шість модулів: настільний теніс, шашки, волейбол (ІІІ чверть), а також дитяча легка атлетика, доджбол і баскетбол 3×3 (ІV чверть).", "Настільний теніс — швидка гра за столом, розділеним сіткою. Грати можна один на один (одиночна гра) або двоє на двоє (парна гра)."], "ul": ["М'яч має один раз відскочити на половині суперника — тоді удар правильний.", "Гра (сет) триває до 11 очок; якщо рахунок 10:10, грають, доки хтось не поведе на 2 очки.", "Подачу гравці передають один одному кожні 2 очки, а за рахунку 10:10 — після кожного очка.", "Теніс розвиває швидкість реакції, координацію, уважність і точність рухів."]}, {"h": "Шашки. Зміст гри в шашки", "p": ["Шашки — настільна гра для двох суперників. У кожного по 12 шашок: в одного білі, в іншого чорні. Перший хід роблять білі."], "ul": ["Прості шашки ходять по діагоналі вперед на одне поле.", "Бити шашку суперника обов'язково — перестрибуючи через неї на вільне поле.", "Шашка, що дійшла до останнього ряду суперника, стає дамкою.", "Перемагає той, хто забрав усі шашки суперника або позбавив його можливості ходити."]}, {"h": "Волейбол. Місце українського волейболу на сучасному етапі", "p": ["Волейбол в Україні дуже популярний: у нього грають у школах, спортивних секціях, на пляжах. Діють Федерація волейболу України та національні чемпіонати серед клубів.", "Українські волейболісти та волейболістки виступають за національні збірні й грають у клубах різних країн Європи."], "ul": ["Є класичний волейбол (у залі, 6 на 6) і пляжний волейбол (на піску, 2 на 2).", "Команда має право торкнутися м'яча не більше трьох разів, щоб перебити його на бік суперника.", "Волейбол вчить діяти разом, довіряти партнерам і швидко ухвалювати рішення."]}], "f": "Волейбол придумав у 1895 році американський учитель фізкультури Вільям Морган як спокійнішу за баскетбол гру для залу.", "pr": ["Намалюйте таблицю з трьох стовпців: «Настільний теніс», «Шашки», «Волейбол» — і запишіть у кожен по 2 речі, які вам потрібні для гри.", "Розпитайте рідних, чи грали вони колись у шашки, теніс чи волейбол, і запишіть 2–3 речення про їхні спогади."], "q": ["Які шість модулів ми вивчатимемо в ІІ семестрі?", "До скількох очок триває одна гра в настільному тенісі?", "Скільки шашок у кожного гравця на початку партії?", "Скільки разів команда у волейболі може торкнутися м'яча на своєму боці?"]}, {"n": "50", "t": "Безпека на уроках тенісу й волейболу, пошук інформації про шашки", "g": "Знати правила безпеки на уроках настільного тенісу й волейболу та вміти знаходити й перевіряти інформацію про гру в шашки.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Інструктаж з безпеки", "пояснення правил поведінки, які допомагають уникнути травм на уроці."], ["Розминка", "комплекс легких вправ, який готує м'язи й суглоби до навантаження."], ["Джерело інформації", "книжка, довідник, сайт або людина, від якої ми дізнаємося нові відомості."], ["Спортивна форма", "зручний одяг і взуття з неслизькою підошвою для занять фізичними вправами."]], "th": [{"h": "Настільний теніс. Правила техніки безпеки на уроках настільного тенісу", "p": ["Тенісний стіл важкий, а ракетка тверда, тому навіть у такій «спокійній» грі треба бути уважним."], "ul": ["Займайтеся лише у спортивній формі та взутті, яке не ковзає.", "Не розмахуйте ракеткою біля інших людей і не кидайте її.", "Не сідайте й не спирайтеся на стіл, не пересувайте його без дозволу вчителя.", "Не наступайте на м'ячі на підлозі — підберіть їх, щоб не підвернути ногу.", "Перед грою обов'язково зробіть розминку для рук і кистей."]}, {"h": "Шашки. Пошукова діяльність: обговорення, дискусії, пошук інформації про гру", "p": ["Щоб дізнатися про шашки більше, можна шукати інформацію в книжках, енциклопедіях і на надійних сайтах, а потім обговорювати знайдене з однокласниками."], "ul": ["Порівнюйте відомості з кількох джерел.", "Записуйте, звідки взяли інформацію.", "Під час дискусії вислуховуйте інших і наводьте аргументи, а не просто «я так думаю».", "Якщо сумніваєтеся у факті — перепитайте вчителя."]}, {"h": "Волейбол. Основні правила безпечної поведінки під час виконання фізичних вправ", "ul": ["Починайте заняття з розминки, а завершуйте спокійними вправами на розтягування.", "Знімайте прикраси, годинники; довге волосся збирайте.", "Не стрибайте й не бігайте, коли поруч хтось стоїть занадто близько.", "Не хапайтеся за сітку й не висіть на ній.", "Якщо щось болить або запаморочилося в голові — одразу скажіть дорослому."], "p": []}], "f": "", "pr": ["Знайдіть у книжці чи на надійному сайті 3 цікаві факти про шашки й запишіть їх, вказавши джерело.", "Складіть пам'ятку «5 правил безпеки на уроці волейболу» і намалюйте до неї малюнок."], "q": ["Чому не можна розмахувати ракеткою біля інших людей?", "Як перевірити, чи правдива інформація, яку ви знайшли?", "Навіщо знімати прикраси перед заняттям волейболом?", "Що потрібно зробити, якщо під час вправи стало погано?"]}, {"n": "51", "t": "Сила кистей, розстановка шашок, різновиди ходьби й повільний біг", "g": "Знати вправи для зміцнення кистей рук, уміти розставляти шашки на дошці з нумерацією полів і розрізняти види ходьби.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Кисть", "частина руки від зап'ястя до кінчиків пальців, якою тримають ракетку."], ["Шашкова нотація", "спосіб позначати поля й записувати ходи за допомогою літер a–h і цифр 1–8."], ["Вертикаль", "ряд полів дошки знизу вгору, позначений однією літерою."], ["Повільний біг", "біг у спокійному темпі, під час якого можна розмовляти без задишки."]], "th": [{"h": "Настільний теніс. Вправи для розвитку сили м'язів кистей рук з ракеткою", "p": ["Сильні кисті допомагають міцно, але не «затиснуто» тримати ракетку й робити точні удари. Вправи виконують спочатку повільно, потім швидше."], "ul": ["Стискання й розтискання кулаків (10–15 разів).", "Обертання кистей у один і другий бік.", "Тримаючи ракетку, повертайте кисть долонею вгору й униз.", "Підбивання м'яча на ракетці вгору (на місці, без бігу)."]}, {"h": "Шашки. Розміщення шашок на дошці з нумерацією полів", "p": ["Дошку кладуть так, щоб у лівому нижньому куті в кожного гравця було темне поле. Вертикалі позначають літерами a–h, горизонталі — цифрами 1–8. Кожне поле має назву, наприклад c3 або f6."], "ul": ["Білі шашки стоять на темних полях 1, 2 і 3 горизонталей.", "Чорні шашки стоять на темних полях 6, 7 і 8 горизонталей.", "Горизонталі 4 і 5 на початку партії порожні.", "Найдовша діагональ a1–h8 називається «великою дорогою»."]}, {"h": "Волейбол. Різновиди ходьби. Повільний біг", "ul": ["Ходьба на носках — зміцнює м'язи стоп і гомілок.", "Ходьба на п'ятах — для м'язів передньої частини гомілки.", "Ходьба з високим підніманням стегна — готує до швидких рухів.", "Ходьба приставним кроком боком — як пересування волейболіста.", "Повільний біг виконують рівно, дихають через ніс, плечі розслаблені."], "p": []}], "f": "У шашках грають тільки на темних полях, тому з 64 клітинок дошки в грі використовується лише 32.", "pr": ["Намалюйте шашкову дошку 8×8, підпишіть літери й цифри та позначте початкову розстановку білих і чорних шашок.", "Виконайте вдома 3 вправи для кистей: стискання кулаків, обертання кистей, «помахи пальцями» — по 10 разів."], "q": ["На яких горизонталях стоять білі шашки на початку партії?", "Як називається діагональ a1–h8?", "Навіщо тенісисту сильні кисті рук?", "Які види ходьби ви знаєте?"]}, {"n": "52", "t": "Стійка тенісиста, історія шашок, гравці передньої й задньої ліній", "g": "Знати, як стати в правильну ігрову стійку тенісиста, головне з історії шашок і роль гравців передньої та задньої ліній у волейболі.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Ігрова стійка", "положення тіла тенісиста перед ударом: ноги на ширині плечей, коліна зігнуті, вага на передній частині стоп."], ["Міжнародні шашки", "різновид гри на дошці 10×10, у якому кожен гравець має по 20 шашок."], ["Передня лінія", "троє гравців волейбольної команди, які стоять біля сітки в зонах 2, 3 і 4."], ["Задня лінія", "троє гравців волейбольної команди, які стоять далі від сітки в зонах 1, 6 і 5."]], "th": [{"h": "Настільний теніс. Ігрова початкова стійка тенісиста, її різновиди", "p": ["Правильна стійка дає змогу швидко рушити до м'яча в будь-який бік."], "ul": ["Ноги трохи ширші за плечі, коліна злегка зігнуті.", "Тулуб нахилений уперед, вага на передній частині стоп.", "Рука з ракеткою перед собою, приблизно над краєм столу.", "Нейтральна стійка — ноги на одній лінії, обличчям до столу.", "Стійки для удару справа чи зліва — одна нога трохи попереду."]}, {"h": "Шашки. Історичні аспекти розвитку гри в шашки", "p": ["Ігри, схожі на шашки, люди знали ще з давніх часів. Сучасні правила складалися поступово, і в різних країнах виникли різні види шашок."], "ul": ["Шашки на дошці 8×8 (у нас найпоширеніші): по 12 шашок, дамка ходить на будь-яку кількість полів.", "Міжнародні шашки: дошка 10×10, по 20 шашок у кожного.", "Англійські шашки (чекерс): прості шашки не б'ють назад, а дамка ходить лише на одне поле.", "Шашки визнано видом спорту: проводять чемпіонати для дітей і дорослих."]}, {"h": "Волейбол. Значення гравців передньої і задньої ліній", "p": ["Майданчик кожної команди поділено на 6 зон. Після переходу подачі до команди гравці переходять на наступну зону за годинниковою стрілкою."], "ul": ["Передня лінія (зони 4, 3, 2) атакує й ставить блок біля сітки.", "Задня лінія (зони 5, 6, 1) приймає подачі й сильні удари суперника.", "Гравець із зони 1 виконує подачу.", "Гравці задньої лінії не можуть блокувати та атакувати над сіткою біля неї."]}], "f": "У міжнародних шашках на дошці 10×10 у кожного гравця по 20 шашок — це майже вдвічі більше, ніж у шашках 8×8.", "pr": ["Намалюйте схему волейбольного майданчика однієї команди, пронумеруйте 6 зон і підпишіть, де передня, а де задня лінія.", "Станьте перед дзеркалом в ігрову стійку тенісиста й потримайте її 20 секунд; повторіть 3 рази."], "q": ["Яким має бути положення ніг та колін в ігровій стійці тенісиста?", "Чим міжнародні шашки відрізняються від шашок 8×8?", "Які зони належать до передньої лінії у волейболі?", "У якому напрямку гравці переходять на наступну зону?"]}, {"n": "53", "t": "Інвентар для тенісу, місце міттельшпіля, вправи волейболіста", "g": "Знати, з чого складається інвентар для настільного тенісу, що таке міттельшпіль і чим загальні вправи волейболіста відрізняються від спеціальних.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Накладка", "гумове покриття ракетки, від якого залежать швидкість і обертання м'яча."], ["Міттельшпіль", "середина шашкової партії, коли на дошці ще багато шашок і точиться активна боротьба."], ["Загальна фізична підготовка", "вправи для розвитку всіх фізичних якостей: сили, швидкості, витривалості, гнучкості, спритності."], ["Спеціальна фізична підготовка", "вправи, які розвивають якості й рухи, потрібні саме в певному виді спорту."]], "th": [{"h": "Настільний теніс. Загальна характеристика інвентарю. Спеціальні вправи для ходьби, бігу та присідання", "p": ["Для гри потрібні стіл, сітка, ракетки й м'ячі."], "ul": ["Стіл: довжина 2,74 м, ширина 1,525 м, висота 76 см; посередині — сітка заввишки 15,25 см.", "Ракетка: дерев'яна основа з ручкою та гумові накладки; одна сторона чорна, інша зазвичай червона.", "М'яч: пластиковий, легкий, діаметром 40 мм, білий або помаранчевий.", "Спеціальні вправи: ходьба приставним кроком, біг з легким пружинням, неглибокі присідання з ракеткою в руці."]}, {"h": "Шашки. Місце міттельшпіля в шашковій партії", "p": ["Партію поділяють на три частини: дебют (початок), міттельшпіль (середина) та ендшпіль (кінець)."], "ul": ["У дебюті шашки виводять із початкових позицій.", "У міттельшпілі борються за центр, шукають комбінації та слабкі місця суперника.", "Від гри в міттельшпілі часто залежить, з якою перевагою ви підійдете до кінця партії.", "В ендшпілі шашок мало, і важливо правильно провести шашку в дамки."]}, {"h": "Волейбол. Загальні та спеціальні фізичні вправи волейболіста", "ul": ["Загальні вправи: біг, присідання, вправи на гнучкість, рухливі ігри.", "Спеціальні вправи: пересування у стійці, рухи руками, як під час передачі, швидкі зупинки.", "Вправи для пальців і кистей готують до передач м'яча.", "Вправи для ніг допомагають швидко рухатися майданчиком."], "p": []}], "f": "З 2000 року в настільному тенісі грають м'ячем діаметром 40 мм — він більший за попередній, тому летить трохи повільніше, а гру глядачам видно краще.", "pr": ["Намалюйте тенісний стіл із сіткою й підпишіть його розміри.", "Виконайте 10 неглибоких присідань і 10 кругових рухів кистями, стежачи за рівною спиною."], "q": ["Які розміри тенісного столу та висота сітки?", "З яких трьох частин складається шашкова партія?", "Що відбувається в міттельшпілі?", "Наведіть приклад загальної та спеціальної вправи волейболіста."]}, {"n": "54", "t": "Хватка ракетки, запис партії й правила бою, гнучкість плечового поясу", "g": "Знати види хватки ракетки, вміти записувати ходи шашкової партії й правила взяття та виконувати вправи на гнучкість плечей.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Хватка", "спосіб тримати ракетку в руці."], ["Горизонтальна хватка", "хватка «рукостискання», коли ракетку беруть так, ніби вітаються з кимось за руку."], ["Вертикальна хватка", "хватка «перо», коли ручку ракетки тримають, як ручку для письма."], ["Взяття", "хід, під час якого шашка перестрибує через шашку суперника й та знімається з дошки."], ["Плечовий пояс", "кістки й м'язи плечей, що з'єднують руки з тулубом."]], "th": [{"h": "Настільний теніс. Обертальні рухи кистю. Хватка ракетки, види хваток", "p": ["Від хватки залежить, як ви керуватимете ракеткою. Тримайте її впевнено, але не стискайте з усієї сили — кисть має бути рухливою."], "ul": ["Горизонтальна хватка («рукостискання»): великий палець на одному боці ракетки, вказівний — на іншому, решта обхоплюють ручку.", "Вертикальна хватка («перо»): ручку тримають великим і вказівним пальцями, як ручку для письма.", "Більшість початківців у Європі вчаться горизонтальної хватки.", "Вправи: обертання кистю, «намалювати» кистю коло й вісімку, перебирати пальцями."]}, {"h": "Шашки. Запис партії. Правила шашкового бою", "p": ["Звичайний хід записують через дефіс (c3-d4), а взяття — через двокрапку (c3:e5). Ходи записують парами: спочатку хід білих, потім чорних, наприклад: 1. c3-d4 f6-g5."], "ul": ["Бити обов'язково: якщо можна взяти шашку суперника, відмовитися не можна.", "Прості шашки б'ють і вперед, і назад.", "Якщо після взяття можна бити далі, треба продовжити «ланцюжок».", "Якщо є кілька варіантів взяття, гравець вибирає будь-який з них.", "Шашка, яка під час бою дійшла до останнього ряду, стає дамкою й продовжує бити як дамка."]}, {"h": "Волейбол. Стрибкові вправи, спеціальні вправи для гнучкості плечового пояса", "p": ["Гнучкі плечі потрібні для подачі, передач і ударів. Стрибкові вправи на уроці виконують на м'якій поверхні під наглядом учителя."], "ul": ["Кругові рухи плечима вперед і назад.", "Махи руками вгору-вниз і в сторони.", "Ривки руками в сторони перед грудьми.", "Розтягування: заведіть одну руку за голову, іншою легко потягніть лікоть."]}], "f": "", "pr": ["Запишіть у шашковій нотації 3 ходи, розставивши шашки на намальованій дошці: два звичайні ходи та одне взяття.", "Виконайте комплекс для плечей: 10 кругових рухів уперед, 10 назад, 2 розтягування для кожної руки."], "q": ["Чим горизонтальна хватка відрізняється від вертикальної?", "Як записують звичайний хід і взяття в шашках?", "Чи можна в шашках відмовитися від взяття?", "Які вправи розвивають гнучкість плечового пояса?"]}, {"n": "55", "t": "Прийом подачі, закономірності міттельшпіля, гра «Малюкбол»", "g": "Знати, як підготуватися до прийому подачі в тенісі, які основні закономірності діють у міттельшпілі та як грати в «Малюкбол».", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Прийом подачі", "перший удар гравця, який відбиває подачу суперника."], ["Центр дошки", "найважливіші поля шашкової дошки c5, d4, e5 і f4, звідки шашки впливають на більшу частину гри."], ["Малюкбол", "спрощена гра на основі волейболу, у якій м'яч ловлять і перекидають через сітку руками."], ["Готовність до удару", "положення, в якому гравець чекає м'яча: ноги зігнуті, увага на суперникові, ракетка перед собою."]], "th": [{"h": "Настільний теніс. Прийом подачі", "p": ["Прийом подачі — це відповідь на подачу суперника. Головне — не поспішати, а уважно стежити за м'ячем і ракеткою суперника."], "ul": ["Станьте в ігрову стійку приблизно посередині своєї сторони столу.", "Стежте, як суперник б'є: від цього залежить обертання м'яча.", "Відбивайте м'яч після відскоку на вашій половині.", "Спершу відбийте надійно й точно, а не сильно."]}, {"h": "Шашки. Закономірності міттельшпіля, його місце в шашковій партії", "ul": ["Шашки в центрі сильніші, ніж на краю дошки.", "Тримайте шашки разом, щоб вони захищали одна одну.", "Не поспішайте просувати поодинокі шашки вперед: їх легко взяти.", "Перед кожним ходом перевіряйте, чи не можна суперникові побити вашу шашку.", "Шукайте можливості для комбінацій — коли жертва шашки дає змогу побити більше."], "p": []}, {"h": "Волейбол. Рухлива гра «Малюкбол»", "p": ["«Малюкбол» — спрощена гра, яка допомагає навчитися волейболу. Правила можуть відрізнятися, ось простий варіант для уроку."], "ul": ["Дві команди на майданчику, між ними натягнута сітка.", "М'яч ловлять двома руками й рави виконують у повільному, а потім у заданому темпі, наприклад перед дзеркалом, щоб бачити себе."], "ul": ["Імітація удару справа: поворот тулуба, рух ракетки знизу вгору-вперед.", "Імітація удару зліва: ракетка перед тілом, рух від себе.", "Імітація подачі: підкинути уявний м'яч з відкритої долоні й «ударити» по ньому.", "Стежте, щоб після руху ракетка поверталася в положення готовності."]}, {"h": "Шашки. Аналіз дебюту", "p": ["Після партії корисно розібрати перші ходи: чи правильно ви виводили шашки, чи не віддали центр, чи не залишили слабких місць."], "ul": ["Запишіть партію або хоча б перші 5–8 ходів.", "Знайдіть хід, після якого позиція погіршилася.", "Подумайте, який хід був би кращим.", "Порівняйте свої ходи з порадами з книжок чи вчителя."]}, {"h": "Волейбол. Способи пересування гравців по ігровому майданчику", "ul": ["Ходьба й біг у стійці волейболіста.", "Приставні кроки вправо та вліво.", "Схресні кроки — для швидшого переміщення вбік.", "Біг спиною вперед — щоб відійти назад, не відводячи погляду від м'яча.", "Зупинка стрибком або кроком — щоб зайняти стійку перед прийомом м'яча."], "p": []}], "f": "", "pr": ["Перед дзеркалом виконайте по 10 імітацій удару справа, удару зліва й подачі (без ракетки або з легким предметом, подалі від меблів).", "Зіграйте з кимось із рідних партію в шашки, запишіть перші 5 ходів і письмово оцініть свій дебют."], "q": ["Що таке імітаційна вправа і навіщо вона потрібна?", "Що потрібно зробити, щоб проаналізувати дебют?", "Які способи пересування використовують волейболісти?", "Навіщо волейболісту вміти бігти спиною вперед?"]}, {"n": "58", "t": "Подачі й прийоми в тенісі, завдання міттельшпіля, сила волейболіста", "g": "Знати правила подачі в настільному тенісі, основні завдання гри в міттельшпілі та вправи для сили рук і ніг.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Подача", "удар, яким гравець вводить м'яч у гру на початку розіграшу."], ["Підкидання м'яча", "дія під час подачі, коли м'яч з відкрит откий рух від себе, м'яч відбивають після відскоку.", "По діагоналі — з кута в протилежний кут.", "По прямій — уздовж бокової лінії.", "Головне в захисті — точність і стабільність."]}, {"h": "Шашки. Інші комбінації під час гри в міттельшпілі", "p": ["Більшість комбінацій побудовано на обов'язковому взятті: ви віддаєте шашку, суперник мусить її бити, і його шашки опиняються там, де ви можете побити кілька."], "ul": ["Шукайте шашки суперника, між якими є вільні поля.", "Перевіряйте, куди потрапить шашка суперника після обов'язкового взяття.", "Рахуйте: скільки ви віддаєте і скільки отримуєте.", "Перевіряйте, чи немає такої самої загрози з боку суперника."]}, {"h": "Волейбол. Спеціальні вправи для розвитку спини, преса та вправи на розтягування", "ul": ["Для преса: підйоми тулуба з положення лежачи на спині, ноги зігнуті.", "Для спини: «човник» — лежачи на животі, підняти руки й ноги на кілька секунд.", "«Планка» на передпліччях 15–20 секунд.", "Розтягування: нахили вперед сидячи, потягування рук угору.", "Розтягуйтеся плавно, без ривків і болю."], "p": []}], "f": "", "pr": ["Виконайте вдома комплекс: 10 підйомів тулуба, 3 рази «човник» по 5 секунд, «планка» 15 секунд і 2 нахили вперед сидячи.", "Намалюйте тенісний стіл і стрілками покажіть удар по прямій та удар по діагоналі."], "q": ["Чим удар по прямій відрізняється від удару по діагоналі?", "Як виконують підрізку?", "На якому правилі побудовано більшість шашкових комбінацій?", "Як правильно виконувати вправи на розтягування?"]}, {"n": "62", "t": "Подачі з нижнім обертанням, виграш і нічия, передача зверху", "g": "Знати, як виконати подачу з нижнім обертанням, коли в шашках фіксують виграш або нічию та як правильно передавати м'яч двома руками зверху.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Нижнє обертання", "обертання м'яча «назад», через яке після відскоку він ніби гальмує й прагне опуститися вниз."], ["Нічия", "результат шашкової партії, коли жоден гравець не виграв."], ["Виграш у шашках овх і прийом подачі, «чортове колесо», естафета з передачею м'яча", "g": "Вміти виконувати поштовх у грі з партнером, знати, що таке комбінація «чортове колесо», та грати в естафету «Передав м'яч — стань назад у колону».", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Поштовх", "короткий удар без великого замаху, яким м'яч ніби підштовхують на бік суперника."], ["Чортове колесо", "назва шашкової комбінації, під час якої шашка чи дамка б'є кілька шашок, рухаючись по замкненому шляху."], ["Естафета", "командне змагання, у якому учасники по черзі виконують завдання й передають естафету один одному."], ["Колона", "шикування, під час якого учні стоять один за одним."]], "th": [{"h": "Настільний теніс. Поштовховий удар з партнером; подача та прийом подачі", "p": ["Поштовх — один із перших ударів, яких вчаться початківці. Його виконують біля столу, переважно зліва."], "ul": ["Ракетка перед тілом, трохи нахилена вперед.", "Рух короткий: від себе вперед, без великого замаху.", "Ударте м'яч незабаром після відскоку.", "З партнером: один подає, інший приймає подачу й відповідає поштовхом; далі розігрують кілька ударів по діагоналі.", "Мета вправи — якомога довше втримувати м'яч у грі."]}, {"h": "Шашки. Особливості правил гри дамками. «Чортове колесо»", "p": ["«Чортове колесо» — одна з відомих шашкових комбінацій. Її назва пов'язана з тим, що шашка під час взяття рухається ніби по колу."], "ul": ["Під час взяття шашка чи дамка може пройти через те саме вільне поле кілька разів.", "Перестрибувати через ту саму шашку суперника двічі не можна.", "Побиті шашки знімають з дошки лише після завершення ходу.", "Щоб знайти таку комбінацію, уважно рахуйте всі можливі шляхи взяття."]}, {"h": "Волейбол. Рухлива гра-естафета «Передав м'яч — стань назад у колону»", "ul": ["Клас ділиться на 2–3 команди, кожна стає в колону.", "Навпроти кожної колони на відстані кількох метрів стоїть капітан з м'ячем.", "Капітан передає м'яч першому гравцеві, той повертає м'яч капітанові й біжить у кінець своєї колони.", "Гра триває, доки всі гравці не виконають передачу.", "Перемагає команда, яка першою закінчила естафету без втрат м'яча."], "p": []}], "f": "", "pr": ["Перед дзеркалом виконайте 10 імітацій поштовху (без м'яча), стежачи, щоб рух був коротким і ракетка не йшла далеко назад.", "Придумайте власну естафету з передачею м'яча для 2 команд і запишіть її правила (4–5 пунктів)."], "q": ["Як виконується поштовх у настільному тенісі?", "Що таке «чортове колесо» в шашках?", "Чи можна під час взяття перестрибувати через ту саму шашку двічі?", "Як виграти естафету «Передав м'яч — стань назад у колону»?"]}, {"n": "64", "t": "Пересування біля столу, трикутник Петрова, вправи на швидкість", "g": "Учень дізнається, як пересуватися біля тенісного столу, що таке трикутник Петрова в шашках і як розвивати швидкість для волейболу.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Приставний крок", "пересування вбік, коли одна нога приставляється до іншої без схрещування ніг."], ["Трикутник Петрова", "відомий спосіб, яким три дамки ловлять одну дамку суперника, якщо вона не стоїть на великій дорозі."], ["Велика дорога", "найдовша діагональ шашкової дошки, що з'єднує кути a1 і h8."], ["Швидкість", "здатність виконувати рухи за найкоротший час."]], "th": [{"h": "Настільний теніс. Пересування у парі та у 3-метровій зоні", "p": ["Тенісист рідко стоїть на місці: щоб влучно відбити м'яч, треба вчасно до нього підійти. Біля столу зазвичай пересуваються короткими приставними кроками, щоб не схрещувати ноги й не втратити рівновагу."], "ul": ["Ноги на ширині плечей, коліна злегка зігнуті, вага на передній частині стопи.", "Після кожного удару повертайся в зручну позицію посередині.", "У парній грі партнери б'ють по черзі, тому після удару треба звільнити місце партнерові.", "Дивись на м'яч, а не на ноги."]}, {"h": "Шашки. Система гри на виграш (трикутник Петрова)", "p": ["Якщо в тебе три дамки, а в суперника одна, перемогу можна здобути, але лише тоді, коли дамка суперника не тримає велику дорогу. Дамки шикуються «трикутником» і поступово заганяють самотню дамку, доки вона не опиниться під боєм.", "Якщо самотня дамка вже стоїть на великій дорозі, за звичними правилами така позиція вважається нічийною."], "ul": []}, {"h": "Волейбол. Вправи для розвитку швидкості", "p": ["У волейболі треба швидко реагувати на м'яч і вчасно зрушити з місця."], "ul": ["Старт за сигналом (оплеск, свисток) з різних положень.", "Короткі прискорення на 5–10 метрів.", "Біг на місці в швидкому темпі 10–15 секунд.", "Між вправами — відпочинок і спокійне дихання."]}], "f": "Трикутник Петрова названо на честь шашкіста й шахіста Олександра Петрова, який описав цей прийом.", "pr": ["Намалюй шашкову дошку й познач на ній велику дорогу (від a1 до h8).", "Виконай удома 10 приставних кроків уліво і 10 управо в стійці тенісиста, тримаючи коліна злегка зігнутими."], "q": ["Чому біля тенісного столу пересуваються приставними кроками?", "Що таке велика дорога на шашковій дошці?", "Коли три дамки не можуть виграти в однієї?", "Які вправи розвивають швидкість волейболіста?"]}, {"n": "65", "t": "Прийом подачі з нижнім обертанням, відновлення емоцій, спритність", "g": "Учень дізнається, як прийняти подачу з нижнім обертанням, як заспокоїтися під час шашкової партії та як розвивати спритність.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Нижнє обертання", "обертання м'яча «назад», через яке після відскоку він ніби гальмує й тягнеться вниз."], ["Підрізка", "удар знизу вперед ракеткою з відкритою площиною, яким м'ячу надають нижнє обертання."], ["Релаксація", "свідоме розслаблення м'язів і заспокоєння дихання для відновлення сил."], ["Спритність", "уміння швидко й точно виконувати рухи та пристосовуватися до нових ситуацій."]], "th": [{"h": "Настільний теніс. Техніка прийому подач з нижнім обертанням м'яча", "p": ["М'яч із нижнім обертанням після удару по ракетці прагне піти вниз — у сітку. Тому ракетку під час прийому трохи «відкривають» (повертають площиною догори) і ведуть знизу вперед."], "ul": ["Стеж за рухом ракетки суперника — він підкаже, яке буде обертання.", "Відкрий ракетку й підріж м'яч м'яким рухом уперед.", "Не бий сильно: головне — перекинути м'яч через сітку.", "Після прийому одразу повертайся в стійку."]}, {"h": "Шашки. Вправи для відновлення емоційного стану", "p": ["Шашкова партія вимагає уваги, а помилка чи програш можуть засмутити. Короткі вправи допомагають заспокоїтися й думати ясно."], "ul": ["Дихання «4–4»: повільний вдих на 4 рахунки, видих на 4 рахунки.", "Стиснути кулаки на 5 секунд — розслабити.", "Покрутити плечима вперед і назад.", "Подивитися у вікно на далекий предмет, щоб відпочили очі."]}, {"h": "Волейбол. Вправи для розвитку спритності", "p": [], "ul": ["Підкидання й ловля м'яча однією та двома руками.", "Ловля м'яча після оплеску чи повороту.", "Біг зі зміною напрямку за сигналом.", "Жонглювання двома м'ячами (для тих, хто впевнено ловить один)."]}], "f": "", "pr": ["Виконай дихальну вправу «4–4» п'ять разів і запиши, як ти почуваєшся після неї.", "Підкидай м'яч (або згорнуті шкарпетки) і лови його 20 разів, чергуючи праву та ліву руку."], "q": ["Що відбувається з м'ячем, що має нижнє обертання?", "Як тримати ракетку під час прийому такої подачі?", "Які вправи допомагають заспокоїтися під час гри в шашки?", "Що таке спритність?"]}, {"n": "66", "t": "Поштовх із партнером, позиції ендшпілю, прийом м'яча знизу", "g": "Учень знатиме, як виконувати поштовх у парі, що таке ендшпіль і як прийняти м'яч двома руками знизу.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Поштовх", "простий удар у настільному тенісі, коли м'яч коротким рухом «підштовхують» ракеткою вперед відразу після відскоку."], ["Ендшпіль", "заключна частина шашкової партії, коли на дошці залишилося мало шашок."], ["Прийом знизу", "спосіб прийняти м'яч у волейболі передпліччями з'єднаних рук."], ["Розіграш", "відрізок гри від подачі до моменту, коли хтось отримує очко."]], "th": [{"h": " "ul": []}], "f": "", "pr": ["Запиши правила рахунку в настільному тенісі: до скількох очок триває партія і як часто переходить подача.", "Намалюй схему естафети «Передав м'яч — стань назад у колону» стрілками."], "q": ["До скількох очок грають партію в настільному тенісі?", "Як б'є дамка в шашках?", "Коли знімають збиті шашки з дошки?", "Як проводиться естафета «Передав м'яч — стань назад у колону»?"]}, {"n": "69", "t": "Атакувальні удари в тенісі, штик Гоняєва, нижня пряма та бокова подачі", "g": "Учень дізнається про накат і контрудар у настільному тенісі, систему «штик» у шашках та нижні подачі у волейболі.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Накат", "атакувальний удар, коли ракетка рухається знизу вгору й уперед і надає м'ячу верхнього обертання."], ["Контрудар", "атакувальна відповідь на атакувальний удар суперника."], ["Штик", "побудова з шашок, яка клином входить у розташування шашок суперника."], ["Нижня пряма подача", "подача у волейболі, коли гравець стоїть обличчям до сітки й б'є по м'ячу знизу."]], "th": [{"h": "Настільний теніс. Атакувальні прийоми: накат справа та зліва, удар, контрудар", "ul": ["Накат справа виконують, повертаючи тулуб праворуч на замаху.", "Накат зліва — коротший рух перед тулубом.", "Ракетка «закрита» (нахилена вперед), рух — знизу вгору й уперед.", "Контрудар виконують, коли суперник атакує, — потрібна добра реакція."], "p": []}, {"h": "Шашки. Система гри на виграш (штик Гоняєва)", "p": ["Штик — одна з відомих побудов у шашках: шашки стоять ланцюжком по діагоналі й ніби вклинюються в позицію суперника. Така побудова може обмежити рухи шашок суперника, але вимагає підтримки, щоб її не розбили.", "Як саме розігрувати систему Гоняєва, розберемо на дошці разом з учителем."], "ul": []}, {"h": "Волейбол. Нижня пряма та бокова подачі з 4–6 м від сітки та від стіни", "ul": ["Нижня пряма: стоїш обличчям до сітки, ліва нога попереду (для правші), м'яч у лівій руці.", "Нижня бокова: стоїш боком до сітки, удар — рухом руки збоку.", "Б'ють по м'ячу основою долоні або кулаком.", "Місце для подачі обирай так, щоб перед тобою було вільно, а відстань відповідала твоїм силам (4–6 м)."], "p": []}], "f": "", "pr": ["Перед дзеркалом без м'яча виконай по 10 імітацій накату справа та зліва.", "Опиши письмово порядок виконання нижньої прямої подачі (3–4 кроки)."], "q": ["Яке обертання отримує м'яч після накату?", "Що таке контрудар?", "Що таке штик у шашках?", "Чим нижня пряма подача відрізняється від нижньої бокової?"]}, {"n": "70", "t": "Подачі з нижнім обертанням, дамка проти простих шашок, прийом після подачі", "g": "Учень удосконалить знання про подачу з нижнім обертанням, дізнається, як дамка бореться з простими шашками, і як приймати м'яч після нижньої подачі.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Подача", "удар, яким починається кожен розіграш у грі."], ["Проста шашка", "звичайна шашка, яка ходить лише вперед на одне поле по діагоналі."], ["Прохідна шашка", "проста шашка, якій шашки суперника не можуть завадити пройти в дамки."], ["Траєкторія", "лінія, по якій летить м'яч."]], "th": [{"h": "Настільний теніс. Подачі з нижнім обертанням м'яча", "ul": ["М'яч підкидають з відкритої долоні вертикально вгору (за правилами — не менше ніж на 16 см).", "Удар виконують ззаду від кінцевої лінії столу.", "Ракетка відкрита, рух — під м'яч уперед, ніби «підрізаєш» його.", "Чим коротший і швидший рух кистю, тим сильніше обертання."], "p": []}, {"h": "Шашки. Дамка проти кількох простих шашок", "p": ["Дамка дуже сильна, бо ходить на будь-яку відстань. Проти однієї чи двох простих шашок вона часто виграє, якщо встигне їх перехопити. Але кілька шашок, що підтримують одна одну, можуть пройти в дамки.", "Головне завдання дамки — стати на діагональ, якою мають пройти прості шашки, і не дати їм дістатися останнього ряду."], "ul": []}, {"h": "Волейбол. Прийом м'яча знизу після нижньої прямої (бокової) подачі", "ul": ["Стеж за траєкторією м'яча від моменту подачі.", "Встигни переміститися й стати в стійку.", "Приймай м'яч передпліччями перед собою, на рівні пояса.", "Спрямовуй м'яч вгору, щоб партнерові було зручно продовжити."], "p": []}], "f": "", "pr": ["Розстав на дошці дамку білих і дві прості шашки чорних, спробуй знайти, як дамка може їх зупинити. Запиши свої ходи.", "Підкинь м'ячик (або згорнуті шкарпетки) з відкритої долоні вертикально вгору 15 разів, стежачи, щоб він падав назад у долоню."], "q": ["На яку висоту за правилами підкидають м'яч під час подачі в настільному тенісі?", "Як рухається ракетка під час подачі з нижнім обертанням?", "Що таке прохідна шашка?", "Куди треба спрямувати м'яч під час прийому знизу?"]}, {"n": "71", "t": "Навчальна гра в теніс, вправи для шашкіста, стройові вправи та біг", "g": "Учень пригадає, як провести навчальну гру в настільний теніс, дізнається, які фізичні вправи корисні шашкістові, і повторить стройові вправи.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Гейм", "одна партія в настільному тенісі, що триває до 11 очок."], ["Витривалість", "здатність довго виконувати роботу без втоми."], ["Шеренга", "стрій, у якому учні стоять поруч один з одним на одній лінії."], ["Колона", "стрій, у якому учні стоять один за одним."]], "th": [{"h": "Настільний теніс. Навчальна гра «Теніс настільний»", "ul": ["Перед грою — розминка кистей, плечей і ніг.", "Жеребкуванням визначають, хто подає першим.", "Матч складається з кількох геймів (наприклад, до 2 або 3 перемог).", "Після гри — подякуй суперникові."], "p": []}, {"h": "Шашки. Спеціальні індивідуальні вправи для розвитку фізичних якостей", "p": ["Шашкіст довго сидить, тому йому потрібні сильні м'язи спини, гарна постава й витривалість. Між партіями варто рухатися."], "ul": ["Вправи для постави: «кішечка», зведення лопаток.", "Нахили й повороти голови — повільно.", "Ходьба або легкий біг на свіжому повітрі.", "Вправи для очей: подивитися вдалину, покліпати."]}, {"h": "Волейбол. Стройові вправи. Різновиди ходьби та бігу", "ul": ["Шикування в шеренгу й колону, повороти на місці.", "Ходьба на носках, на п'ятах, у напівприсіді.", "Біг з високим підніманням стегна, із закиданням гомілки.", "Біг приставними кроками правим і лівим боком."], "p": []}], "f": "", "pr": ["Склади й запиши комплекс із 4 вправ для постави для шашкіста й виконай його.", "Виконай удома ходьбу на носках і на п'ятах по 30 секунд."], "q": ["Чим шеренга відрізняється від колони?", "Скільки очок триває гейм у настільному тенісі?", "Чому шашкістові потрібні фізичні вправи?", "Які різновиди ходьби ти знаєш?"]}, {"n": "72", "t": "Вправи для кистей, розв'язування шашкових діаграм, ігри для волейболу", "g": "Учень виконуватиме вправи для кистей рук, навчиться розв'язувати шашкові діаграми й дізнається про рухливі ігри для волейболістів.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Діаграма", "малюнок шашкової дошки з позицією, яку треба розв'язати."], ["Нотація", "спосіб запису ходів за назвами полів, наприклад c3–d4."], ["Хватка", "спосіб тримати ракетку в руці."], ["Сила кисті", "здатність м'язів кисті й пальців міцно стискати та утримувати предмет."]], "th": [{"h": "Настільний теніс. Спеціальні фізичні вправи для розвитку м'язів кистей рук", "ul": ["Стискання м'якого м'ячика або еспандера 10–15 разів кожною рукою.", "Обертання кистей у різні боки.", "«Павучок»: пальці рук упираються один в одного й натискають.", "Тримання ракетки правильною хваткою й повільні повороти кисті."], "p": []}, {"h": "Шашки. Розв'язок шашкових діаграм", "p": ["На діаграмі зазвичай написано завдання: «Хід білих. Виграш» або «Нічия». Розв'язуючи, спочатку знайди всі можливі ходи й бої, а потім перевір відповіді суперника.", "Розв'язок записують нотацією: напр., c3–d4 — тихий хід, c3:e5 — бій."], "ul": []}, {"h": "Волейбол. Рухливі ігри та естафети для удосконалення гри", "ul": ["«М'яч капітанові» — точні передачі в команді.", "Естафети з передачами м'яча над головою та між ногами.", "«Не дай м'ячу впасти» — підбивання м'яча вгору.", "Під час ігор дотримуйся правил і не штовхай інших."], "p": []}], "f": "", "pr": ["Виконай комплекс вправ для кистей (3–4 вправи) і запиши, які з них були найважчими.", "Намалюй діаграму з простою позицією (2–3 шашки) і запиши розв'язок нотацією."], "q": ["Що таке шашкова діаграма?", "Як записують бій у шашковій нотації?", "Навіщо тенісистові сильні кисті?", "Які рухливі ігри допомагають навчитися волейболу?"]}, {"n": "73", "t": "Пошук інформації про теніс, поведінка за шашковою дошкою, естафета", "g": "Учень знайде цікаві відомості про вплив настільного тенісу на організм, вивчить правила поведінки за шашковою дошкою й пригадає естафету з м'ячем.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Шашковий етикет", "правила ввічливої та чесної поведінки під час гри в шашки."], ["Правило «взявся — ходи»", "правило, за яким шашкою, до якої торкнувся гравець, треба зробити хід, якщо це можливо."], ["Реакція", "швидкість відповіді організму на сигнал або рух м'яча."], ["Координація", "узгодженість рухів різних частин тіла."]], "th": [{"h": "Настільний теніс. Творчо-пошукові завдання: вплив на організм", "p": ["Настільний теніс розвиває реакцію, координацію, увагу й окомір. Під час гри працюють ноги, руки, спина, а мозок постійно ухвалює рішення."], "ul": ["Шукай інформацію в підручниках, енциклопедіях, на сайтах спортивних федерацій.", "Перевіряй факти щонайменше у двох джерелах.", "Записуй, звідки взяв інформацію."]}, {"h": "Шашки. Правила поведінки за шашковою дошкою", "ul": ["Перед партією та після неї потиснути руку або привітатися.", "Не підказувати й не коментувати чужу гру.", "Торкнувся шашки — ходи нею (правило «взявся — ходи»).", "Поводитися тихо, не відволікати суперника.", "Чесно визнавати поразку й вітати переможця."], "p": []}, {"h": "Волейбол. Рухлива гра-естафета «Передав м'яч — стань назад у колону»", "p": ["Пригадай правила: команда стоїть колоною, м'яч передають по ланцюжку, а гравець після передачі перебігає в кінець колони. Важливо передавати м'яч у руки, а не кидати, щоб він не впав."], "ul": []}], "f": "", "pr": ["Знайди й запиши 2–3 факти про те, як настільний теніс впливає на здоров'я, та вкажи джерела.", "Склади пам'ятку «Правила поведінки за шашковою дошкою» з 5 пунктів."], "q": ["Які якості розвиває настільний теніс?", "Що означає правило «взявся — ходи»?", "Як треба поводитися після програної партії?", "Як правильно передавати м'яч в естафеті?"]}, {"n": "74", "t": "Навчальна гра в теніс, вибір ходу в шашках, «Малюкбол»", "g": "Учень зіграє навчальну гру в настільний теніс, навчиться обирати найкращий хід у шашках і закріпить гру «Малюкбол».", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Варіант", "можлива послідовність ходів, яку гравець продумує наперед."], ["Обов'язкове бите", "правило, за яким бити шашку суперника треба, якщо є така можливість."], ["Тихий хід", "хід шашкою без бою."], ["Тактика", "план дій у грі, щоб перемогти суперника."]], "th": [{"h": "Настільний теніс. Навчальна гра «Теніс настільний»", "ul": ["Поєднуй вивчені удари: поштовх, підрізку, накат.", "Подавай по-різному, щоб суперникові було важче.", "Намагайся бити в різні частини столу.", "Рахунок оголошуй уголос перед кожною подачею."], "p": []}, {"h": "Шашки. Вибір ходу", "p": ["Перед кожним ходом корисно поставити собі кілька запитань. Так менше шансів «віддати» шашку."], "ul": ["Чи є в мене обов'язкове бите?", "Що загрожує мені після ходу суперника?", "Які 2–3 варіанти я маю, і що відповість суперник на кожен?", "Чи не залишаю я шашку без захисту?"]}, {"h": "Волейбол. Рухлива гра «Малюкбол»", "p": ["Це спрощена гра через сітку, яка вчить стежити за м'ячем, швидко переміщатися й діяти командою. Під час гри дотримуйся правил, які пояснив учитель, і будь уважним до партнерів."], "ul": []}], "f": "", "pr": ["Зіграй удома партію в шашки з кимось із рідних і перед кожним ходом став собі запитання з уроку.", "Запиши, які вивчені удари в настільному тенісі ти знаєш і чим вони відрізняються."], "q": ["Що таке тихий хід?", "Які запитання варто поставити собі перед ходом у шашках?", "Що таке обов'язкове бите?", "Чому в навчальній грі корисно бити в різні частини столу?"]}, {"n": "75", "t": "Закріплення навичок у тенісі, творчість і командна гра в шашках, передачі", "g": "Учень зрозуміє, як формуються рухові навички, як поєднувати власну творчість і командну взаємодію та як виконувати передачі м'яча у волейболі.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Рухова навичка", "дія, яку людина після багатьох повторень виконує легко й майже автоматично."], ["Командна взаємодія", "узгоджені дії гравців однієї команди заради спільного результату."], ["Передача зверху", "передача м'яча у волейболі пальцями обох рук над головою."], ["Етап навчання", "послідовний крок у вивченні руху: ознайомлення, розучування, закріплення."]], "th": [{"h": "Настільний теніс. Практичне виконання рухів і вправ на різних етапах навчання", "ul": ["Ознайомлення — дивишся, як виконують рух, і пробуєш повільно.", "Розучування — виконуєш рух частинами, потім повністю.", "Закріплення — багато повторень, гра в парі.", "Удосконалення — виконання в грі, у швидкому темпі."], "p": []}, {"h": "Шашки. Індивідуальна творчість і командна взаємодія", "p": ["Творчість у шашках — це пошук власних рішень і цікавих комбінацій. Але шашки бувають і командними: у командних змаганнях кожен грає свою партію, а очки всіх гравців додаються. Тому важлива підтримка товаришів і спільний аналіз партій."], "ul": []}, {"h": "Волейбол. Передачі м'яча", "ul": ["Передача зверху: руки над чолом, пальці утворюють «ківш».", "М'яч торкається пальців, а не долонь.", "Передача знизу — передпліччями з'єднаних рук.", "Перед передачею треба стати під м'яч."], "p": []}], "f": "", "pr": ["Намалюй або сфотографуй положення рук для передачі зверху й для передачі знизу та підпиши їх.", "Обери будь-який рух (наприклад, імітацію поштовху ракеткою) і повтори його 20 разів, записуючи, на якому етапі навчання ти перебуваєш."], "q": ["Що таке рухова навичка?", "Назви етапи навчання руху.", "Як рахують результат у командних змаганнях із шашок?", "Якою частиною рук торкаються м'яча під час передачі зверху?"]}, {"n": "76", "t": "Квести з тенісу, нічийне закінчення в шашках, «Малюкбол»", "g": "Учень дізнається про ігри й квести з елементами настільного тенісу, нічийне закінчення партії з дамками та повторить гру «Малюкбол».", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Квест", "гра-пригода, у якій учасники виконують завдання одне за одним, щоб дійти до мети."], ["Нічия", "закінчення партії, коли ніхто не виграв."], ["Перевага", "краще становище одного гравця порівняно з іншим."], ["Окомір", "уміння оцінювати відстань і напрямок на око."]], "th": [{"h": "Настільний теніс. Ігри, розваги та квести з елементами настільного тенісу: індивідуально", "ul": ["«Набивання»: скільки разів поспіль підіб'єш м'ячик ракеткою вгору.", "«Влучний стрілець»: потрапити м'ячиком у коробку чи кошик.", "«Перевертень»: підбивати м'яч то однією, то іншою стороною ракетки.", "Квест: виконати 3–4 завдання поспіль і записати свій результат."], "p": []}, {"h": "Шашки. «Дві дамки проти дамки і простої шашки» — нічийне закінчення", "p": ["Матеріальна перевага ще не гарантує перемогу. У цьому закінченні сили майже рівні, і за правильної гри обох сторін партія закінчується нічиєю.", "Головне для сторони, що захищається, — тримати свою дамку на важливих діагоналях і не потрапити під бій."], "ul": []}, {"h": "Волейбол. Рухлива гра «Малюкбол»", "p": ["Повторюємо гру: стеж за м'ячем, швидко переміщайся і допомагай партнерам. Перед грою — розминка, під час гри — стеж за безпекою на майданчику."], "ul": []}], "f": "", "pr": ["Склади власний квест із 3 завдань з ракеткою й м'ячиком (або паперовою кулькою), виконай його й запиши результат.", "Розстав на дошці позицію «дві дамки проти дамки й простої шашки» і спробуй знайти, як захиститися."], "q": ["Що таке квест?", "Що таке нічия?", "Чи завжди перевага в кількості шашок дає перемогу?", "Що розвивають ігри з влучання м'ячиком?"]}, {"n": "77", "t": "Квести в парах і командою, змагання й віртуальні шашки, навчальна гра «Волейбол»", "g": "Учень дізнається про командні ігри з елементами настільного тенісу, участь у змаганнях і онлайн-шашки та про навчальну гру у волейбол.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Онлайн-турнір", "змагання, у якому учасники грають через інтернет."], ["Жеребкування", "випадковий розподіл, наприклад хто подає першим або хто з ким грає."], ["Партія у волейболі", "частина матчу, яку грають до певної кількості очок."], ["Перехід", "зміна місць гравців волейбольної команди на майданчику після повернення подачі."]], "th": [{"h": "Настільний теніс. Ігри, розваги та квести: у парах і командою", "ul": ["«Набивання в парі» — передавати м'ячик ракеткою одне одному без столу.", "Командна естафета з м'ячиком на ракетці.", "«Круговий теніс» — гравці по черзі б'ють по м'ячу й переходять на інший бік.", "Підтримуй партнера, а не критикуй."], "p": []}, {"h": "Шашки. Участь у конкурсах і змаганнях. Віртуальні шашки", "p": ["Змагання бувають шкільні, міські, а також онлайн. Перед змаганням гравців розподіляють жеребкуванням, а результат залежить від суми набраних очок.", "Граючи віртуально, дотримуйся тих самих правил чесності, не користуйся підказками програм і не повідомляй незнайомцям особистої інформації."], "ul": []}, {"h": "Волейбол. Навчальна гра «Волейбол»", "ul": ["Команда має право на три дотики до м'яча, щоб перебити його на бік суперника.", "Один гравець не може торкатися м'яча двічі поспіль.", "Якщо м'яч упав на майданчику команди, очко отримує суперник.", "Після повернення права подачі команда виконує перехід."], "p": []}], "f": "Волейбол придумав 1895 року в США викладач Вільям Морган.", "pr": ["Запиши три правила безпечної гри в шашки онлайн.", "Намалюй волейбольний майданчик і стрілками покажи, як гравці виконують перехід."], "q": ["Скільки дотиків до м'яча має команда у волейболі?", "Що таке жеребкування?", "Яких правил варто дотримуватися, граючи онлайн?", "Що таке перехід у волейболі?"]}, {"n": "78", "t": "Підсумок: навчальна гра в теніс, шашки, «Малюкбол». Діагностувальна робота", "g": "Учень підсумує знання з настільного тенісу, шашок і волейболу та виконає діагностувальну роботу.", "k": "Модулі: Настільний теніс · Шашки · Волейбол", "terms": [["Діагностувальна робота", "перевірка, яка показує, що учень уже знає й уміє і над чим ще варто попрацювати."], ["Матч", "змагання між гравцями чи командами, що складається з кількох партій."], ["Комбінація", "серія ходів, часто з жертвою шашок, що веде до виграшу або вигідної позиції."], ["Спрощені правила", "правила, полегшені для навчання, щоб усі могли брати участь у грі."]], "th": [{"h": "Настільний теніс. Навчальна гра. Підсумок", "ul": ["Стійка, хватка ракетки, пересування приставними кроками.", "Удари: поштовх, підрізка, накат, контрудар.", "Подачі з нижнім обертанням і їх прийом.", "Правила: гейм до 11 очок, подача переходить кожні 2 очки."], "p": []}, {"h": "Шашки. Індивідуальна творчість та командна взаємодія. Практична гра. Підсумок", "ul": ["Частини партії: дебют, міттельшпіль, ендшпіль.", "Правила бою дамкою, «турецький удар».", "Системи гри на виграш: трикутник Петрова, штик.", "Запис партії нотацією, правила поведінки за дошкою."], "p": []}, {"h": "Волейбол. Навчальна гра «Малюкбол». Підсумок", "ul": ["Стійка волейболіста, способи пересування.", "Прийом і передача м'яча знизу та зверху.", "Нижня пряма й нижня бокова подачі.", "Рухливі ігри й естафети, правила безпеки."], "p": ["Діагностувальну роботу з теми «Настільний теніс, шашки, волейбол» виконують за групами результатів (ГР 1, ГР 2, ГР 3)."]}], "f": "", "pr": ["Склади таблицю з трьох стовпців (настільний теніс, шашки, волейбол) і запиши в кожен по 3 найважливіші речі, які ти вивчив.", "Обери одну вправу з кожного модуля, яку безпечно виконати вдома, і виконай їх (наприклад, імітацію удару, дихальну вправу «4–4», підкидання м'яча)."], "q": ["Які удари в настільному тенісі ти знаєш?", "Назви три частини шашкової партії.", "Чим нижня пряма подача відрізняється від нижньої бокової?", "Що таке трикутник Петрова?"]}]}, {"name": "IV чверть. Дитяча легка атлетика, доджбол, баскетбол 3×3", "lessons": [{"n": "79", "t": "Знайомство з модулями: дитяча легка атлетика, доджбол і баскетбол 3×3", "g": "Дізнатися, що таке дитяча легка атлетика, доджбол і баскетбол 3×3, які ролі виконують гравці та як безпечно займатися на уроках.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Дитяча легка атлетика", "програма для дітей, у якій біг, стрибки й метання подано у формі командних ігор та естафет із легким інвентарем."], ["Доджбол", "командна гра з м'ячем, у якій гравці намагаються влучити м'ячем у суперників і самі ухиляються від кидків."], ["Баскетбол 3×3", "різновид баскетболу, у якому дві команди по троє гравців грають на половині майданчика з одним кошиком."], ["Амплуа", "роль гравця в команді, тобто що саме він найчастіше робить у грі."]], "th": [{"h": "Дитяча легка атлетика. Історія розвитку дитячої легкої атлетики", "p": ["Легка атлетика — один із найдавніших видів спорту: біг, стрибки й метання були ще в змаганнях Стародавньої Греції. Дитяча легка атлетика — це спеціальна програма для школярів, де дорослі дисципліни перетворили на веселі командні завдання з м'якими м'ячами, низькими бар'єрами та дитячими списами.", "Головне тут — не рекорд одного учасника, а результат усієї команди. Кожен бере участь і робить свій внесок."], "ul": ["Займайся у зручному спортивному взутті з зав'язаними шнурками.", "Починай заняття лише після розминки.", "Під час метання стій тільки позаду лінії і не заходь у зону польоту снаряда.", "Біжи лише своєю доріжкою і не перетинай чужу."]}, {"h": "Доджбол. Місце доджболу на сучасному етапі розвитку спорту", "p": ["Доджбол виріс зі шкільної гри «Вибивний», яку знає майже кожен. Сьогодні це окремий вид спорту з офіційними правилами, клубами та змаганнями в багатьох країнах Європи, зокрема і в Україні.", "У доджболі важливі влучність, спритність, швидка реакція та командна гра: треба вміти і кинути, і впіймати, і ухилитися."], "ul": ["Кидати м'яч у голову суперника заборонено.", "Грають лише м'якими м'ячами, призначеними для доджболу.", "Не виходь за межі майданчика і не штовхай інших гравців."]}, {"h": "Баскетбол 3×3. Місце баскетболу 3×3 у сучасному спорті. Амплуа гравців", "p": ["Баскетбол 3×3 — швидка й динамічна гра на один кошик. Вона народилася з вуличного баскетболу, а тепер входить до програми Олімпійських ігор. В Україні в 3×3 грають і на шкільних майданчиках, і на офіційних турнірах.", "У команді троє гравців на майданчику та один запасний. Гравці в 3×3 мають бути універсальними, але найчастіше виділяють такі амплуа:"], "ul": ["Розігрувальний — добре веде м'яч і організовує атаку.", "Снайпер — влучно кидає з-за дуги.", "Центровий — високий гравець, що бореться під кошиком і підбирає м'яч."]}], "f": "Баскетбол 3×3 уперше став олімпійським видом спорту на Іграх у Токіо (вони відбулися 2021 року).", "pr": ["Склади письмово 5 правил безпеки для уроків фізичної культури, які стосуються всіх трьох модулів.", "Намалюй схему майданчика для баскетболу 3×3: один кошик, дуга та лінія штрафного кидка."], "q": ["Чим дитяча легка атлетика відрізняється від «дорослої»?", "З якої шкільної гри виріс доджбол?", "Скільки гравців однієї команди одночасно грають у баскетбол 3×3?", "Які амплуа гравців бувають у баскетболі 3×3?"]}, {"n": "80", "t": "Різновиди легкої атлетики й біг за сигналом. Безпека в доджболі та баскетболі 3×3", "g": "Знати основні види легкої атлетики, правила безпеки й здорового способу життя та розуміти, навіщо в доджболі точні кидки й ловіння.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Сигнал старту", "звук, слово чи жест, після якого учасники починають біг."], ["Час реакції", "проміжок часу від появи сигналу до початку руху."], ["Здоровий спосіб життя", "щоденні звички, що зміцнюють здоров'я: рух, повноцінний сон, корисна їжа та гігієна."], ["Ловіння м'яча", "прийом, під час якого гравець бере м'яч у руки та м'яко гасить його швидкість."]], "th": [{"h": "Дитяча легка атлетика. Різновиди легкої атлетики. Біг за сигналом", "p": ["Легку атлетику ділять на кілька груп: біг (спринт, бар'єрний біг, біг на витривалість, естафети), стрибки (у довжину, у висоту), метання (м'яча, диска, списа) та багатоборство, яке поєднує різні види.", "Біг за сигналом тренує швидкість реакції. Учитель плескає в долоні, свистить або подає команду, а ти маєш якомога швидше рушити з місця."], "ul": ["Стій у стійці: ноги на ширині плечей, коліна злегка зігнуті, вага на передній частині стопи.", "Слухай уважно й не починай рух до сигналу.", "Перші кроки роби короткими й частими, руками активно працюй уздовж тулуба."]}, {"h": "Доджбол. Здоровий спосіб життя. Безпека на майданчику. Значення точних кидків і ловіння", "p": ["Щоб добре грати, потрібно бути здоровим: спати 9–10 годин, пити воду, щодня рухатися та харчуватися різноманітно.", "Точний кидок допомагає команді вибити суперника, а впійманий м'яч — врятувати себе й допомогти партнерові. Тому в доджболі однаково важливо і кидати, і ловити."], "ul": ["Виходь на майданчик тільки після розминки.", "Цілься в тулуб або ноги, ніколи — у голову.", "Якщо впав або вдарився — одразу скажи вчителеві.", "Не грай з прикрасами, годинником чи жуйкою в роті."]}, {"h": "Баскетбол 3×3. Правила безпечної поведінки під час виконання фізичних вправ", "ul": ["Перед грою розімни суглоби, особливо гомілковостопні та пальці рук.", "Не висни на кошику та щиті.", "Під час боротьби за м'яч не штовхайся і не підставляй ногу.", "Стеж, щоб на майданчику не було зайвих м'ячів і речей.", "Пий воду в перервах, а відчувши втому чи біль, зупинись."], "p": []}], "f": "", "pr": ["Склади свій розпорядок дня, у якому є щонайменше 60 хвилин руху, і порівняй його з тим, як ти живеш зараз.", "Попроси когось із рідних подавати сигнал оплеском: на сигнал швидко присідай і вставай (10 разів). Спробуй не реагувати на інші звуки."], "q": ["Назви основні групи видів легкої атлетики.", "Що таке час реакції і як його тренувати?", "Чому в доджболі не можна цілитися в голову?", "Які правила безпеки треба виконувати на баскетбольному майданчику?"]}, {"n": "81", "t": "Біг з різних стартів, метання в ціль. Гнучкість плечей. Вплив вправ на організм", "g": "Навчитися правильно стартувати з різних положень, влучно метати м'яч через перешкоду та розуміти, як фізичні вправи впливають на організм.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Стартове положення", "поза, з якої учасник починає біг, наприклад стоячи, з упору чи сидячи."], ["Перешкода під час метання", "предмет або сітка, через яку м'яч має пролетіти до цілі."], ["Плечовий пояс", "кістки та м'язи, що з'єднують руки з тулубом: ключиці, лопатки й м'язи навколо них."], ["Серцево-судинна система", "серце й судини, що розносять кров по всьому тілу."]], "th": [{"h": "Дитяча легка атлетика. Біг з різних стартових положень. Метання в ціль через перешкоду (тенісний м'яч)", "p": ["Стартувати можна стоячи, з положення сидячи, лежачи, з упору присівши або спиною до напрямку бігу. Такі вправи вчать швидко реагувати й керувати тілом."], "ul": ["Зі старту з будь-якого положення спершу вирівняйся та наберися швидкості за кілька кроків.", "Метаючи тенісний м'яч, стань боком до цілі, ліва нога попереду (для правші).", "Відведи руку з м'ячем назад-угору й кидай над плечем, ніби «хльостаєш».", "Щоб м'яч перелетів перешкоду, випускай його трохи вгору, а не прямо вперед.", "Метай лише за командою, коли в зоні цілі нікого немає."]}, {"h": "Доджбол. Стрибкові вправи. Вправи для гнучкості верхнього плечового пояса", "p": ["Для сильного й точного кидка потрібні рухливі плечі. Гнучкий плечовий пояс дає змогу відвести руку далі назад і кинути без травми."], "ul": ["Кругові оберти прямими руками вперед і назад.", "«Замок» за спиною: одна рука зверху, інша знизу.", "Ривкові рухи руками перед грудьми.", "Стрибки на місці на двох ногах з махами руками."]}, {"h": "Баскетбол 3×3. Особливості впливу різних фізичних вправ на організм людини", "ul": ["Біг і рухливі ігри тренують серце й легені, тобто витривалість.", "Стрибки зміцнюють м'язи ніг і кістки.", "Передачі та кидки розвивають точність рухів і координацію.", "Вправи на розтягування роблять тіло гнучким і захищають від травм.", "Командна гра вчить спілкуватися й підтримувати одне одного."], "p": []}], "f": "Під час бігу серце б'ється значно частіше, ніж у спокої, щоб швидше доставляти м'язам кисень.", "pr": ["Виконай вдома комплекс для плечей: по 10 кругових обертань руками вперед і назад, 5 спроб «замка» за спиною на кожну руку.", "Випиши в таблицю 4 вправи і поясни, яку якість розвиває кожна (витривалість, сила, гнучкість, спритність)."], "q": ["З яких положень можна стартувати під час бігу?", "Як треба кидати тенісний м'яч, щоб він перелетів через перешкоду?", "Навіщо доджболістові гнучкий плечовий пояс?", "Як біг впливає на серцево-судинну систему?"]}, {"n": "82", "t": "Метання диска. Гра «Хто влучніший». Правила й склад команди в баскетболі 3×3", "g": "Знати техніку метання дитячого диска, правила навчальної гри «Хто влучніший» і основні правила баскетболу 3×3: жеребкування, тривалість гри, час на атаку, овертайм, «чек».", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Дитячий диск", "легкий пластиковий або поролоновий диск для безпечного навчального метання."], ["Жеребкування", "спосіб чесно вирішити, яка команда першою отримає м'яч, наприклад підкиданням монети."], ["Час на атаку", "проміжок часу, за який команда повинна виконати кидок по кошику; у баскетболі 3×3 це 12 секунд."], ["Овертайм", "додатковий час, який призначають, коли основний час гри завершився внічию."], ["Чек", "обмін м'ячем між захисником і нападником за дугою перед початком атаки."]], "th": [{"h": "Дитяча легка атлетика. Метання диска. Метання стоячи на колінах", "p": ["Диск тримають кистю зверху: пальці загинаються за край, великий палець лежить на диску. Кидок виконують рухом руки збоку вперед, диск випускають рівно, щоб він летів пласко.", "Метання стоячи на колінах вчить працювати тулубом і рукою без допомоги ніг. Так легше відчути правильний рух плеча."], "ul": ["Перед кидком перевір, що попереду нікого немає.", "Після кидку не біжи за диском, доки вчитель не дозволить.", "Під коліна для метання з колін кладуть м'який мат."]}, {"h": "Доджбол. Стрибкові вправи. Навчальна гра «Хто влучніший»", "p": ["У грі «Хто влучніший» учні по черзі кидають м'яч у ціль (обруч, кеглю, позначку на стіні) з певної відстані. За кожне влучання — очко. Перемагає гравець або команда з більшою кількістю очок."], "ul": ["Кидай тільки за своєю чергою.", "Цілься, дивлячись на ціль, а не на м'яч.", "Після кожного раунду відстань можна збільшувати."]}, {"h": "Баскетбол 3×3. Жеребкування, тривалість гри, час на атаку, овертайм, чек. Склад команди", "ul": ["Команда складається з 4 гравців: 3 на майданчику й 1 запасний.", "Перед грою проводять жеребкування — визначають, хто першим володітиме м'ячем.", "Гра триває 10 хвилин або до 21 очка — що настане раніше.", "На кожну атаку команда має 12 секунд.", "Якщо рахунок нічийний, грають овертайм.", "«Чек» — захисник передає м'яч нападникові за дугою, і атака починається."], "p": []}], "f": "Метання диска було частиною п'ятиборства на стародавніх Олімпійських іграх.", "pr": ["Намалюй, як правильно тримати диск, і підпиши, де лежить кожен палець.", "Склади пам'ятку «Головні правила баскетболу 3×3» з 5 пунктів."], "q": ["Як правильно тримати диск під час метання?", "Як визначають переможця гри «Хто влучніший»?", "Скільки триває гра в баскетбол 3×3 і скільки секунд дають на атаку?", "Що таке «чек» у баскетболі 3×3?"]}, {"n": "83", "t": "Біг з поворотом і по віражу. Вибір місця для кидка в доджболі. Фоли в баскетболі 3×3", "g": "Навчитися пробігати віраж і повороти без втрати швидкості, обирати вдале місце для кидка та знати, які бувають фоли в баскетболі 3×3.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Віраж", "закруглена ділянка бігової доріжки."], ["Командний фол", "кожне персональне порушення гравця, яке зараховують усій команді."], ["Неспортивний фол", "порушення, коли гравець грубо або без спроби зіграти м'ячем діє проти суперника."], ["Дискваліфікаційний фол", "дуже грубе або неспортивне порушення, після якого гравця вилучають з гри."], ["Штрафний кидок", "кидок по кошику з лінії штрафного без перешкод з боку захисників."]], "th": [{"h": "Дитяча легка атлетика. Біг з поворотом. Біг по віражу", "p": ["На віражі тіло прагне «винести» назовні. Щоб утриматися на доріжці, нахиляй тулуб трохи всередину повороту."], "ul": ["Права рука працює ширше й сильніше за ліву.", "Став стопи ближче до внутрішнього краю доріжки.", "Перед поворотом на 180° трохи сповільнися, зроби кілька коротких кроків і відштовхнися зовнішньою ногою.", "Не дивись під ноги — дивись уперед по ходу повороту."]}, {"h": "Доджбол. Вибір місця для виконання кидка", "p": ["Вдалий кидок починається з правильної позиції. Кидати краще ближче до центральної лінії, але не переступаючи її, і тоді, коли суперник відкритий або дивиться в інший бік."], "ul": ["Не стій навпроти кількох суперників з м'ячами одночасно.", "Кидай з того боку, де менше захисників, які можуть упіймати м'яч.", "Домовляйся з партнерами про одночасні кидки в одну ціль."]}, {"h": "Баскетбол 3×3. Порушення правил: командні фоли, неспортивний і дискваліфікаційний фол. Покарання", "ul": ["Фол — це порушення правил через неправильний контакт із суперником: поштовх, захоплення, удар по руках.", "Усі фоли гравців рахуються як командні. Після 6 командних фолів суперник отримує штрафні кидки.", "Неспортивний фол дає суперникові штрафні кидки; за два неспортивні фоли гравця вилучають.", "Дискваліфікаційний фол — гравець одразу залишає гру.", "Чесна гра й повага до суперника важливіші за перемогу."], "p": []}], "f": "Дистанцію 100 метрів пробігають по прямій, а на дистанціях 200 і 400 метрів бігуни обов'язково проходять віражі.", "pr": ["Намалюй бігову доріжку стадіону й познач кольором прямі ділянки та віражі.", "Склади таблицю «Фол — що це — покарання» для трьох видів фолів у баскетболі 3×3."], "q": ["Як потрібно нахиляти тулуб під час бігу по віражу?", "Звідки краще кидати м'яч у доджболі?", "Що відбувається після 6 командних фолів у баскетболі 3×3?", "Чим неспортивний фол відрізняється від дискваліфікаційного?"]}, {"n": "84", "t": "Біг слаломом. Кидки м'яча зверху. Вправи для спритності, гнучкості та сили", "g": "Навчитися оббігати перешкоди «змійкою», виконувати кидок зверху в доджболі та знати вправи для спритності, гнучкості й сили баскетболіста.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Слалом", "біг змійкою між фішками чи стійками, розставленими в лінію."], ["Кидок зверху", "кидок, під час якого рука з м'ячем рухається з-за голови над плечем уперед."], ["Спритність", "уміння швидко й точно змінювати рухи відповідно до ситуації."], ["Фішка", "невеликий пластиковий конус для позначення доріжки або перешкоди."]], "th": [{"h": "Дитяча легка атлетика. Біг з перешкодами (слалом)", "p": ["Під час слалому треба швидко змінювати напрямок, не збиваючи фішки. Це розвиває спритність і координацію."], "ul": ["Біжи короткими кроками і низько тримай центр ваги.", "Біля кожної фішки відштовхуйся зовнішньою ногою.", "Руками допомагай собі втримувати рівновагу.", "Якщо збив фішку — не зупиняйся різко, щоб не зіштовхнутися з іншими."]}, {"h": "Доджбол. Кидки м'яча зверху", "p": ["Кидок зверху — найсильніший і найдальший у доджболі."], "ul": ["Стань боком до цілі, нога, протилежна кидковій руці, — попереду.", "Відведи руку з м'ячем назад за голову, лікоть на рівні плеча.", "Переносячи вагу на передню ногу, розвертай тулуб і кидай рукою вперед.", "Наприкінці кинь кисть униз — це додасть точності.", "Цілься нижче плечей суперника."]}, {"h": "Баскетбол 3×3. Спеціальні вправи для розвитку спритності, гнучкості та сили", "ul": ["Спритність: біг з раптовими змінами напрямку за сигналом, ловіння м'яча після відскоку від підлоги.", "Гнучкість: нахили до ніг, «метелик» сидячи, розтягування м'язів стегна стоячи.", "Сила: присідання, віджимання від лави, «планка» на 20–30 секунд.", "Виконуй силові вправи плавно й без ривків."], "p": []}], "f": "Слово «слалом» прийшло з норвезької мови і спершу означало спуск на лижах між позначками.", "pr": ["Розстав удома в безпечному місці 4–5 пластикових пляшок і повільно пройди між ними змійкою вперед і назад (3 рази).", "Виконай вправу «планка» 3 рази по 20 секунд з відпочинком і запиши, як змінювалося відчуття."], "q": ["Що таке слалом і яку якість він розвиває?", "Опиши кидок м'яча зверху по кроках.", "Назви по одній вправі для спритності, гнучкості та сили.", "Чому силові вправи потрібно виконувати без ривків?"]}, {"n": "85", "t": "Естафети з елементами бігу. Сила рук і ніг. Пересування в нападі в баскетболі 3×3", "g": "Знати правила проведення естафет, вправи для сили рук і ніг та способи пересування нападника з м'ячем і без м'яча.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Естафета", "командне змагання, у якому учасники по черзі пробігають свій етап і передають естафету партнерові."], ["Етап естафети", "частина дистанції, яку пробігає один учасник команди."], ["Ведення м'яча", "пересування з м'ячем, під час якого гравець відбиває його об підлогу однією рукою."], ["Ривок", "різке прискорення з місця або під час руху."]], "th": [{"h": "Дитяча легка атлетика. Естафети з елементами бігу. Вправи на відтворення бігу", "p": ["В естафеті перемагає вся команда разом. Важливо не лише швидко бігти, а й чітко передати естафету: паличку, м'яч або торкання долоні."], "ul": ["Чекай свого етапу за лінією.", "Починай біг лише після передачі естафети.", "Повертайся до команди з правого боку, щоб не зіштовхнутися.", "Вправи на відтворення бігу: імітація роботи рук на місці, біг на місці в повільному та швидкому темпі."]}, {"h": "Доджбол. Спеціальні вправи для розвитку сили верхніх та нижніх кінцівок", "ul": ["Віджимання від стіни або лави — для рук і грудей.", "Кидки м'яча двома руками від грудей у стіну.", "Присідання та випади — для ніг.", "Підйоми на носки — для литкових м'язів.", "Між підходами відпочивай і стеж за диханням."], "p": []}, {"h": "Баскетбол 3×3. Естафети. Способи пересування в нападі (з м'ячем і без м'яча)", "p": ["Нападник без м'яча постійно рухається, щоб звільнитися від захисника й отримати передачу. Нападник з м'ячем веде його, не дивлячись на руку."], "ul": ["Без м'яча: біг, ривки, зупинки, зміна напрямку.", "З м'ячем: ведення правою та лівою рукою, ведення зі зміною швидкості.", "Не можна робити більше двох кроків з м'ячем у руках без ведення — це пробіжка.", "В естафетах з веденням тримай м'яч близько до себе."]}], "f": "", "pr": ["Склади правила для своєї естафети з трьох етапів, яку можна провести на шкільному подвір'ї.", "Виконай комплекс: 10 віджимань від стіни, 10 присідань, 15 підйомів на носки (2 кола)."], "q": ["Що таке етап естафети?", "Як правильно поводитися учасникам естафети, які чекають своєї черги?", "Які вправи розвивають силу ніг?", "Як пересувається нападник без м'яча і навіщо?"]}, {"n": "86", "t": "Біг на витривалість. Вибір місця для кидка в русі. Пересування в захисті в баскетболі 3×3", "g": "Розуміти, як рівномірно бігти тривалий час, як обирати момент і місце для кидка в доджболі та як пересуватися в захисті.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Рівномірний біг", "біг з однаковою швидкістю протягом усієї дистанції."], ["Пульс", "поштовхи крові в судинах, за якими рахують частоту серцевих скорочень."], ["Захисна стійка", "положення захисника: ноги зігнуті, ширше за плечі, руки розведені, погляд на суперника."], ["Приставний крок", "пересування боком, коли одна нога ставиться до іншої без схрещування."]], "th": [{"h": "Дитяча легка атлетика. Біг на в
