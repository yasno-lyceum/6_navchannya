зу вгору-вперед, а м'яч летить по дузі."], ["Кидок з двох кроків", "кидок по кошику в русі після двох кроків з м'ячем у руках."], ["Пробіжка", "порушення правил, коли гравець робить з м'ячем у руках більше кроків, ніж дозволено."], ["Кидок двома руками від голови", "кидок, коли м'яч тримають обома руками над головою і посилають уперед-угору."]], "th": [{"h": "Дитяча легка атлетика. Стрибки вперед, назад, праворуч, ліворуч", "ul": ["Ноги разом, коліна злегка зігнуті, руки на поясі.", "Стрибай за порядком: уперед — назад — праворуч — ліворуч.", "Стрибки невисокі й часті, на передній частині стопи.", "Можна позначити на підлозі хрест і стрибати по його квадратах."], "p": []}, {"h": "Доджбол. Кидки м'яча знизу після переміщення", "p": ["Кидок знизу менш сильний, ніж зверху, зате дуже точний. Його зручно виконувати, коли ти швидко підбіг до лінії й хочеш влучити в ноги суперника."], "ul": ["Зроби кілька кроків до центральної лінії.", "Відведи руку з м'ячем назад-униз.", "Махом руки вперед випусти м'яч на рівні стегна.", "Після кидка одразу відступи назад."]}, {"h": "Баскетбол 3×3. Кидки двома руками від голови та в русі (з двох кроків)", "ul": ["Від голови: м'яч обома руками над головою, лікті вперед, кидок розгинанням рук і кистей.", "З двох кроків: упіймав м'яч на ходу — перший крок довгий, другий короткий, і відштовхуйся вгору.", "Кидай м'яч на найвищій точці стрибка, бажано з відскоком від щита.", "Якщо зробиш третій крок з м'ячем у руках — це пробіжка."], "p": []}], "f": "", "pr": ["Наклей на підлозі (за дозволу дорослих) хрест зі скотчу й виконай по 3 серії стрибків уперед — назад — праворуч — ліворуч.", "Без м'яча 10 разів повільно пройди «два кроки» з імітацією кидка: «довгий — короткий — угору»."], "q": ["Як правильно виконувати стрибки в різних напрямках?", "Коли зручно використовувати кидок знизу в доджболі?", "Опиши кидок з двох кроків.", "Що таке пробіжка?"]}, {"n": "93", "t": "Швидкісна драбина, вибір місця для кидка, подвійний крок і ведення м'яча", "g": "Учень дізнається, як виконувати стрибки на швидкісній драбині, як обрати вдале місце для кидка в доджболі та як виконується подвійний крок у баскетболі 3×3.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Швидкісна драбина", "плоска драбинка з ременів або пластин, яку кладуть на підлогу для вправ на швидкість і точність кроків."], ["Частота кроків", "кількість кроків або стрибків, які спортсмен робить за певний час."], ["Подвійний крок", "кидок у кошик після двох кроків із м'ячем у руках, який виконують у русі."], ["Почергове ведення", "ведення м'яча то правою, то лівою рукою, щоб захисникові було складніше його відібрати."]], "th": [{"h": "Дитяча легка атлетика. Стрибки на «швидкісній драбині»", "p": ["Швидкісна драбина розвиває швидкість ніг, координацію та увагу. Головне — не швидкість будь-якою ціною, а точність: ступні потрапляють у клітинки й не наступають на перекладини."], "ul": ["Стрибки двома ногами в кожну клітинку.", "Стрибки на одній нозі (по черзі правою і лівою).", "«Ноги нарізно — ноги разом» уздовж драбини.", "Стрибки боком, приставляючи ноги.", "Приземляйся м'яко на передню частину стопи, руки допомагають рухом."]}, {"h": "Доджбол. Вибір місця для кидка", "p": ["Влучний кидок починається з правильного місця. Гравець має бачити ціль, стояти стійко й не заступати за лінію свого поля."], "ul": ["Обирай місце, звідки ціль найближча і її не закривають інші гравці.", "Не стій у куті майданчика — звідти важко відступити.", "Перед кидком переконайся, що поруч немає партнера, якого можна зачепити рукою.", "Після кидка одразу повертайся в стійку, щоб не стати легкою ціллю."]}, {"h": "Баскетбол 3×3. Подвійний крок, ведення м'яча з передачею", "p": ["Подвійний крок виконують так: після ведення гравець ловить м'яч, робить широкий перший крок, короткий другий і відштовхується вгору, кидаючи м'яч у кошик однією рукою."], "ul": ["Праворуч від кошика: крок правою — крок лівою — стрибок, кидок правою рукою.", "Під час ведення дивись уперед, а не на м'яч.", "Веди м'яч подушечками пальців, а не долонею.", "У колонах, парах і трійках після ведення роби точну передачу партнерові."]}], "f": "Вправи на швидкісній драбині використовують у тренуваннях багатьох видів спорту — від футболу до тенісу, бо вони вчать ставити ногу швидко й точно.", "pr": ["Намалюй на аркуші схему швидкісної драбини (6–8 клітинок) і познач стрілками два різні варіанти стрибків.", "Без м'яча повільно імітуй подвійний крок: «крок правою — крок лівою — рух рукою вгору». Повтори 8–10 разів."], "q": ["Для чого потрібна швидкісна драбина?", "Як правильно приземлятися під час стрибків на драбині?", "Як обрати вдале місце для кидка в доджболі?", "Яка послідовність кроків у подвійному кроці праворуч від кошика?"]}, {"n": "94", "t": "Стрибки через довгу скакалку, ігри «М'яч ведучому» і «Вибивний», передача від плеча", "g": "Учень знатиме, як безпечно стрибати через довгу скакалку, правила ігор «М'яч ведучому» і «Вибивний» та техніку передачі м'яча однією рукою від плеча.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Довга скакалка", "скакалка, яку обертають двоє учнів, а третій стрибає через неї."], ["Вхід під скакалку", "момент, коли стрибун забігає під скакалку саме тоді, коли вона проходить угорі."], ["Вибивний", "рухлива гра, у якій гравці однієї команди намагаються влучити м'ячем у гравців іншої команди."], ["Передача від плеча", "передача м'яча однією рукою, яку виконують розгином руки від плеча в бік партнера."]], "th": [{"h": "Дитяча легка атлетика. Стрибки через довгу скакалку", "ul": ["Скакалку обертають двоє, рівномірно й не дуже швидко.", "Заходь під скакалку, коли вона щойно пройшла перед тобою вниз і піднімається вгору.", "Стрибай невисоко, на передній частині стопи, руки трохи зігнуті.", "Виходь у той бік, куди обертається скакалка.", "Не тримай скакалку навколо руки — тільки в долоні."], "p": []}, {"h": "Доджбол. Рухливі ігри «М'яч ведучому» та «Вибивний»", "p": ["«М'яч ведучому»: гравці стоять колом або колонами, ведучий передає м'яч кожному по черзі, а той повертає його назад. Виграє команда, яка першою без помилок закінчить передачі.", "«Вибивний»: дві команди, у кожної своя половина поля. Гравці кидають м'яч, намагаючись влучити в суперника; той, у кого влучили, виходить із гри. Якщо м'яч спіймали — вибуває той, хто кидав. Кидати можна лише м'яким м'ячем і не в голову."], "ul": []}, {"h": "Баскетбол 3×3. Ловіння і передача однією рукою від плеча", "ul": ["Тримай м'яч біля плеча, долоня позаду м'яча, лікоть спрямований уперед-униз.", "Зроби крок уперед ногою, протилежною до руки, що передає.", "Розгинай руку й завершуй рух кистю, пальці «проводжають» м'яч.", "Партнер ловить м'яч двома руками, витягнутими назустріч, і м'яко гасить швидкість."], "p": []}], "f": "", "pr": ["Напиши правила гри «Вибивний» своїми словами (5–6 речень) і придумай одне додаткове правило, щоб гра була безпечнішою.", "Стоячи на місці, без м'яча відпрацюй рух передачі від плеча правою і лівою рукою — по 10 разів."], "q": ["Коли треба забігати під довгу скакалку?", "Як проводиться гра «М'яч ведучому»?", "Хто вибуває з гри «Вибивний», якщо м'яч спіймали?", "Як рухаються рука й кисть під час передачі від плеча?"]}, {"n": "95", "t": "Бігові вправи, сила кистей у доджболі, швидкість і витривалість у баскетболі 3×3", "g": "Учень дізнається, як правильно виконувати спеціальні бігові вправи, вправи для кистей рук і чому баскетболістові потрібні швидкість і витривалість.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Біг із високим підніманням стегна", "бігова вправа, у якій коліно на кожному кроці піднімається приблизно до рівня пояса."], ["Біг із захлестом гомілки", "бігова вправа, під час якої п'ятка на кожному кроці торкається або майже торкається сідниць."], ["Багатоскоки", "серія стрибків із ноги на ногу з просуванням уперед."], ["Витривалість", "здатність довго виконувати роботу без помітної втоми."]], "th": [{"h": "Дитяча легка атлетика. Біг із високим підніманням стегна, із захлестом гомілки, багатоскоки", "p": ["Ці вправи називають спеціальними біговими. Вони зміцнюють м'язи ніг і вчать правильно ставити стопу під час бігу."], "ul": ["Тулуб тримай рівно, не відхиляйся назад.", "Руки зігнуті в ліктях і рухаються вперед-назад.", "Став ногу на передню частину стопи.", "Багатоскоки виконуй на м'якому покритті, спочатку невеликими стрибками."]}, {"h": "Доджбол. Вправи для розвитку сили м'язів кистей рук", "p": ["Сильні кисті допомагають міцно ловити м'яч і точно кидати його. Вправи прості, їх можна виконувати навіть сидячи."], "ul": ["Стискання м'якого м'ячика або еспандера.", "Обертання кистями в обидва боки.", "«Пальчики-павучки»: поставити подушечки пальців на стіл і натискати.", "Згинання та розгинання кистей із витягнутими вперед руками."]}, {"h": "Баскетбол 3×3. Спеціальні вправи для розвитку швидкості та витривалості", "p": ["У баскетболі 3×3 на атаку дається лише 12 секунд, тому гра дуже швидка, а заміни гравців відбуваються часто. Гравцеві потрібні і швидкий старт, і вміння не втомлюватися."], "ul": ["Прискорення на короткі відрізки за сигналом.", "Човниковий біг між двома лініями.", "Ведення м'яча з прискоренням.", "Рівномірний біг у повільному темпі для витривалості."]}], "f": "Бігові вправи «високе стегно» і «захлест» виконують на розминці не лише легкоатлети, а й футболісти, баскетболісти та тенісисти.", "pr": ["Виконай вправи для кистей: 15 стискань м'якого м'ячика кожною рукою та 10 обертань кистями в кожен бік.", "Склади таблицю «Вправа — для чого вона потрібна» для трьох бігових вправ, про які дізнався на уроці."], "q": ["Чим відрізняються біг із високим підніманням стегна і біг із захлестом гомілки?", "Що таке багатоскоки?", "Навіщо гравцеві в доджбол сильні кисті рук?", "Скільки секунд дається на атаку в баскетболі 3×3?"]}, {"n": "96", "t": "Ігри на комунікацію, кидки після ловіння, штрафний кидок і фінти в баскетболі 3×3", "g": "Учень дізнається, навіщо потрібні ігри на спілкування, як швидко бо вирізки.", "Покажи, які м'язи і якості розвиває гра."]}, {"h": "Баскетбол 3×3. Перехоплення м'яча під час передачі", "ul": ["Стеж одночасно за суперником із м'ячем і за тим, кому він може передати.", "Стій трохи збоку від свого суперника, ближче до лінії можливої передачі.", "Рушай до м'яча вчасно, але не штовхай суперника — це фол.", "Після перехоплення одразу думай про атаку."], "p": []}], "f": "", "pr": ["Створи плакат або колаж «Як доджбол впливає на організм людини» (формат А4).", "Виконай 3 серії по 10 повільних кроків-схрещувань на місці (права нога перед лівою, потім ліва перед правою), не стрибаючи."], "q": ["Як виконуються перехресні стрибки?", "Яких правил безпеки треба дотримуватися під час метання дитячого спису?", "Які якості розвиває доджбол?", "Як захисник може перехопити передачу, не порушуючи правил?"]}, {"n": "99", "t": "Метання вортекса, ігри й квести з доджболу, техніка нападу і захисту в баскетболі 3×3", "g": "Учень дізнається, що таке вортекс і як його метати, познайомиться з ігровими квестами з доджболу та прийомами нападу й захисту у взаємодії з партнерами.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Вортекс", "м'який снаряд для дитячої легкої атлетики з корпусом у формі ракети та хвостовим оперенням."], ["Квест", "гра-пригода, у якій учасники виконують послідовність завдань, щоб досягти спільної мети."], ["Напад", "дії команди, яка володіє м'ячем і намагається закинути його в кошик."], ["Захист", "дії команди без м'яча, спрямовані на те, щоб завадити суперникові набрати очки."]], "th": [{"h": "Дитяча легка атлетика. Метання вортекса", "ul": ["Тримай вортекс за задню частину, ближче до оперення.", "Стань боком до напрямку метання, ліва нога попереду (для правші).", "Відведи руку назад і метни вперед-угору через плече.", "Метай лише за командою, у бік, де нікого немає."], "p": []}, {"h": "Доджбол. Ігри, розваги та квести з елементами доджболу", "p": ["Квест складається з кількох станцій. На кожній команда наряд.", "Обручі, кільця та інший легкий інвентар метай тільки в позначену зону.", "Перед кидком переконайся, що в зоні метання нікого немає."], "p": []}, {"h": "Доджбол. Навчальні ігри «Мисливець і звірі» та «Вибивний»", "p": ["«Мисливець і звірі»: один або кілька «мисливців» мають м'який м'яч, решта — «звірі», які бігають у межах майданчика. Мисливець намагається влучити м'ячем у звіра нижче плечей. Той, у кого влучили, стає помічником мисливця. Гра закінчується, коли всіх «упіймано».", "«Вибивний» ти вже знаєш: пригадай його правила й порівняй з цією грою."], "ul": []}, {"h": "Баскетбол 3×3. Протидія нападаючому гравцю з м'ячем", "ul": ["Стій між суперником і кошиком.", "Тримай захисну стійку, переміщуйся приставними кроками, не схрещуючи ноги.", "Одна рука заважає передачі, інша — кидку.", "Не тягни і не штовхай суперника — це порушення правил."], "p": []}], "f": "", "pr": ["Порівняй ігри «Мисливець і звірі» та «Вибивний»: запиши 2 спільні риси й 2 відмінності.", "Прийми захисну стійку і зроби 10 приставних кроків праворуч і 10 ліворуч, не схрещуючи ноги."], "q": ["Для чого виконують поворот перед метанням?", "Як проводиться гра «Мисливець і звірі»?", "Де має стояти захисник відносно суперника й кошика?", "Як правильно переміщуватися в захисній стійці?"]}, {"n": "101", "t": "Естафета «Формула-1», квести з доджболу, командна взаємодія в баскетболі 3×3", "g": "Учень дізнається, що таке естафета «Формула-1» і вправи із заданим ритмом, як грати в доджбол-квести та чому командна взаємодія — основа баскетболу 3×3.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Формула-1", "командна естафета дитячої легкої атлетики, яка поєднує біг, бар'єри, слалом і інші завдання на одній дистанції."], ["Ритм", "рівномірне повторення рухів або кроків через однакові проміжки часу."], ["Слалом", "біг змійкою між позначками або стійками."], ["Командна взаємодія", "узгоджені дії гравців однієї команди для досягнення спільної мети."]], "th": [{"h": "Дитяча легка атлетика. Вправи із заданим ритмом: дистанція «Формула-1»", "p": ["У «Формулі-1» кожен учасник команди долає частину дистанції з різними завданнями і передає естафету наступному. Важливо тримати ритм: однакову кількість кроків між перешкодами."], "ul": ["Біг із прискоренням.", "Перебігання через низькі бар'єри в заданому ритмі.", "Біг слаломом між стійками.", "Передача естафети торканням долоні."]}, {"h": "Доджбол. Ігри, розваги та квести з елементами доджболу", "ul": ["«Влучи в обруч»: кидки м'яча в обручі, що лежать на підлозі.", "«Спіймай і передай»: ланцюжок ловінь без падіння м'яча.", "«Ухилися»: ухилення від м'якого м'яча, який котять по підлозі.", "Кожна станція — новий бал для команди."], "p": []}, {"h": "Баскетбол 3×3. Командна взаємодія. Естафети", "p": ["У команді 3×3 лише троє гравців на майданчику, тому кожен і нападає, і захищається. Перемагає не той, хто найкраще веде м'яч, а та команда, яка діє разом."], "ul": ["Естафета з веденням і передачею м'яча партнеру.", "Естафета «Передай і біжи».", "Підтримуй партнерів, хвали за вдалі дії."]}], "f": "", "pr": ["Намалюй схему власної естафети «Формула-1» з 4 етапами і підпиши, що треба робити на кожному.", "Під рахунок «раз-два-три-чотири» поплескай у долоні в рівному ритмі 1 хвилину, потім кроком на місці під той самий ритм."], "q": ["Що таке естафета «Формула-1»?", "Чому важливо тримати ритм між перешкодами?", "Наведи приклад станції для квесту з доджболу.", "Чому командна взаємодія особливо важлива в баскетболі 3×3?"]}, {"n": "102", "t": "Вправи на витривалість, кидки й навчальна гра в доджбол, взаємодія в грі 3×3", "g": "Учень дізнається, як розвивати витривалість, повторить кидки м'яча й правила навчальної гри в доджбол та взаємодію з партнерами в баскетболі 3×3.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Рівномірний біг", "біг з однаковою швидкістю протягом усієї дистанції."], ["Пульс", "поштовхи крові в судинах, за якими можна визначити, як часто б'ється серце."], ["Навчальна гра", "гра за спрощеними правилами, під час якої учні відпрацьовують вивчені прийоми."], ["Передача в русі", "передача м'яча партнеру, яку виконують під час бігу."]], "th": [{"h": "Дитяча легка атлетика. Вправи на витривалість", "ul": ["Біг у повільному, рівному темпі, під час якого можна говорити.", "Чергування бігу і ходьби.", "Дихай рівно: вдих носом, видих ротом.", "Після навантаження поступово перейди на ходьбу, не сідай одразу.", "Якщо паморочиться в голові або болить у боці — зупинись і скажи вчителю."], "p": []}, {"h": "Доджбол. Кидки м'яча. Навчальна гра", "p": ["У навчальній грі дві команди грають на своїх половинах майданчика. Кидають м'який м'яч, цілячись нижче плечей. Гравець, у якого влучили, переходить у зону вибулих; якщо м'яч спіймано — вибуває той, хто кидав. Заступати за центральну лінію не можна."], "ul": []}, {"h": "Баскетбол 3×3. Рухливі ігри та естафети. Взаємодія з партнерами", "ul": ["Рухлива гра «10 передач»: команда має зробити 10 передач поспіль, а суперники — перехопити м'яч.", "Естафета з веденням м'яча правою і лівою рукою.", "Під час гри дивись не лише на м'яч, а й на партнерів.", "Передавай тому, хто відкритий."], "p": []}], "f": "Пульс найлегше знайти на зап'ясті з боку великого пальця або на шиї збоку.", "pr": ["Порахуй свій пульс у спокої за 15 секунд і помнож на 4. Потім зроби 20 спокійних кроків на місці й порахуй знову. Запиши обидва результати.", "Запиши 3 правила безпеки під час навчальної гри в доджбол."], "q": ["Що таке рівномірний біг?", "Як дихати під час бігу на витривалість?", "Як проводиться навчальна гра в доджбол?", "Які правила гри «10 передач»?"]}, {"n": "103", "t": "Стрибки в різних напрямках, поєднання навичок доджболу, тактика баскетболу 3×3", "g": "Учень повторить стрибки в різних напрямках, поєднає вивчені навички доджболу та познайомиться з простими тактичними взаємодіями в баскетболі 3×3.", "k": "Модулі: Дитяча легка атлетика · Доджбол · Баскетбол 3×3", "terms": [["Координація", "здатність узгод function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

  const P = document.getElementById("pager"); P.innerHTML = "";
  [[pv, "← Попередній"], [nx, "Наступний →"]].forEach(([x, lab]) => { if (!x) return;
    const b = document.createElement("button"); b.innerHTML = esc(lab) + "<b>" + esc(x.t) + "</b>"; b.onclick = () => open(x.id); P.appendChild(b); });
}

function renderQuiz(l){
  const Q = makeQuiz(l), box = document.getElementById("quiz");
  const prev = results[l.id];
  let h = '<div class="qhead"><h2>Тест · 5 завдань</h2><p>' + (prev ? "Найкращий результат: " + prev + " з 5" : "Оберіть одну відповідь у кожному завданні") + "</p></div><form id=\"qf\">";
  Q.forEach((q, i) => {
    h += '<div class="q"><div class="qt"><span>' + (i + 1) + ".</span><div>" + esc(q.q) + (q.sub ? "<br><em>" + esc(q.sub) + "</em>" : "") + '</div></div><div class="opts">';
    q.opts.forEach(([t], j) => h += '<label class="opt"><input type="radio" name="q' + i + '" id="q' + i + "o" + j + '" value="' + j + '"><span>' + esc(t) + "</span></label>");
    h += "</div></div>";
  });
  h += '<div class="qfoot"><button class="btn" type="submit" id="chk" disabled>Перевірити</button><button class="btn ghost" type="button" id="again">Інші питання</button><span class="score" id="sc" aria-live="polite"></span></div></form>';
  box.innerHTML = h;
  const f = document.getElementById("qf"), chk = document.getElementById("chk");
  f.addEventListener("change", () => { chk.disabled = Q.some((_, i) => !f["q" + i] || ![...f.querySelectorAll('[name="q' + i + '"]')].some(x => x.checked)); });
  document.getElementById("again").onclick = () => renderQuiz(l);
  f.addEventListener("submit", e => {
    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Результат: " + ok + " з 5. " + (ok === 5 ? "Чудово!" : ok >= 4 ? "Добре засвоєно." : ok >= 3 ? "Повторіть ключові поняття." : "Перечитайте конспект і спробуйте ще раз.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
