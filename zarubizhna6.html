<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зарубіжна література · 6 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>

{t:"Специфіка художньої літератури як виду мистецтва, її подібність і відмінність від інших видів мистецтва", c:"УВ", pages:"с. 7–15",
info:`<p><b>Мистецтво</b> — це творче відображення дійсності в художніх образах. Існують різні види мистецтва: музика (мова звуків), живопис (лінії та барви), скульптура (об'ємна форма), архітектура, театр, кіно, хореографія і <b>література</b>.</p>
<p><b>Художня література</b> — вид мистецтва, у якому образи створюються за допомогою <b>слова</b>. Тому її називають «мистецтвом слова».</p>
<p><b>Чим література подібна до інших мистецтв:</b> вона так само творить образи, викликає почуття, виражає погляди митця на світ, має естетичну цінність.</p>
<p><b>Чим відрізняється:</b> слово дає змогу зобразити все — і зовнішність, і думки, і почуття, і плин часу. Читач сам «домальовує» картину уявою, тому кожен бачить героя по-своєму. Живопис і скульптура показують одну мить, а література — розвиток подій.</p>
<p>Література тісно пов'язана з іншими мистецтвами: за творами знімають фільми, ставлять вистави, пишуть музику, малюють ілюстрації.</p>`,

{t:"Художній образ, особливості його сприйняття", c:"УВ", pages:"с. 11–15", content:"Конспект",
info:`<p><b>Художній образ</b> — це узагальнена картина життя, створена уявою митця. Образом може бути людина (персонаж), тварина, природа, предмет, подія.</p>
<p>Образ <b>поєднує реальне і вигадане</b>: письменник бере риси з життя, але творчо їх переосмислює. Тому образ водночас конкретний (має ім'я, зовнішність, характер) і узагальнений (у ньому впізнаються риси багатьох людей).</p>
<p><b>Види образів:</b> образи-персонажі (герої), образи природи (пейзаж), образи предметів (інтер'єр, деталі), образ автора, образи-символи.</p>
<p><b>Як сприймати образ:</b> уважно стежити за портретом, вчинками, мовленням героя, ставленням до нього інших персонажів і автора; уявляти прочитане; порівнювати з власним досвідом. Сприйняття образу — це співтворчість читача й автора.</p>`,

info:`<p><b>Міф</b> (грец. <i>mythos</i> — слово, переказ) — давня розповідь про богів, героїв, створення світу та явища природи. Давні люди <b>вірили</b> в міфи як у правду: так вони пояснювали, звідки взялися світ, люди, грім, зміна пір року.</p>

{t:"Грецькі міфи", c:"ПТ", pages:"с. 18–27",
info:`<p>Давньогрецька міфологія — одна з найбагатших у світі. Греки уявляли, що на горі <b>Олімп</b> живуть дванадцять головних богів на чолі із <b>Зевсом</b>.</p>
<ul><li><b>Зевс</b> — верховний бог, володар грому і блискавки;</li><li><b>Гера</b> — дружина Зевса, покровителька шлюбу;</li><li><b>Посейдон</b> — бог морів;</li><li><b>Аїд</b> — володар підземного царства мертвих;</li><li><b>Афіна</b> — богиня мудрості й справедливої війни;</li><li><b>Аполлон</b> — бог світла й мистецтв; <b>Артеміда</b> — богиня полювання;</li><li><b>Гефест</b> — бог ковальства й вогню; <b>Гермес</b> — вісник богів.</li></ul>
<p>До олімпійських богів світом правили <b>титани</b> — старше покоління богів. Окрім богів, у міфах діють <b>герої</b> — напівбоги, діти богів і смертних (Геракл, Персей, Тесей).</p>
<p>Грецькі міфи дійшли до нас у переказах поетів (Гомер, Гесіод, Овідій), а в Україні їх для дітей переказали Катерина Гловацька та інші.</p>`,
terms:[["Олімп","гора, на якій, за уявленнями греків, жили боги"],["Титани","старше покоління богів, діти Урана і Геї"],["Герой","у міфах — напівбог, син бога і смертної людини"]],

{t:"Велич подвигу Прометея, його самопожертва заради людей", c:"ПТ", pages:"с. 23–28", content:"Презентація",
info:`<p><b>Прометей</b> — титан, син титана Япета, один із небагатьох старших богів, хто в битві богів і титанів став на бік Зевса. За однією з версій міфу, саме Прометей виліпив перших людей із глини й вдихнув у них життя, тож почувався не спостерігачем людської долі, а її творцем і заступником.</p>
<p>Зевс, побоюючись, що надто розвинені люди стануть незалежними від богів, тримав їх у темряві, без вогню. Прометей викрав іскру й приніс її людям. Вогонь у міфі — це не лише тепло і світло: Прометей навчив людей ремесел, будівництва, лічби, медицини, мореплавства. Тому його подвиг — це подвиг <b>просвітництва</b>.</p>
<p>Покарання: Гефест за наказом Зевса прикував Прометея до скелі Кавказу; орел щодня видзьобував йому печінку, яка щоночі відростала знову. Прометей знав про покарання заздалегідь і все одно зробив свій вибір. Справжня жертва — це готовність нести наслідки, не шкодуючи про зроблене. Згодом Прометея визволив Геракл.</p>
<p>Ідея самопожертви заради інших — універсальна: лікарі, рятувальники, вчені свідомо ризикують заради людей. Образ Прометея надихав українських письменників: Т. Шевченка (поема «Кавказ»), І. Франка, Лесю Українку, Ліну Костенко.</p>`,

{t:"Міфи про Геракла", c:"ПТ", pages:"с. 29–33",
info:`<p><b>Геракл</b> (у римлян — Геркулес) — наймогутніший герой грецьких міфів, син Зевса і смертної Алкмени. Через підступ Гери, яка його ненавиділа, він мусив дванадцять років служити цареві <b>Еврисфею</b> і виконати дванадцять неможливих завдань.</p>
<ol class="cols"><li><b>Немейський лев</b> — задушив руками, шкуру носив як обладунок.</li><li><b>Лернейська гідра</b> — з Іолаєм припікав шиї вогнем.</li><li><b>Керінейська лань</b> — рік переслідував і впіймав живою.</li><li><b>Ериманфський вепр</b> — загнав у сніг і приніс живим.</li><li><b>Авгієві стайні</b> — очистив за день, змінивши русла двох річок.</li><li><b>Стимфалійські птахи</b> — сполохав брязкальцями Афіни й перестріляв.</li><li><b>Критський бик</b> — приборкав руками.</li><li><b>Коні Діомеда</b> — приборкав коней-людожерів.</li><li><b>Пояс Іпполіти</b> — здобув пояс цариці амазонок.</li><li><b>Корови Геріона</b> — поставив «Гераклові стовпи» (Гібралтар).</li><li><b>Яблука Гесперид</b> — тримав небо замість Атланта.</li><li><b>Цербер</b> — привів із царства Аїду триголового пса.</li></ol>
<p>Усі подвиги об'єднує одне: Геракл перемагає не лише силою, а поєднанням <b>сили, кмітливості й витримки</b>. Його образ — символ героя, який не здається.</p>`,
terms:[["Подвиг","героїчний вчинок, що потребує мужності й самовідданості"],["Авгієві стайні","страшний безлад, занедбана справа"]],

{t:"Міф про Дедала і Ікара", c:"ПТ", pages:"с. 35–41",
info:`<p><b>Дедал</b> — славетний афінський митець, архітектор і винахідник. Через заздрість до учня (свого небожа) він скоїв злочин і мусив тікати на Крит до царя <b>Міноса</b>. Там Дедал збудував <b>Лабіринт</b> для чудовиська Мінотавра.</p>
<p>Мінос не хотів відпускати майстра. Тоді Дедал змайстрував крила з пір'я, скріпленого воском і нитками, для себе і сина <b>Ікара</b>. Батько застерігав: не підлітай близько до сонця, бо віск розтане, і не опускайся до моря, бо пір'я намокне.</p>
<p>Захоплений польотом, Ікар забув пораду й злетів високо. Сонце розтопило віск, і юнак упав у море (його називають Ікарійським). Дедал поховав сина й гірко шкодував про свій винахід.</p>
<p><b>Проблеми міфу:</b> батьки й діти, сміливість і нерозважливість, мрія про політ, відповідальність митця за свій витвір. Ікар став символом людського прагнення до неба й високої мрії, а Дедал — символом творчого генія.</p>`,
terms:[["Лабіринт","заплутана споруда з безліччю ходів; у переносному значенні — складна ситуація"],["Ікарів політ","смілива, але нерозважлива спроба досягти високої мети"]],
q:[["Ким був Дедал?",["Царем Криту","Митцем і винахідником","Богом","Воїном"],1],
["Що збудував Дедал на Криті?",["Храм","Лабіринт","Корабель","Міст"],1],
["Із чого Дедал зробив крила?",["З дерева й заліза","З пір'я, воску й ниток","З тканини","Із золота"],1],
["Чому загинув Ікар?",["Підлетів занадто близько до сонця","Його збив Мінос","Злякався грози","Крила зламав вітер"],0],
["Ікар став символом…",["зради","скупості","сміливої мрії й нерозважливості","хитрощів"],2]]},

{t:"ПЧ № 1 «Орфей і Еврідіка». Зображення сили кохання у грецьких міфах", c:"УВ", content:"Презентація «Орфей та Еврідіка» (до прочитання)",
info:`<p><b>Орфей</b> — легендарний співець із Фракії, син музи Калліопи. Його спів і гра на лірі зачаровували людей, звірів, навіть дерева й каміння.</p>
<p>Дружина Орфея, німфа <b>Еврідіка</b>, загинула від укусу змії. Невтішний Орфей спустився в підземне царство <b>Аїду</b>. Його спів зворушив навіть володарів царства мертвих — Аїда та Персефону. Вони дозволили Еврідіці повернутися на землю з умовою: Орфей не повинен озиратися, доки не вийде на світло.</p>
<p>Уже біля виходу Орфей не витримав і озирнувся — і Еврідіка навіки зникла в темряві.</p>
<p><b>Ідеї міфу:</b> кохання сильніше за смерть; мистецтво має чарівну силу; людині важко довіряти й чекати. Міф надихнув численних поетів, художників, композиторів (опери К. В. Глюка, К. Монтеверді).</p>`,
terms:[["Позакласне читання (ПЧ)","урок обговорення твору, прочитаного самостійно"],["Ліра","давньогрецький струнний музичний інструмент"]],

["Чому Орфей утратив Еврідіку вдруге?",["Забув дорогу","Озирнувся","Його не пустив Цербер","Він заснув"],1],

{t:"УРМ № 1 (у) Крилаті вислови грецької міфології", c:"ПТ", content:"Що таке крилатий вислів? Презентація",
info:`<p><b>Крилаті вислови</b> — образні стійкі словосполучення, що прийшли в мову з певного джерела й «облетіли світ», зберігши зв'язок із першоджерелом. Багато таких висловів народилося з грецьких міфів.</p>
<ul>
<li><b>Авгієві стайні</b> — страшний безлад, занедбана справа.</li>
<li><b>Ахіллесова п'ята</b> — вразливе, слабке місце.</li>
<li><b>Яблуко розбрату</b> — причина сварки.</li>
<li><b>Нитка Аріадни</b> — те, що допомагає знайти вихід зі складної ситуації.</li>
<li><b>Скринька Пандори</b> — джерело нещасть.</li>
<li><b>Танталові муки</b> — страждання від неможливості досягти бажаного, яке зовсім поруч.</li>
<li><b>Сізіфова праця</b> — важка, безрезультатна робота.</li>
<li><b>Прометеїв вогонь</b> — прагнення до високої мети, служіння людям.</li>
<li><b>Між Сціллою і Харибдою</b> — між двома небезпеками.</li>
<li><b>Дамоклів меч</b> — постійна загроза.</li>
<li><b>Троянський кінь</b> — підступний дарунок.</li>
</ul>
<p><b>Завдання (усно):</b> складіть 3–4 речення про шкільне життя, використавши крилаті вислови.</p>`,
terms:[["Крилатий вислів","стійкий образний зворот із відомого джерела (міфу, книги, промови)"],["Фразеологізм","стійке сполучення слів із цілісним значенням"]],

{t:"УРМ № 2 (п) Твір «Мій улюблений міфологічний герой»", c:"ПВ",
info:`<p><b>Обсяг:</b> приблизно 1–1,5 сторінки (100–150 слів). <b>Тип твору:</b> твір-роздум з елементами опису.</p>
<p><b>Структура (обов'язкова):</b></p>
<ol><li><b>Вступ</b> — назвіть героя і чому ви його обрали.</li><li><b>Основна частина</b> — розкажіть про його подвиги/вчинки, опишіть риси характеру, наведіть приклади з міфу.</li><li><b>Висновок</b> — чого навчає цей герой, чи хотіли б ви бути схожими на нього.</li></ol>
<p><b>Мовні вимоги:</b> використайте 3–4 епітети або порівняння, хоча б один крилатий вислів, уникайте повторів.</p>
<p><b>Можливі герої:</b> Прометей, Геракл, Дедал, Ікар, Орфей (або інший, якого вивчали).</p>
<p><b>Риси характеру:</b> сміливий, мужній, наполегливий, самовідданий, мудрий, хитрий, вірний, справедливий, рішучий, благородний, витривалий.</p>
<p><b>Епітети й порівняння:</b> наймогутніший серед героїв; сильний, мов бик; хоробрий, наче лев; вірний своєму слову; непохитний перед труднощами; гідний наслідування.</p>`,

{pages:"с. 42–46", c:"УВ",
info:`<p><b>Жуль Верн</b> (1828–1905) — французький письменник, «батько» науково-фантастичного й пригодницького роману. Народився в Нанті в родині адвоката. У 11 років утік із дому юнгою на корабель, але батьки його повернули. Навчався праву в Парижі, захоплювався театром і літературою.</p>
<p>Першим поєднав літературу з науковими відкриттями. Його серія «Незвичайні подорожі» налічує 54 романи: «П'ять тижнів на повітряній кулі», «Діти капітана Гранта», «Двадцять тисяч льє під водою», «Таємничий острів».</p>
<p><b>«П'ятнадцятирічний капітан»</b> (1878) — роман про юнгу <b>Діка Сенда</b>, який після загибелі капітана мусить вести шхуну «Пілігрим». Через підступ кока Негоро корабель потрапляє не до Америки, а до Африки, де герої стикаються з работоргівлею. <b>Тема духовного випробування</b>: юнак опиняється в ситуації, коли від його мужності, волі й совісті залежать життя інших людей.</p>`,

info:`<p><b>Дік Сенд</b> — сирота, юнга китобійної шхуни «Пілігрим». Коли капітан Халл і вся команда загинули під час полювання на кита, 15-річний юнак став капітаном. Він рішучий, відповідальний, сміливий, чесний, швидко вчиться і не втрачає людяності.</p>

{c:"ПТ", content:"Позиція автора",
info:`<p>Опинившись в Африці (Анголі), герої бачать жахіття <b>работоргівлі</b>: каравани невільників у кайданах, ринки людей, жорстокість наглядачів. Тома та його друзів, вільних людей, хапають і продають у рабство.</p>
<p>Жуль Верн зображує рабство як найбільший злочин проти людини. Він показує: работорговці (Негоро, Гаррис, Альвец) — жорстокі, жадібні, підступні; невільники — гідні люди, які страждають безвинно.</p>
<p><b>Позиція автора</b>: Верн — гуманіст, він засуджує рабство й расизм, утверджує рівність людей незалежно від кольору шкіри. Через образи Тома, Геркулеса й інших він показує вірність, гідність, мужність темношкірих героїв. Дік Сенд ставиться до них як до рівних і друзів.</p>
<p>Роман нагадує, що свобода — найвища цінність, а боротьба з насильством — обов'язок кожної людини.</p>`,

info:`<p>У романі «П'ятнадцятирічний капітан» природа — не лише тло, а <b>активний учасник подій</b>: шторм кидає шхуну, кит стає причиною загибелі команди, тропічні зливи, повені й небезпечні тварини Африки випробовують героїв.</p>
<p><b>Образи природи:</b> безмежний океан, тропічний ліс, термітники (у яких герої ховаються від повені), дикі звірі, спека й сезон дощів.</p>

{c:"УВ", content:"«Принц і злидар». Знайомство зі змістом твору",
info:`<p><b>Марк Твен</b> (справжнє ім'я — Семюел Ленгхорн Клеменс, 1835–1910) — американський письменник-гуморист. Псевдонім «Марк Твен» означає «мітка два» — вигук лоцмана на Міссісіпі про безпечну глибину; письменник сам працював лоцманом. Відомі твори: «Пригоди Тома Сойєра», «Пригоди Гекльберрі Фінна».</p>
<p><b>«Принц і злидар»</b> (1881) — історична повість-казка про Англію XVI століття. В один день народилися два хлопчики: <b>Том Кенті</b>, син злодія з Двору Покидьків, і принц <b>Едуард</b>, син короля Генріха VIII. Хлопчики, схожі як дві краплі води, випадково <b>помінялися одягом</b> — і місцями.</p>
<p>Принц опиняється серед бідняків і на власному досвіді пізнає несправедливість законів, голод і жорстокість. Том потрапляє до палацу, де мусить «бути королем». Принцові допомагає благородний воїн <b>Майлз Гендон</b>. Після смерті Генріха VIII на коронації справжній король доводить свою особу: лише він знає, де схована Велика державна печатка.</p>`,

{c:"ПТ",
info:`<p>У повісті Марк Твен показує, що становище людини в суспільстві визначає <b>не її сутність, а умовності</b> — одяг, походження, етикет.</p>
<ul><li>Принца в лахмітті ніхто не впізнає й не вірить йому: «одяг робить людину» в очах суспільства.</li><li>Том у палаці мусить дотримуватися безглуздих церемоній: навіть одягатися й пити воду допомагає ціла низка придворних.</li><li>Том, не знаючи призначення Великої печатки, колов нею горіхи — гумористична деталь, що висміює пишність влади.</li></ul>
<p><b>Справедливість і закони:</b> мандруючи країною, Едуард бачить жорстокі закони (страти за дрібні провини, переслідування бідних). Том у ролі короля виявляє милосердя: скасовує несправедливі вироки, бо знає життя бідних.</p>
<p><b>Висновок:</b> справжня гідність людини — у доброті, честі, справедливості. Повернувшись на трон, Едуард VI правив милосердно — досвід «злидаря» зробив його мудрим королем.</p>`,

{c:"УВ", content:"«Різдвяна пісня в прозі». Подорож Скруджа у часі й просторі як можливість осягнути своє життя",
info:`<p><b>Чарльз Дікенс</b> (1812–1870) — видатний англійський письменник. Дитинство було тяжким: батька ув'язнили за борги, і 12-річний Чарльз працював на фабриці ваксини. Цей досвід навчив його співчувати бідним. Твори: «Пригоди Олівера Твіста», «Девід Копперфілд», «Великі сподівання».</p>
<p><b>«Різдвяна пісня в прозі»</b> (1843) — повість-казка про скупого, черствого лихваря <b>Ебенезера Скруджа</b>. У Святвечір до нього приходить привид покійного компаньйона <b>Марлі</b>, закутий у ланцюги, і попереджає: Скруджа відвідають три духи.</p>
<ul><li><b>Дух Минулого Різдва</b> показує дитинство й юність Скруджа: самотнього хлопчика, доброго хазяїна Феззівіга, втрачене кохання.</li><li><b>Дух Теперішнього Різдва</b> — бідну, але щасливу родину клерка Боба Кретчита та хворого Малого Тіма, веселе свято в племінника Фреда.</li><li><b>Дух Майбутнього Різдва</b> — самотню смерть Скруджа, якої ніхто не шкодує.</li></ul>
<p>Подорож у часі стає для Скруджа можливістю <b>осягнути своє життя</b> і змінитися.</p>`,
terms:[["Повість-казка","твір, що поєднує реалістичні й казкові (фантастичні) елементи"],["Святвечір","вечір перед Різдвом"]],
q:[["Ким був Скрудж?",["Лікарем","Скупим лихварем","Клерком","Священником"],1],

["Як звали хворого сина Боба Кретчита?",["Малий Тім","Джек","Том","Олівер"],0]]},

{c:"ПТ",
info:`<p><b>Динаміка образу</b> — зміна характеру героя протягом твору. Скрудж — яскравий приклад героя, що <b>духовно перероджується</b>.</p>
<p><b>Скрудж на початку:</b> «твердий і гострий, як кремінь», скупий, холодний, відмовляє жертвувати на бідних, кидає «Дурниці!» на привітання з Різдвом, тримає клерка в холоді. Самотній, нікого не любить.</p>
<p><b>Причини переродження:</b></p>
<ol><li>Спогади про дитинство пробуджують давно забуті почуття.</li><li>Він бачить, як любов і доброта роблять щасливими навіть бідних людей (родина Кретчитів).</li><li>Співчуття до Малого Тіма.</li><li>Страх самотньої смерті й усвідомлення: життя можна змінити, поки не пізно.</li></ol>
<p><b>Скрудж у фіналі:</b> щасливий, щедрий, веселий; посилає Кретчитам індичку, підвищує Бобові платню, стає «другим батьком» Малому Тіму, приходить до племінника на свято.</p>
<p><b>Ідея:</b> людина здатна змінитися на краще; доброта й любов роблять людину щасливою.</p>`,
terms:[["Динаміка образу","зміна характеру героя в розвитку подій"],["Переродження","глибока внутрішня зміна людини"]],

{c:"ПТ", content:"Вплив фантастичних елементів на сюжет",
info:`<p>У повісті Дікенса поєднуються <b>реальне</b> і <b>фантастичне</b>.</p>
<table class="tbl"><tr><th>Реальне</th><th>Фантастичне</th></tr>
<tr><td>Лондон XIX ст., туман і холод, контора Скруджа, бідні квартали, родина Кретчитів, звичаї англійського Різдва</td><td>Привид Марлі в ланцюгах, три духи Різдва, подорожі в часі, видіння майбутнього</td></tr></table>
<p><b>Вплив фантастики на сюжет:</b> саме духи стають рушієм подій — без них Скрудж не побачив би свого минулого й майбутнього. Фантастика допомагає показати внутрішній світ героя, загострити моральну проблему, зробити повчання яскравим і переконливим.</p>
<p>Водночас фантастичне в повісті має <b>реалістичну мету</b>: Дікенс прагне привернути увагу читачів до бідності, дитячих страждань, байдужості багатих.</p>`,
terms:[["Фантастика","зображення неймовірного, неіснуючого в реальності"],["Реалізм","правдиве відтворення життя"]],
q:[["Що з переліченого належить до фантастичного?",["Контора Скруджа","Духи Різдва","Родина Кретчитів","Лондонський туман"],1],
["Яку роль відіграють духи в сюжеті?",["Вони — рушій подій","Не впливають на сюжет","Лише лякають","Прикрашають оповідь"],0],

{c:"ДМ", content:"Ознаки фольклору (казки, пісні) у творі",
info:`<p><b>Різдво</b> в повісті — не лише свято, а <b>символ</b> любові, милосердя, родинного тепла й духовного відродження. Дікенс називав Різдво «добрим часом прощення, милосердя й радості».</p>
<p>Образ Різдва протиставлений «холоду» Скруджа: свято «розтоплює» його серце.</p>
<p><b>Ознаки фольклору у творі:</b></p>
<ul><li>назва «Різдвяна пісня» (англ. <i>carol</i> — колядка), а розділи названі <b>«строфами»</b>, як у пісні;</li><li>казкові образи духів, магічне число <b>три</b>;</li><li>боротьба добра і зла, перемога добра, щасливий фінал;</li><li>повчальність, як у казці.</li></ul>
<p><b>Медіа-завдання:</b> порівняйте повість з однією з екранізацій (напр., анімаційний фільм «Різдвяна історія», 2009) — що зберегли автори фільму, а що змінили?</p>`,
terms:[["Фольклор","усна народна творчість (казки, пісні, легенди)"],["Колядка","обрядова різдвяна пісня"],["Символ","образ із глибшим, переносним значенням"]],

{c:"УВ", content:"«Ніч перед Різдвом». Поетичність повісті",
info:`<p><b>Микола Гоголь</b> (1809–1852) народився в Сорочинцях на Полтавщині. Писав російською мовою, але першою прославила його книжка про Україну — <b>«Вечори на хуторі біля Диканьки»</b> (1831–1832), куди ввійшла повість <b>«Ніч перед Різдвом»</b>. Письменник глибоко знав український фольклор, звичаї й легенди.</p>
<p><b>Сюжет:</b> у різдвяну ніч чорт краде місяць, щоб помститися ковалеві <b>Вакулі</b>, який намалював його смішним. Вакула закоханий у вродливу горду <b>Оксану</b>; вона жартома вимагає черевички, «як у цариці». Вакула осідлує чорта, летить до Петербурга й привозить черевички.</p>
<p><b>Поетичність повісті:</b> чарівні пейзажі зимової ночі («Останній день перед Різдвом минув. Зимня, ясна ніч настала…»), ліричні відступи, яскраві барви, музичність мови, поєднання реального й казкового.</p>`,
terms:[["Повість","прозовий твір середнього обсягу"],["Ліричний відступ","місце в тексті, де автор висловлює свої почуття"]],
q:[["Де народився М. Гоголь?",["У Києві","У Сорочинцях на Полтавщині","У Петербурзі","У Львові"],1],
["До якої збірки ввійшла повість?",["«Миргород»","«Вечори на хуторі біля Диканьки»","«Петербурзькі повісті»","«Мертві душі»"],1],
["Що вкрав чорт у різдвяну ніч?",["Сонце","Місяць","Зірку","Черевички"],1],

{c:"ПТ", content:"Поєднання реального і фантастичного",
info:`<p>У повісті «Ніч перед Різдвом» відтворено <b>українські різдвяні традиції</b>:</p>
<ul><li><b>Святвечір</b> і <b>кутя</b>, вечеря з першою зіркою;</li><li><b>колядування</b> — парубки й дівчата ходять селом, співають колядки, отримують ковбаси, паляниці, вареники в мішки;</li><li>вечорниці, гостювання;</li><li>звичай давати колядникам гостинці;</li><li>різдвяна служба в церкві.</li></ul>
<p><b>Реальне:</b> село Диканька, побут, звичаї, характери селян (Чуб, Солоха, дяк, голова, Пацюк), поїздка до Петербурга.</p>
<p><b>Фантастичне:</b> чорт, відьма Солоха, що літає на мітлі, вкрадений місяць, вареники, що самі стрибають у рот Пацюку, політ Вакули на чорті.</p>
<p>Фантастичне подано в дусі народних легенд — з гумором, без жаху. Нечиста сила в повісті смішна, а перемагає її людина — сміливий Вакула.</p>`,
terms:[["Колядування","обрядовий різдвяний обхід осель зі співом колядок"],["Кутя","обрядова страва Святвечора"]],

["Хто з персонажів є відьмою?",["Оксана","Солоха","Одарка","Цариця"],1],

{c:"УВ", content:"Виразне читання уривків твору",
info:`<p><b>Оксана</b> — дочка багатого козака Чуба, «перша красуня» села. Спершу вона горда, вередлива, милується собою в дзеркалі й насміхається з Вакули. Та коли Вакула зникає і по селу ходять чутки, що він загинув, Оксана розуміє, що кохає його. Вона змінюється — стає щирою й ніжною.</p>
<p><b>Вакула</b> — коваль і маляр, сильний, працьовитий, побожний і талановитий. Його кохання щире й самовіддане: заради Оксани він готовий на неможливе — летить до цариці. Вакула кмітливий: перехитрив самого чорта.</p>
<p><b>Тема кохання</b> в повісті світла й поетична: кохання перемагає гордість, допомагає людині подолати труднощі й стати кращою. Фінал щасливий — Вакула сватається до Оксани, і Чуб дає згоду.</p>
<p><b>Виразне читання:</b> оберіть уривок (Оксана перед дзеркалом; розмова Вакули й Оксани; Вакула в цариці), визначте інтонацію, паузи, логічні наголоси.</p>`,
terms:[["Характеристика персонажа","розповідь про зовнішність, вчинки, риси героя"],["Виразне читання","читання з правильною інтонацією, паузами й наголосами"]],
q:[["Якою Оксана є на початку повісті?",["Скромною","Гордою й вередливою","Сумною","Боязкою"],1],
["Коли Оксана зрозуміла, що кохає Вакулу?",["Коли він приніс черевички","Коли він зник і пішли чутки про його загибель","На вечорницях","Ніколи"],1],

["Чим закінчується повість?",["Оксана виходить заміж за іншого","Вакула сватається, і Чуб погоджується","Вакула їде назавжди","Чорт перемагає"],1]]},

{c:"ДМ", content:"Елементи фольклору",
info:`<p><b>Гумор</b> — основна інтонація повісті. Гоголь сміється добродушно:</p>
<ul><li>Солоха ховає в мішки своїх «залицяльників» — чорта, голову, дяка й Чуба, а Вакула несе мішки до кузні;</li><li>Пацюк, до якого вареники самі стрибають у рот;</li><li>Чуб і кум, що не можуть знайти дорогу в темряві;</li><li>чорт — «спереду зовсім німець», а ззаду — губернський стряпчий у мундирі.</li></ul>
<p><b>Особливості мови:</b> образна, мелодійна; багато українських слів і реалій (кутя, вареники, свитка, кожух, вечорниці); порівняння, епітети, гіперболи; звертання оповідача (пасічника Рудого Панька) до читача.</p>
<p><b>Елементи фольклору:</b> народні вірування про нечисту силу, легенди про чорта й відьму, колядки, народний гумор, казкові мотиви (чарівна подорож, виконання важкого завдання заради коханої).</p>`,

{c:"УВ", content:"«Жага до життя». Самовладання, воля до життя головного героя, його мужність у сутичках із суворою природою та життєвими обставинами",
info:`<p><b>Джек Лондон</b> (1876–1916) — американський письменник. Із дитинства працював: продавав газети, був робітником, моряком. 1897 р. вирушив на Аляску під час «золотої лихоманки» на Клондайку. Враження від Півночі лягли в основу його «північних оповідань».</p>
<p><b>«Жага до життя»</b> (1905). Двоє золотошукачів повертаються з Півночі. Головний герой (автор не називає його імені) підвертає ногу. Його товариш <b>Білл</b>, не озирнувшись, покидає його.</p>
<p>Герой залишається сам: без їжі, з хворою ногою, у суворій тундрі. Він їсть ягоди, коріння, пташенят, сиру рибу, кидає золото, бо воно стає непотрібним тягарем. За ним невідступно йде хворий <b>вовк</b>, чекаючи, коли людина впаде. Знесилений, герой повзе, але не здається. У вирішальній сутичці він перемагає вовка. Його підбирає китобійне судно «Бедфорд».</p>
<p><b>Головне:</b> воля до життя, самовладання й мужність допомагають людині вистояти там, де, здавалося б, вижити неможливо.</p>`,

info:`<p>Навіть у моменти смертельної небезпеки герой оповідання <b>зберігає людяність і моральні переконання</b>.</p>
<ul><li>Натрапивши на кістки Білла та його мішечок із золотом, він <b>не бере чужого золота</b>, хоча міг би. Він залишається чесним навіть перед смертю.</li><li>Він <b>не їсть кісток Білла</b> — не переступає межі людської гідності.</li><li>Він не мстить Біллові і не зневіряється в людях.</li></ul>
<p>Спершу він кидає й своє золото — розуміє, що в боротьбі за життя воно нічого не важить. Справжні цінності — <b>життя, воля, гідність</b>.</p>

<p>Пейзаж <b>відтворює внутрішній стан героя</b>: самотність, утому, відчай, а згодом — проблиск надії (коли він побачив море й корабель, світ ніби «розсвітлюється»).</p>

info:`<p><b>Зрадництво</b> в оповіданні втілене в образі <b>Білла</b>. Він покидає пораненого товариша, бо думає лише про себе й своє золото. Зрада приречена: Білл гине, і його золото не допомогло йому вижити.</p>
<p><b>Духовна стійкість</b> — здатність людини не зламатися під тиском обставин. Головний герой:</p>
<ul><li>не впадає у відчай, навіть коли розуміє, що Білл покинув його;</li><li>ставить собі маленькі цілі й іде до них;</li><li>бореться з голодом, холодом, болем і страхом;</li><li>навіть у маренні тримається за життя.</li></ul>
<p>Кінцівка: на кораблі герой ховає сухарі в матрац — голод залишив глибокий слід. Але лікарі певні — це мине. Людина пережила неможливе.</p>

info:`<p><b>О. Генрі</b> (справжнє ім'я — Вільям Сідні Портер, 1862–1910) — американський письменник, майстер новели з несподіваною кінцівкою. Написав близько 300 оповідань.</p>
<p><b>«Вождь червоношкірих»</b> (1907). Двоє шахраїв — <b>Сем</b> (оповідач) і <b>Білл</b> — вирішують розбагатіти: викрасти сина поважного городянина <b>Ебенезера Дорсета</b> і вимагати 2000 доларів викупу.</p>
<p>Але 10-річний хлопчик, що називає себе <b>Вождем Червоношкірих</b>, перетворює життя викрадачів на пекло: гра в «індіанців» для нього — справжня пригода, він катує Білла, намагається зняти з нього скальп, кидає камінням. Додому повертатися не хоче!</p>

<p><b>Гумор</b> твору — у комічній ситуації «навпаки»: жертва знущається з викрадачів.</p>`,

<p><b>Корисні слова:</b> відповідальність, сила волі, наполегливість, гідність, підтримка, мужність, віра в себе.</p>`,

<p><b>«Джим Ґудзик і машиніст Лукас»</b> (1960) — казкова повість. На крихітний острів, де живуть король, двоє підданих, машиніст <b>Лукас</b> і паровоз <b>Емма</b>, поштар привозить посилку, а в ній — темношкіре немовля. Хлопчика називають <b>Джимом Ґудзиком</b>.</p>

<p>Друзі потрапляють до країни <b>Мандали</b>, де дізнаються, що донька імператора, принцеса <b>Лі Сі</b>, викрадена й ув'язнена в <b>Місті Драконів</b> у злої драконихи пані Мальцан, яка мучить викрадених дітей. Джим і Лукас вирішують її визволити.</p>`,

info:`<p><b>Мацуо Басьо</b> (1644–1694) — великий японський поет, творець класичного <b>хайку</b>. Він був мандрівним поетом: подорожував Японією, спостерігав за природою, жив у простій хатині біля банана (японською — «басьо»), звідки й узяв ім'я.</p>
<p><b>Хайку</b> — японський неримований вірш із трьох рядків і 17 складів: <b>5 – 7 – 5</b>. Обов'язково містить <b>сезонне слово</b> (кіґо), що вказує на пору року.</p>
<p><b>Японські уявлення про красу:</b> краса — у простому, буденному, непомітному; у мінливості й швидкоплинності; у тиші, гармонії людини й природи; у недомовленості (сабі — краса старовини, самотності; ваби — краса простоти).</p>
<p>Найвідоміше хайку Басьо (дослівний переклад змісту): <i>Старий ставок. / Жаба стрибнула у воду — / сплеск у тиші.</i> Одна мить — і в ній відкривається вічність.</p>`,
terms:[["Хайку","японський тривірш із 17 складів (5–7–5)"],["Кіґо","сезонне слово в хайку"],["Лірика","рід літератури, що передає почуття й переживання"]],

{c:"", content:"Роль художньої деталі. Підтекст",
info:`<p>Хайку Басьо зображують <b>різні стани природи</b>: весняне цвітіння сакури, літню спеку і цикад, осінній вітер, місяць і самотні гілки, зимовий сніг. Кожна пора року має свій настрій.</p>
<p><b>Художня деталь</b> — головний засіб хайку. Одна виразна деталь (ворон на голій гілці, крапля роси, метелик, сплеск води) створює цілу картину й настрій. Поет не описує — він <b>показує мить</b>.</p>
<p><b>Підтекст</b> — прихований, невисловлений зміст. У хайку багато недомовленого: читач сам має відчути почуття поета (самотність, захоплення, смуток, спокій). Наприклад, образ ворона на сухій гілці восени — це і пейзаж, і настрій самотності, і роздум про швидкоплинність життя.</p>
<p><b>Як аналізувати хайку:</b> 1) Яка пора року? 2) Яка деталь головна? 3) Який настрій? 4) Що залишилося «за словами»?</p>`,
terms:[["Художня деталь","виразна подробиця, що несе важливий зміст"],["Підтекст","прихований зміст, що не висловлений прямо"]],
q:[["Що є головним засобом хайку?",["Рима","Художня деталь","Діалог","Сюжет"],1],

{c:"", content:"«Моє серце в верховині…». Ідея любові до Батьківщини, до рідного краю",
info:`<p><b>Роберт Бернс</b> (1759–1796) — національний поет <b>Шотландії</b>. Народився в селянській родині, з дитинства працював на фермі, а вільний час віддавав книжкам. Писав шотландським діалектом, спирався на народні пісні; багато його віршів стали піснями. День народження поета (25 січня) у Шотландії святкують як «Ніч Бернса».</p>
<p><b>«Моє серце в верховині…»</b> (1789) — вірш про любов до рідного краю. <b>Верховина</b> (Гайленд, Highlands) — гірська частина Шотландії. Ліричний герой перебуває далеко від дому, але його серце — там, у горах, де він полює на оленів, де гірські вершини, зелені долини, ліси й бурхливі потоки.</p>
<p><b>Ідея:</b> де б не була людина, її серце належить рідній землі; любов до Батьківщини — вічна. Ця тема особливо близька українцям, які нині змушені жити далеко від дому.</p>`,
terms:[["Ліричний герой","особа, чиї почуття передано в ліричному вірші"],["Рефрен","повтор рядка чи кількох рядків у вірші"]],

{c:"", content:"Виразне читання напам'ять",
info:`<p><b>Антитеза</b> — художній засіб, що ґрунтується на <b>протиставленні</b> образів, понять, почуттів.</p>
<p>У вірші Бернса антитеза — основа композиції: <b>«тут»</b> (де перебуває ліричний герой фізично) і <b>«там»</b> (верховина, де його серце). Тіло — на чужині, серце — вдома. Це протиставлення підкреслює силу туги й любові до рідного краю.</p>
<p>Інші художні засоби: <b>рефрен</b> (повтор «моє серце в верховині»), <b>звертання</b> й <b>оклики</b> (прощання з горами, долинами, лісами), <b>перелік</b> образів природи, <b>епітети</b>.</p>
<p><b>Виразне читання напам'ять:</b> інтонація — схвильована, ніжна, із тугою; рефрен вимовляйте з особливим почуттям; у рядках-прощаннях — наростання емоцій.</p>`,

{c:"", content:"«Пісня про Гайавату». Міфи північноамериканських індіанців та їх втілення в поемі",
info:`<p><b>Генрі Водсворт Лонгфелло</b> (1807–1882) — американський поет, професор Гарвардського університету, перекладач. Знав багато мов і захоплювався фольклором різних народів.</p>
<p><b>«Пісня про Гайавату»</b> (1855) — <b>поема</b>, написана на основі <b>міфів і легенд північноамериканських індіанців</b>. Лонгфелло використав записи етнографа Генрі Скулкрафта.</p>
<p><b>Міфологічні мотиви в поемі:</b></p>
<ul><li><b>Гітчі Маніто</b> — Великий Дух, Володар Життя; він запалює Люльку Миру й закликає племена жити у злагоді;</li><li>чарівне походження героя: Гайавата — син Західного Вітру Меджеківіса й прекрасної Веноні, вихований бабусею Нокоміс;</li><li>олюднена природа: звірі й птахи говорять із Гайаватою;</li><li>міф про появу маїсу (Мондамін);</li><li>боротьба героя з чудовиськами й злими силами.</li></ul>`,

["На основі чого створено поему?",["Грецьких міфів","Міфів і легенд північноамериканських індіанців","Японських хайку","Біблії"],1],

{c:"", content:"Ідеї миру, національного єднання, служіння народові. Елементи фольклору в творі",
info:`<p><b>Гайавата</b> — легендарний герой-рятівник, мудрий вождь, що служить своєму народові.</p>
<ul><li>Він вивчає «мову» звірів і птахів, розуміє природу;</li><li>навчає людей вирощувати маїс, будувати човни, лікувати хвороби;</li><li>дарує людям <b>писемність</b> (малюнкове письмо), щоб зберегти пам'ять поколінь;</li><li>бореться зі злими силами, що несуть хвороби й голод;</li><li>закликає племена до миру й єднання.</li></ul>
<p><b>Ідеї поеми:</b> <b>мир</b> між народами; <b>національне єднання</b> (племена мають жити як брати, бо розбрат приносить загибель); <b>служіння народові</b>.</p>
<p><b>Елементи фольклору:</b> міфологічні образи, постійні епітети, повтори, паралелізм, звертання до природи, пісенний ритм, казкові перетворення.</p>
<p><b>Сумний фінал:</b> загибель дружини Мінегаги від голоду й хвороби; Гайавата відпливає на захід, назустріч вечірньому сонцю, залишаючи народу свою мудрість.</p>`,
terms:[["Повтор","багаторазове вживання слова чи рядка для підсилення"],["Паралелізм","зіставлення подібних образів (часто — природи й людини)"]],
q:[["Що Гайавата подарував людям?",["Зброю","Писемність (малюнкове письмо)","Гроші","Коня"],1],
["Як звали дружину Гайавати?",["Нокоміс","Мінегага","Веноні","Лі Сі"],1],

{c:"", content:"Проблема руйнування духовних цінностей в оповіданні «Усмішка»",
info:`<p><b>Рей Дуглас Бредбері</b> (1920–2012) — американський письменник-фантаст, автор «Марсіанських хронік», «451° за Фаренгейтом», «Кульбабового вина». Він вважав, що фантастика — це спосіб попередити людство про небезпеки.</p>
<p><b>«Усмішка»</b> (1952) — оповідання-<b>антиутопія</b>. Дія відбувається в майбутньому, після руйнівної війни. Цивілізація зруйнована, люди живуть у злиднях і ненавидять минуле, яке, на їхню думку, призвело до катастрофи.</p>
<p>На міській площі люди стоять у черзі, щоб <b>плюнути на картину</b> — «Джоконду» Леонардо да Вінчі. Згодом оголошують, що картину віддають натовпу на знищення, і люди шматують полотно.</p>
<p><b>Проблема руйнування духовних цінностей:</b> люди, що втратили культуру, пам'ять і красу, стають жорстокими натовпом. Знищуючи мистецтво, вони знищують себе. Бредбері попереджає: без духовних цінностей людство не має майбутнього.</p>`,
terms:[["Антиутопія","твір, що зображує жахливе майбутнє як попередження"],["Наукова фантастика","фантастика, що спирається на наукові ідеї"]],
q:[["Ким був Рей Бредбері?",["Англійським поетом","Американським письменником-фантастом","Французьким романістом","Японським поетом"],1],
["Що люди робили з картиною в черзі?",["Милувалися","Плювали на неї","Фотографували","Купували"],1],
["Яка картина зображена в оповіданні?",["«Джоконда»","«Соняшники»","«Таємна вечеря»","«Мадонна»"],0],
["Що таке антиутопія?",["Опис ідеального суспільства","Зображення жахливого майбутнього як попередження","Казка","Біографія"],1],
["Від чого застерігає Бредбері?",["Від руйнування духовних цінностей","Від подорожей","Від науки","Від спорту"],0]]},

{c:"",
info:`<p><b>Том</b> — хлопчик, головний герой оповідання «Усмішка». Він стоїть у черзі разом із дорослими, але відрізняється від них.</p>
<p><b>Розвиток образу:</b></p>
<ul><li>Спершу Том — <b>мимовільний учасник</b> подій: він опинився в черзі, бо всі там стоять. Але він не хоче плювати на картину.</li><li>Побачивши «Джоконду», він відчуває красу її усмішки — вона здається йому прекрасною.</li><li>Коли натовп кидається шматувати картину, Том у штовханині вихоплює <b>клаптик полотна</b> й тікає.</li><li>Вночі вдома він розкриває долоню — на клаптику <b>Усмішка</b>. Він довго дивиться на неї в місячному світлі й засинає зі спокоєм.</li></ul>
<p><b>Значення образу:</b> Том — символ <b>надії</b>. У дитячій душі ще живе здатність відчувати красу. Поки є такі люди, як Том, культура не загине.</p>`,
terms:[["Мимовільний учасник","той, хто опинився в подіях не з власної волі"],["Символ","образ із переносним, глибшим значенням"]],
q:[["Як Том ставився до картини?",["Ненавидів","Відчув її красу","Був байдужим","Боявся"],1],
["Що Том зробив під час знищення картини?",["Втік додому без нічого","Вихопив клаптик з Усмішкою","Плюнув на неї","Покликав поліцію"],1],
["Символом чого є Том?",["Жорстокості","Надії на відродження культури","Страху","Влади"],1],
["Ким Том був на початку подій?",["Організатором","Мимовільним учасником","Охоронцем","Художником"],1]]},

{c:"", content:"Його значення для розкриття авторського задуму",
info:`<p><b>«Джоконда»</b> («Мона Ліза») — картина Леонардо да Вінчі (початок XVI ст.), що зберігається в Луврі (Париж). Загадкова усмішка жінки на портреті — одна з найвідоміших таємниць мистецтва.</p>
<p>В оповіданні Бредбері образ Джоконди — <b>багатогранний символ</b>:</p>
<ul><li><b>символ мистецтва й краси</b>, які людство створювало століттями;</li><li><b>символ культури й пам'яті</b> минулого;</li><li><b>символ людяності</b> — доброти, ніжності, гармонії;</li><li><b>символ надії</b> — усмішка, що пережила знищення.</li></ul>
<p><b>Значення для авторського задуму:</b> через протиставлення жорстокого натовпу й ніжної усмішки Бредбері показує, що людина, яка знищує красу, сама деградує. Але краса безсмертна, поки є хоча б одна людина, здатна її відчути.</p>
<p>Назва «Усмішка» — це і усмішка Джоконди, і усмішка надії в душі Тома.</p>`,
terms:[["Багатогранний символ","образ, що має кілька значень"],["Авторський задум","те, що хотів сказати письменник твором"]],
q:[["Хто намалював «Джоконду»?",["Рафаель","Леонардо да Вінчі","Мікеланджело","Ван Гог"],1],

{c:"", content:"«Запах думки». Фантастичний світ оповідання",
info:`<p><b>Роберт Шеклі</b> (1928–2005) — американський письменник-фантаст, майстер гумористичної й філософської фантастики. Його оповідання часто будуються на парадоксах.</p>
<p><b>«Запах думки»</b> (1953). Пілот поштового корабля <b>Лерой Кліві</b> через несправний старий корабель здійснює вимушену посадку на невідомій планеті <b>Мелдж-ІІ</b>.</p>
<p><b>Фантастичний світ:</b> тварини цієї планети <b>сліпі й глухі</b>, але сприймають <b>думки</b> — вони «чують запах думки». Хижаки полюють, орієнтуючись на думки жертви. Кліві розуміє, що єдиний спосіб вижити — <b>керувати своїми думками</b>: подумки уявляти себе кимось іншим, щоб обманювати хижаків.</p>
<p>Фантастика тут — засіб поставити людину в екстремальну ситуацію й перевірити її розум, витримку й винахідливість.</p>`,
terms:[["Телепатія","здатність сприймати думки на відстані"],["Екстремальна ситуація","надзвичайна, небезпечна для життя обставина"]],

{c:"",
info:`<p>Кліві проходить і <b>фізичне</b>, і <b>духовне</b> випробування.</p>
<p><b>Фізичне:</b> аварія корабля, чужа планета, переслідування хижаків, утома, голод, постійна небезпека.</p>
<p><b>Духовне:</b> найважче — <b>не піддатися страху</b>. Адже страх «пахне» для хижаків — варто злякатися, і тебе знайдуть. Кліві мусить постійно контролювати свідомість: тримати в голові образи інших тварин, не дозволяти собі думати про себе як про людину, не панікувати.</p>
<p>Герой уявляє себе то одним, то іншим хижаком, використовуючи знання про тварин планети, — і хижаки відступають. Він виявляє дивовижну <b>силу волі, кмітливість і самовладання</b>, доки його не рятують.</p>
<p><b>Висновок:</b> найсильніша зброя людини — не фізична сила, а розум і вміння керувати собою.</p>`,
terms:[["Самовладання","уміння керувати собою, своїми емоціями"],["Сила волі","здатність досягати мети, долаючи перешкоди"]],

{c:"",
info:`<p>Оповідання Шеклі <b>уславлює могутність людського розуму, інтуїції та волі</b>.</p>
<ul><li><b>Розум:</b> Кліві швидко аналізує ситуацію, розуміє закони чужого світу й знаходить спосіб вижити.</li><li><b>Інтуїція:</b> він відчуває, коли небезпека поруч, і діє на випередження.</li><li><b>Здатність не схилятися</b> перед обставинами: опинившись сам-на-сам із ворожим світом, він не здається.</li><li><b>Уява</b> стає зброєю — людина може перетворити свою думку на захист.</li></ul>
<p>Порівняймо з героєм Джека Лондона («Жага до життя»): обидва в екстремальних умовах, обидва самотні, обидва не здаються. Але герой Лондона виживає завдяки фізичній витривалості й волі, а Кліві — передусім завдяки <b>розуму та уяві</b>.</p>
<p>Шеклі вірить: людина, яка володіє собою, здатна вижити будь-де — навіть на чужій планеті.</p>`,
terms:[["Інтуїція","здатність відчувати правильне рішення без довгих міркувань"]],

{c:"",
info:`<p>Яким бачить <b>людину майбутнього</b> Роберт Шеклі?</p>

<p>Шеклі з гумором показує й недоліки «світу майбутнього»: компанія, що відправила Кліві в політ на старому кораблі, не дбала про безпеку працівника.</p>

{c:"ПВ", content:"Есе на одну з тем: 1. «Чи актуальні сьогодні попередження Рея Бредбері? Чому?» 2. «Якою має бути людина майбутнього на прикладі фантастичного оповідання Р. Шеклі?»",
info:`<p><b>Урок розвитку мовлення (письмово).</b> Напишіть <b>есе</b> на одну з тем:</p>
<ol><li>«Чи актуальні сьогодні попередження Рея Бредбері? Чому?»</li><li>«Якою має бути людина майбутнього (на прикладі оповідання Р. Шеклі "Запах думки")?»</li></ol>
<p><b>Есе</b> — невеликий твір, у якому автор вільно висловлює власні думки й враження з певного питання.</p>
<p><b>Структура:</b> вступ (ваша позиція) → 2–3 аргументи (приклади з твору + з життя) → висновок.</p>
<p><b>Підказки до теми 1:</b> руйнування пам'яток культури під час воєн (зокрема в Україні), байдужість до мистецтва, «натовпна» поведінка в соцмережах; надія — люди, що рятують культурні цінності.</p>
<p><b>Підказки до теми 2:</b> розум, самовладання, гнучкість, сила волі, відповідальність.</p>
<p>Обсяг — 1–1,5 сторінки.</p>`,

{c:"", content:"Проблеми відносин між дітьми й дитячої жорстокості",
info:`<p><b>«Все літо в один день»</b> (1954) — оповідання Бредбері. На планеті <b>Венера</b> сім років безперервно йде дощ. Сонце з'являється лише раз на сім років — і всього на <b>дві години</b>.</p>
<p>Дев'ятирічні діти, які народилися на Венері, не пам'ятають сонця. Лише дівчинка <b>Марго</b> переїхала із Землі п'ять років тому й пам'ятає, яке воно: «як монетка», «як вогонь у грубці». Вона тиха, замкнена, сумує за Землею.</p>
<p>Діти не вірять їй, заздрять і цькують її. Перед появою сонця вони <b>замикають Марго в комірчині</b>. Коли сонце виходить, діти радіють, бігають, грають… а потім знову починається злива. Згадавши про Марго, вони мовчки відмикають двері.</p>
<p><b>Проблеми:</b> дитяча жорстокість і цькування; заздрість; неприйняття «іншого»; байдужість натовпу. Бредбері показує, як легко діти стають жорстокими й як важко потім виправити зло.</p>`,

about:"Цикл міфів про найсильнішого героя Греції. Через ненависть богині Гери Геракл мусить служити слабкому й боягузливому цареві й виконати дванадцять подвигів. Міфи прославляють силу, кмітливість, витривалість і готовність служити людям.",
plot:["Геракл народжується від Зевса і смертної Алкмени. Ще немовлям він душить двох змій, яких наслала ревнива Гера.","Через підступ Гери він мусить 12 років служити цареві Еврисфею.","Геракл виконує 12 подвигів: перемагає Немейського лева й Лернейську гідру, ловить Керінейську лань і Ериманфського вепра, очищає Авгієві стайні, проганяє Стимфалійських птахів, приборкує Критського бика й коней Діомеда, здобуває пояс Іпполіти та корів Геріона.","Щоб дістати золоті яблука Гесперид, він тримає небо замість титана Атланта, а потім хитрістю повертає йому цей тягар.","Останнім подвигом Геракл виводить із царства мертвих триголового пса Цербера. Відслуживши, герой стає вільним, а після смерті боги приймають його на Олімп."],
heroes:[["Геракл","син Зевса, наймогутніший герой; сильний, сміливий, кмітливий, витривалий"],["Еврисфей","цар, якому служить Геракл; заздрісний боягуз"],["Гера","дружина Зевса, ненавидить Геракла"],["Іолай","племінник і помічник Геракла"],["Атлант","титан, що тримає небо на плечах"]]},

daedalus:{name:"Міф про Дедала та Ікара", author:"Давньогрецький міф (переказ Катерини Гловацької)", genre:"Міф",
about:"Міф про геніального майстра й винахідника та його сина, які на саморобних крилах тікають із неволі. Це історія про людську мрію про політ, про силу розуму — і про трагічні наслідки нерозважливості.",
plot:["Дедал — найкращий митець і винахідник Афін. Через злочин, скоєний із заздрощів до талановитого учня, він тікає на острів Крит.","Цар Мінос доручає йому збудувати Лабіринт для чудовиська Мінотавра й не відпускає майстра додому.","Дедал робить крила з пташиного пір'я, скріпленого воском і нитками, для себе і сина Ікара.","Перед польотом батько попереджає: не підлітай високо до сонця й не опускайся низько до моря.","У польоті Ікар, сп'янілий від свободи, злітає вгору. Сонце розтоплює віск, крила розпадаються, і юнак падає в море. Дедал у горі ховає сина."],
heroes:[["Дедал","геніальний майстер, архітектор, винахідник; мудрий, але нещасливий батько"],["Ікар","син Дедала; сміливий, мрійливий, але необачний юнак"],["Мінос","цар Криту, що тримає Дедала в неволі"]]},

orpheus:{name:"Міф про Орфея та Еврідіку", author:"Давньогрецький міф", genre:"Міф",
about:"Міф про співця, чия музика зворушувала навіть богів підземного царства, і про кохання, сильніше за смерть. Водночас це історія про те, як важко людині довіряти й чекати.",
plot:["Орфей, син музи Калліопи, співає так прекрасно, що до нього сходяться звірі, а дерева й каміння рухаються за звуками ліри.","Його кохана дружина, німфа Еврідіка, гине від укусу змії.","Невтішний Орфей спускається в царство мертвих. Своїм співом він зачаровує перевізника Харона, пса Цербера, а потім і владик Аїда й Персефону.","Аїд дозволяє Еврідіці повернутися на землю, але з умовою: Орфей не повинен озиратися, доки не вийде на світло.","Уже біля виходу Орфей не витримує й озирається — і Еврідіка навіки зникає в темряві. Співець залишається сам зі своїм горем."],
heroes:[["Орфей","легендарний співець і музикант; вірний, люблячий, але нетерплячий"],["Еврідіка","кохана дружина Орфея, німфа"],["Аїд і Персефона","володарі царства мертвих"]]},

captain:{name:"«П'ятнадцятирічний капітан»", author:"Жуль Верн, 1878", genre:"Пригодницький роман",
about:"Роман про юнака, якому довелося стати капітаном корабля й ватажком людей у найстрашніших обставинах: зрада, корабельна аварія, полон, работоргівля в Африці. Це історія про мужність, відповідальність, дружбу і боротьбу з насильством.",
plot:["Шхуна «Пілігрим» пливе від берегів Нової Зеландії до Америки. На борту — місіс Уелдон із сином Джеком, кузен Бенедикт, няня Нен, кок Негоро і 15-річний юнга Дік Сенд. У морі підбирають п'ятьох темношкірих — уцілілих з розбитого судна.","Капітан Халл і вся команда гинуть під час полювання на кита. Дік Сенд стає капітаном.","Підступний Негоро псує компас, і замість Америки шхуна розбивається біля берегів Африки (Анголи). Герої думають, що вони в Південній Америці.","Зустрінутий «мандрівник» Гаррис, спільник Негоро, веде їх углиб континенту. Дік розуміє, що це Африка. Мандрівників схоплюють работорговці: темношкірих друзів продають у рабство, місіс Уелдон із сином тримають заради викупу.","Дік і друзі проходять через полон, повінь, небезпеки, але не здаються. Пес Дінго вбиває Негоро, розкривається таємниця літер «S. V.» на його нашийнику. Герої повертаються до Америки, а Дік стає справжнім моряком."],
heroes:[["Дік Сенд","15-річний юнга, згодом капітан; відповідальний, сміливий, чесний"],["Місіс Уелдон","дружина судновласника; мужня, добра, вірить у Діка"],["Джек","малий син місіс Уелдон"],["Кузен Бенедикт","дивакуватий ентомолог, захоплений комахами"],["Том, Геркулес, Бат, Остін, Актеон","вільні темношкірі люди, вірні друзі Діка"],["Негоро","кок-зрадник і работорговець"],["Гаррис","спільник Негоро, обманщик"],["Дінго","розумний пес, що відчуває ворога"]]},

prince:{name:"«Принц і злидар»", author:"Марк Твен, 1881", genre:"Історична повість-казка",
about:"Повість про двох хлопчиків-двійників — бідняка і принца, які помінялися місцями. Через пригоди героїв Твен показує несправедливість суспільства, де людину цінують за одяг і походження, і доводить, що справжня гідність — у доброті й справедливості.",
plot:["У Лондоні XVI століття в один день народжуються Том Кенті — син злодія з бідного кварталу — і принц Едуард, син короля Генріха VIII.","Том мріє про палацове життя. Випадково потрапивши до палацу, він зустрічає принца. Хлопчики схожі як дві краплі води й для гри міняються одягом.","Варта, не впізнавши принца в лахмітті, виганяє його на вулицю. Тепер Едуард живе серед бідняків, зазнає голоду, несправедливості, жорстоких законів.","Принцові допомагає благородний воїн Майлз Гендон. А Том у палаці мусить «бути принцом», а після смерті Генріха — королем; він виявляє милосердя у суді.","На коронації справжній король доводить свою особу: лише він знає, де схована Велика державна печатка. Едуард стає королем і править справедливо, Том отримує його опіку, а Майлз — шану."],
heroes:[["Том Кенті","хлопчик-злидар; мрійливий, добрий, кмітливий"],["Принц Едуард","син короля, згодом Едуард VI; гордий, але чесний і здатний співчувати"],["Майлз Гендон","благородний воїн, що захищає принца"],["Джон Кенті","жорстокий батько Тома, злодій"],["Генріх VIII","король Англії, батько Едуарда"]]},

carol:{name:"«Різдвяна пісня в прозі»", author:"Чарльз Дікенс, 1843", genre:"Повість-казка (різдвяна повість)",
about:"Різдвяна повість про скупого й черствого старого, який за одну ніч переглядає все своє життя завдяки трьом духам і перероджується. Твір про милосердя, людяність і те, що змінитися на краще ніколи не пізно.",
plot:["Ебенезер Скрудж — багатий, скупий лихвар. У Святвечір він відмовляє жертвувати на бідних, кричить «Дурниці!» на привітання племінника Фреда й тримає клерка Боба Кретчита в холодній конторі.","Уночі до Скруджа приходить привид його покійного компаньйона Марлі, закутий у ланцюги, і попереджає про трьох духів.","Дух Минулого Різдва показує самотнє дитинство Скруджа, веселе свято у доброго господаря Феззівіга і наречену, яку Скрудж утратив через любов до грошей.","Дух Теперішнього Різдва веде його до бідної, але щасливої родини Кретчитів і хворого Малого Тіма, а також на свято до Фреда.","Дух Майбутнього Різдва показує самотню смерть Скруджа, якої ніхто не шкодує, і порожнє місце Малого Тіма. Прокинувшись, Скрудж змінюється: стає щедрим, добрим і веселим, допомагає Кретчитам і стає «другим батьком» Малому Тіму."],
heroes:[["Ебенезер Скрудж","скупий лихвар, який духовно перероджується"],["Марлі","покійний компаньйон Скруджа, привид"],["Три духи Різдва","Минулого, Теперішнього й Майбутнього"],["Боб Кретчит","бідний клерк Скруджа"],["Малий Тім","хворий син Боба, символ доброти"],["Фред","веселий і щедрий племінник Скруджа"]]},

christmas:{name:"«Ніч перед Різдвом»", author:"Микола Гоголь, 1832 (збірка «Вечори на хуторі біля Диканьки»)", genre:"Повість",
about:"Весела й поетична повість про різдвяну ніч в українському селі Диканька, де поряд живуть люди й нечиста сила. Коваль Вакула заради кохання здійснює неймовірну мандрівку до самої цариці. Твір сповнений народного гумору, фольклору й українських звичаїв.",
plot:["У різдвяну ніч чорт краде з неба місяць, щоб помститися ковалеві Вакулі, який намалював його смішним на стіні церкви. Відьма Солоха, мати Вакули, літає на мітлі.","Поки козак Чуб із кумом блукають у темряві дорогою до дяка, Вакула приходить до його доньки — гордої красуні Оксани. Вона глузує з коваля й обіцяє вийти за нього, якщо він принесе черевички, «які носить цариця».","До Солохи один за одним приходять «залицяльники» — чорт, голова, дяк і Чуб, — і вона ховає їх у мішки. Вакула, нічого не підозрюючи, виносить мішки з хати.","У відчаї Вакула йде до Пацюка по пораду. З мішка вискакує чорт, але коваль осідлує його й летить до Петербурга. Разом із запорожцями він потрапляє до цариці й отримує черевички.","Вакула повертається додому. Оксана, яка вже думала, що він загинув, зрозуміла, що кохає його. Вакула сватається, Чуб погоджується, а коваль малює на стіні церкви чорта в пеклі."],
heroes:[["Вакула","коваль і маляр; сильний, працьовитий, сміливий, закоханий"],["Оксана","вродлива донька Чуба; спершу горда й вередлива, згодом щира"],["Солоха","мати Вакули, відьма"],["Чорт","смішний, а не страшний; його перехитрює Вакула"],["Чуб","багатий козак, батько Оксани"],["Пацюк","запорожець, до якого вареники стрибають у рот самі"]]},

mio:{name:"«Міо, мій Міо»", author:"Астрід Ліндгрен, 1954", genre:"Повість-казка",
about:"Повість про самотнього хлопчика-сироту, який потрапляє в чарівну Країну Далеку, знаходить там люблячого батька-короля і вірних друзів — і стає лицарем, що перемагає зло. Це казка про любов, дружбу, мужність і віру в себе.",
plot:["Дев'ятирічний Буссе (Бу Вільгельм Ульсон) живе в Стокгольмі в прийомних батьків — тітки Едни й дядька Сікстена, які його не люблять. Його єдиний друг — Бенка.","Одного вечора Буссе випускає з пляшки джина й переноситься до Країни Далекої. Там його батько — король, який давно шукав сина. Хлопчик дізнається своє справжнє ім'я — Міо.","Міо знаходить друга Юм-Юма й отримує білосніжного коня Міраміса. Але він дізнається, що жорстокий лицар Като викрадає дітей і перетворює їх на птахів.","Згідно з пророцтвом, Міо — той, хто має перемогти Като. Разом із Юм-Юмом він вирушає в небезпечний шлях: через Мертвий ліс і темну країну. Люди допомагають їм — дарують хліб, що вгамовує голод, плащ-невидимку, кують для Міо меч.","Міо пронизує мечем кам'яне серце Като. Зло зникає, птахи знову стають дітьми, а Міо повертається до батька — щасливий і любимий."],
heroes:[["Міо (Буссе)","сирота, згодом принц і лицар; добрий, вірний, мужній"],["Король","батько Міо, втілення батьківської любові"],["Юм-Юм","найкращий друг Міо в Країні Далекій"],["Міраміс","білосніжний кінь із золотою гривою"],["Като","жорстокий лицар із кам'яним серцем"],["Бенка","друг Буссе в реальному світі"]]},

kilos:{name:"«35 кіло надії»", author:"Анна Ґавальда, 2002", genre:"Повість",
about:"Сучасна повість про 13-річного хлопця, якому погано дається школа, але золоті руки й велике серце допомагають знайти свій шлях. Твір про родину, дружбу поколінь, віру в себе і про те, що кожна людина має власне покликання.",
plot:["Ґрегуар Дюбоск ненавидить школу з першого дня. Він кілька разів залишається на другий рік, а батьки постійно сваряться через його оцінки.","Єдине місце, де Ґрегуар щасливий, — майстерня дідуся Леона. Разом вони майструють і винаходять різні речі. Дідусь вірить в онука.","Хлопця виключають зі школи. Дізнавшись про технічний коледж, де вчать працювати руками, Ґрегуар сам пише щирого листа директорові — і його приймають.","У коледжі Ґрегуар знаходить друзів, учиться долати страх і власну слабкість, стає впевненішим.","Дідусь Леон тяжко захворює. Тепер онук підтримує діда й надихає його боротися. Фінал залишається відкритим, але сповненим надії."],
heroes:[["Ґрегуар Дюбоск","13-річний хлопець, «35 кілограмів надії»; винахідливий, щирий, наполегливий"],["Дідусь Леон","мудрий, працьовитий, з гумором; головна опора онука"],["Бабуся Марта","дружина Леона"],["Батьки Ґрегуара","люблять сина, але не розуміють його"]]},

lust:{name:"«Жага до життя»", author:"Джек Лондон, 1905", genre:"Оповідання («північне оповідання»)",
about:"Оповідання про людину, яку кинув товариш серед безлюдної північної тундри. Поранений, голодний, переслідуваний вовком, герой бореться за життя й перемагає. Твір про волю, мужність, людяність і зраду.",
plot:["Двоє золотошукачів повертаються з Півночі. Головний герой (його ім'я не назване) підвертає ногу, а його товариш Білл, не озирнувшись, іде далі сам.","Герой залишається сам у тундрі: без їжі й рушниці. Він їсть ягоди, коріння, пташенят, сиру рибу, викидає золото, що стало непотрібним тягарем.","За ним невідступно йде хворий вовк, чекаючи, коли людина впаде.","Герой знаходить кістки Білла й мішечок із його золотом, але не бере його. Знесилений, він повзе до моря.","У сутичці з вовком людина перемагає. Героя помічають і рятують моряки китобійного судна «Бедфорд». На кораблі він ще довго ховає сухарі в матрац — але він живий."],
heroes:[["Головний герой","безіменний золотошукач; витривалий, мужній, зберігає людяність"],["Білл","товариш, що зрадив; гине в тундрі"],["Вовк","хворий хижак, «двійник» людини в боротьбі за життя"]]},

chief:{name:"«Вождь червоношкірих»", author:"О. Генрі, 1907", genre:"Гумористична новела",
about:"Смішна історія про двох невдах-шахраїв, які викрали хлопчика заради викупу, — і про те, як «жертва» перетворила їхнє життя на суцільне випробування. Новела із несподіваною кінцівкою висміює жадібність і дурість.",
plot:["Шахраї Сем і Білл вирішують розбагатіти: викрасти 10-річного сина поважного городянина Ебенезера Дорсета і вимагати 2000 доларів.","Хлопчик із радістю йде з ними: для нього це гра в індіанців. Він називає себе Вождем Червоношкірих.","«Вождь» мучить викрадачів: б'є Білла каменем, намагається зняти з нього скальп, катається на ньому верхи, не дає спати. Додому повертатися не хоче.","Шахраї надсилають батькові листа з вимогою викупу і знижують суму.","Батько відповідає: забере сина, якщо викрадачі самі доплатять йому 250 доларів. Шахраї погоджуються, віддають хлопця й тікають."],
heroes:[["Сем","шахрай, оповідач історії"],["Білл Дрісколл","його спільник, найбільше страждає від «вождя»"],["Джонні («Вождь Червоношкірих»)","10-річний бешкетник, син Дорсета"],["Ебенезер Дорсет","батько хлопчика, кмітливий і спокійний"]]},

jim:{name:"«Джим Ґудзик і машиніст Лукас»", author:"Міхаель Енде, 1960", genre:"Казкова повість",
about:"Казкова повість про темношкірого хлопчика та його дорослого друга-машиніста, які на паровозі мандрують світом, долають небезпеки й визволяють викрадених дітей. Твір про дружбу, сміливість, повагу до кожного й перемогу добра без жорстокості.",
plot:["На крихітний острів, де живуть король, кілька підданих, машиніст Лукас і паровоз Емма, поштар привозить посилку з темношкірим немовлям. Хлопчика називають Джимом Ґудзиком.","Острів замалий для всіх, і король вирішує позбутися паровоза. Лукас не хоче розлучатися з Еммою, і Джим вирушає з ним у подорож.","У країні Мандала друзі дізнаються, що принцесу Лі Сі викрадено й ув'язнено в Місті Драконів у злої драконихи пані Мальцан.","Джим і Лукас долають пустелю «Кінець Світу», зустрічають уявного велетня Тур Тура й напівдракона Непомука, проникають у Місто Драконів.","Друзі перемагають дракониху, визволяють Лі Сі та інших дітей. Переможена дракониха згодом перетворюється на мудрого Золотого Дракона. Герої повертаються додому."],
heroes:[["Джим Ґудзик","темношкірий хлопчик; сміливий, допитливий, щирий"],["Лукас","машиніст, старший друг і наставник Джима"],["Емма","паровоз, «жива» подруга героїв"],["Лі Сі","принцеса Мандали"],["Тур Тур","уявний велетень: здалеку великий, зблизька — звичайний і добрий"],["Пані Мальцан","зла дракониха, що мучить дітей"]]},

basho:{name:"Хайку Мацуо Басьо", author:"Мацуо Басьо, XVII ст.", genre:"Лірика, хайку", poem:true,
about:"Хайку Басьо — короткі вірші про мить у природі: стрибок жаби в старий ставок, ворона на голій гілці, осінній вітер, місяць, цвіт вишні. За однією деталлю прихований глибокий настрій — тиша, самотність, захоплення красою світу.",
plot:["Хайку складається з трьох рядків (5–7–5 складів), без рими.","Кожне хайку має сезонне слово (кіґо), що вказує на пору року.","Поет не розповідає історію, а «зупиняє мить» — одну картину природи.","Почуття поета не назване прямо — воно в підтексті, читач має його відчути."],
plotTitle:"Особливості хайку",
heroes:[["Ліричний герой","поет-мандрівник, уважний спостерігач природи, що бачить красу в простому"]]},

burns:{name:"«Моє серце в верховині…»", author:"Роберт Бернс, 1789", genre:"Лірика, пісня", poem:true,
about:"Вірш про любов до рідного краю — гірської Шотландії. Де б не був ліричний герой, його серце залишається там, у горах, серед лісів, долин і потоків.",
plot:["Ліричний герой перебуває далеко від дому.","Він говорить, що його серце — «в верховині»: там він полює на оленів.","Він прощається з горами, долинами, лісами й гірськими потоками.","Повтор (рефрен) підсилює почуття: серце завжди в рідному краю."],
plotTitle:"Зміст і будова вірша",
heroes:[["Ліричний герой","людина, що тужить за Батьківщиною й вірна їй серцем"]]},

hiawatha:{name:"«Пісня про Гайавату»", author:"Генрі Лонгфелло, 1855", genre:"Поема",
about:"Поема, створена на основі міфів і легенд північноамериканських індіанців. Вона розповідає про життя мудрого героя Гайавати, який служить своєму народу, навчає людей і закликає племена до миру та єднання.",
plot:["Великий Дух Гітчі Маніто запалює Люльку Миру й закликає ворожі племена жити в злагоді: до них прийде пророк, що навчить їх.","Гайавата — син Західного Вітру Меджеківіса й Веноні. Його виховує бабуся Нокоміс, яка навчає його розуміти природу, звірів і птахів.","Гайавата перемагає в двобої Мондаміна — і на тому місці виростає маїс; так люди дістають хліб. Він бореться зі злими силами, захищає народ.","Гайавата одружується з Мінегагою, дочкою з ворожого племені, — і це єднає народи. Він дарує людям малюнкове письмо.","Приходять голод і хвороби, помирає Мінегага. Гайавата прощається з народом і відпливає на захід, назустріч вечірньому сонцю."],
heroes:[["Гайавата","мудрий вождь, учитель і захисник свого народу"],["Нокоміс","бабуся Гайавати, що його виховала"],["Мінегага","кохана дружина Гайавати («Сміхотлива Вода»)"],["Гітчі Маніто","Великий Дух, Володар Життя"],["Меджеківіс","Західний Вітер, батько Гайавати"]]},

smile:{name:"«Усмішка»", author:"Рей Бредбері, 1952", genre:"Науково-фантастичне оповідання (антиутопія)",
about:"Оповідання про майбутнє після руйнівної війни, коли люди зненавиділи все, що нагадує про минуле, навіть мистецтво. Натовп знищує «Джоконду», але хлопчик Том рятує клаптик з її усмішкою. Твір-попередження про руйнування духовних цінностей і віру в те, що краса безсмертна.",
plot:["Після війни світ зруйнований, люди живуть у злиднях. Вони ненавидять минуле й нищать усе, що від нього залишилося.","На міській площі люди стоять у черзі, щоб плюнути на старовинну картину — «Джоконду» Леонардо да Вінчі. У черзі й хлопчик Том.","Том не хоче плювати: він дивиться на картину й бачить її красу.","Оголошують, що картину віддають натовпу. Люди кидаються й шматують полотно. У штовханині Том вихоплює клаптик.","Уночі вдома Том розкриває долоню: на клаптику — Усмішка. Він дивиться на неї в місячному світлі й засинає з надією."],
heroes:[["Том","хлопчик, що відчуває красу; символ надії"],["Натовп","люди, що втратили духовні цінності"],["Ґріґсбі","чоловік у черзі, який розмовляє з Томом"],["Джоконда","образ-символ краси, мистецтва й людяності"]]},

thought:{name:"«Запах думки»", author:"Роберт Шеклі, 1953", genre:"Науково-фантастичне оповідання",
about:"Оповідання про пілота, який потрапляє на планету, де тварини сліпі й глухі, але відчувають людські думки. Щоб вижити, він має навчитися керувати власною свідомістю. Твір про силу людського розуму, уяви й самовладання.",
plot:["Лерой Кліві, пілот поштового космічного корабля, летить на старому несправному кораблі, який ламається в польоті.","Кліві здійснює вимушену посадку на невідомій планеті Мелдж-II.","Він помічає, що тварини тут не бачать і не чують, але відчувають думки — «запах думки». Хижаки йдуть на думки жертви.","Щоб урятуватися, Кліві подумки уявляє себе то одним, то іншим хижаком планети, контролює страх і власні думки.","Кліві витримує всі випробування й дочікується рятувальників."],
heroes:[["Лерой Кліві","поштовий пілот; кмітливий, витривалий, вміє керувати собою"],["Тварини планети Мелдж-II","сліпі й глухі істоти, що сприймають думки"]]},

summer:{name:"«Все літо в один день»", author:"Рей Бредбері, 1954", genre:"Науково-фантастичне оповідання",
about:"Оповідання про дітей на Венері, де сім років безперервно йде дощ, а сонце з'являється лише на дві години. Діти цькують дівчинку Марго, яка пам'ятає сонце із Землі. Твір про дитячу жорстокість, заздрість і неприйняття «іншого».",
plot:["На Венері сім років іде дощ. Сонце має з'явитися лише на дві години. Дев'ятирічні діти його не пам'ятають.","Марго переїхала із Землі п'ять років тому й пам'ятає сонце. Вона тиха, сумна, тримається осторонь. Діти не вірять їй і цькують.","Перед появою сонця діти замикають Марго в комірчині.","Сонце виходить — діти бігають, радіють, грають на сонці. Потім знову починається злива.","Згадавши про Марго, діти соромляться й мовчки відмикають двері комірчини."],
heroes:[["Марго","дівчинка із Землі; ніжна, мрійлива, самотня"],["Вільям","хлопчик, що найбільше цькує Марго"],["Діти класу","натовп, що піддається жорстокості"],["Вчителька","не помічає цькування"]]}
};

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("zl6_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS.find(x=>x.name===l.section); if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return (l.pages? esc(l.pages)+" · ":"")+q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

  $("#app").innerHTML = `

        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
